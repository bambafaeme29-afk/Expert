<section class="module" id="m15" data-module="15" data-payant="1">
<div class="module-tete"><div class="module-num">15</div><h2>Guides pratiques par métier</h2></div>
<div class="objectif"><strong>À la fin de ce module, vous saurez :</strong><ul><li>appliquer l'ensemble des techniques du cours à votre métier ;</li><li>assembler pour chaque activité le bon trio : Projet, Skill, connecteur ;</li><li>réutiliser des prompts d'expert prêts à adapter ;</li><li>savoir où placer les vérifications dans chaque flux.</li></ul></div>
<p>Chaque guide suit la même structure : la <strong>configuration</strong> recommandée, un <strong>prompt d'expert</strong> à adapter, et le <strong>point de contrôle</strong> à ne jamais sauter.</p>
<h3>Dirigeant de PME et commerce</h3>
<div class="tableau"><table><thead><tr><th>Configuration</th><th>Usage clé</th><th>Point de contrôle</th></tr></thead><tbody><tr><td>Projet « Pilotage » avec tarifs, conditions générales, tableau de bord mensuel ; Skill « devis maison » ; connecteurs messagerie et agenda en lecture</td><td>Devis, relances, synthèse mensuelle, préparation de réunions</td><td>Tout prix et tout engagement vérifiés contre la grille officielle avant envoi</td></tr></tbody></table></div>
<div class="prompt bon"><span class="lbl">Synthèse mensuelle du dirigeant</span><button class="copier" type="button">Copier</button><pre>&lt;ventes&gt;[fichier des ventes du mois]&lt;/ventes&gt;
&lt;charges&gt;[fichier des charges du mois]&lt;/charges&gt;
Calcule par exécution de code : chiffre d'affaires, marge brute, charges par poste, trésorerie de fin de mois, et l'écart avec le mois précédent. Présente un tableau d'une page, puis les trois signaux qui méritent mon attention, avec pour chacun le chiffre qui le justifie. Termine par les questions que je devrais poser à mon comptable.</pre></div>
<h3>Comptabilité et finance</h3>
<div class="tableau"><table><thead><tr><th>Configuration</th><th>Usage clé</th><th>Point de contrôle</th></tr></thead><tbody><tr><td>Projet par client, référentiel SYSCOHADA dans les connaissances ; Skill d'extraction de pièces ; exécution de code activée</td><td>Extraction de factures, rapprochements, préparation de liasses, notes d'analyse</td><td>Totaux recalculés par le code et rapprochés des relevés ; aucun taux sans source</td></tr></tbody></table></div>
<div class="prompt bon"><span class="lbl">Rapprochement bancaire</span><button class="copier" type="button">Copier</button><pre>&lt;releve&gt;[relevé bancaire du mois]&lt;/releve&gt;
&lt;grand_livre&gt;[extrait du compte banque]&lt;/grand_livre&gt;
Rapproche ligne à ligne par exécution de code (montant et date à plus ou moins 3 jours). Produis trois tableaux : lignes rapprochées, lignes présentes seulement au relevé, lignes présentes seulement au grand livre. Pour chaque ligne non rapprochée, propose une explication possible sans la présenter comme certaine.</pre></div>
<h3>Juridique et contrats</h3>
<div class="tableau"><table><thead><tr><th>Configuration</th><th>Usage clé</th><th>Point de contrôle</th></tr></thead><tbody><tr><td>Projet avec vos contrats types et votre doctrine interne ; recherche web pour les textes à jour ; offre professionnelle pour la confidentialité</td><td>Revue de contrats, comparaison de versions, veille, premiers projets d'actes</td><td>Chaque article cité ouvert dans le texte officiel ; décision finale par un juriste</td></tr></tbody></table></div>
<div class="prompt bon"><span class="lbl">Revue de contrat fournisseur</span><button class="copier" type="button">Copier</button><pre>Tu es juriste d'entreprise, droit OHADA. Voici notre grille de négociation et le contrat proposé par le fournisseur.
&lt;grille&gt;[nos positions : plafond de responsabilité, pénalités, délais de paiement, juridiction…]&lt;/grille&gt;
&lt;contrat&gt;[contrat]&lt;/contrat&gt;
Pour chaque point de la grille : extrais la clause exacte (avec son numéro), compare à notre position, classe l'écart (acceptable, à négocier, bloquant) et propose une rédaction alternative. Signale aussi les clauses inhabituelles absentes de la grille.</pre></div>
<h3>Ressources humaines</h3>
<div class="tableau"><table><thead><tr><th>Configuration</th><th>Usage clé</th><th>Point de contrôle</th></tr></thead><tbody><tr><td>Projet RH avec fiches de poste, grille de compétences, politique interne ; données de candidats anonymisées</td><td>Fiches de poste, grilles d'entretien, plans de formation, communication interne</td><td>Décisions sur les personnes prises par un humain, sur des critères écrits ; pas de données sensibles</td></tr></tbody></table></div>
<div class="prompt bon"><span class="lbl">Grille d'entretien structurée</span><button class="copier" type="button">Copier</button><pre>À partir de la fiche de poste ci-dessous, crée une grille d'entretien structurée : 6 compétences clés, pour chacune deux questions comportementales (« racontez une situation où… »), les indices d'une réponse forte et d'une réponse faible, et une échelle de 1 à 4 décrite. Aucune question sur la vie privée, l'âge, la religion, la situation familiale ou l'origine.
&lt;fiche_de_poste&gt;[fiche]&lt;/fiche_de_poste&gt;</pre></div>
<h3>Marketing et communication</h3>
<div class="tableau"><table><thead><tr><th>Configuration</th><th>Usage clé</th><th>Point de contrôle</th></tr></thead><tbody><tr><td>Style personnalisé créé à partir de vos meilleurs textes ; Projet avec charte de marque et offres ; connecteur Canva</td><td>Calendrier éditorial, déclinaisons de messages, fiches produits, réponses aux avis</td><td>Aucune promesse ni chiffre non validés ; relecture du ton avant publication</td></tr></tbody></table></div>
<div class="prompt bon"><span class="lbl">Déclinaison d'une campagne</span><button class="copier" type="button">Copier</button><pre>&lt;offre&gt;[offre du mois]&lt;/offre&gt;
&lt;charte&gt;[ton, mots à éviter, mentions obligatoires]&lt;/charte&gt;
Décline cette offre en : un post Facebook (80 mots), un message WhatsApp (40 mots), un script de spot radio de 30 secondes en français, et une version courte à faire traduire en wolof par un locuteur natif. Respecte la charte. Propose deux accroches différentes pour chaque format.</pre></div>
<h3>Enseignement et formation</h3>
<div class="tableau"><table><thead><tr><th>Configuration</th><th>Usage clé</th><th>Point de contrôle</th></tr></thead><tbody><tr><td>Projet par classe ou module, avec programme officiel et progression ; Artifacts pour les exercices interactifs</td><td>Séquences, exercices différenciés, corrigés, grilles d'évaluation, quiz</td><td>Exactitude disciplinaire vérifiée par l'enseignant ; respect des règles de l'établissement sur l'IA</td></tr></tbody></table></div>
<div class="prompt bon"><span class="lbl">Exercices différenciés</span><button class="copier" type="button">Copier</button><pre>Programme : [niveau, chapitre]. Crée trois versions d'une même série de 5 exercices : niveau soutien, niveau standard, niveau approfondissement. Pour chaque exercice : énoncé, corrigé détaillé, erreur fréquente des élèves et remédiation. Contextualise les situations dans la vie quotidienne au Sénégal.</pre></div>
<h3>Agriculture et élevage</h3>
<div class="tableau"><table><thead><tr><th>Configuration</th><th>Usage clé</th><th>Point de contrôle</th></tr></thead><tbody><tr><td>Projet « Ferme » avec registres de production, protocoles sanitaires validés par le vétérinaire, prix des intrants ; Artifact de suivi quotidien</td><td>Analyse des performances, budgets, plans d'alimentation, alertes</td><td>Tout traitement ou vaccin validé par un vétérinaire ; chiffres recalculés</td></tr></tbody></table></div>
<div class="prompt bon"><span class="lbl">Diagnostic de performance d'un lot</span><button class="copier" type="button">Copier</button><pre>&lt;registre&gt;[registre des 8 dernières semaines : effectif, ponte, mortalité, aliment]&lt;/registre&gt;
&lt;reference&gt;[courbe de ponte de référence de la souche]&lt;/reference&gt;
Compare par exécution de code les performances du lot à la référence semaine par semaine. Classe les écarts par gravité. Pour chaque écart important, liste les causes possibles (alimentation, eau, lumière, température, sanitaire, stress) avec l'indice qui orienterait vers chacune et la vérification à faire sur place. Ne pose aucun diagnostic sanitaire : indique quand il faut appeler le vétérinaire.</pre></div>
<h3>Ingénierie, BTP et mines</h3>
<div class="tableau"><table><thead><tr><th>Configuration</th><th>Usage clé</th><th>Point de contrôle</th></tr></thead><tbody><tr><td>Projet par chantier avec normes, rapports et données de terrain ; Skills pour les rapports types ; Claude Code pour les traitements de données</td><td>Rapports journaliers, synthèses de campagnes de sondage, métrés, analyse de résultats d'essais</td><td>Calculs de dimensionnement vérifiés par un ingénieur ; références normatives contrôlées</td></tr></tbody></table></div>
<div class="prompt bon"><span class="lbl">Synthèse d'une campagne d'essais</span><button class="copier" type="button">Copier</button><pre>&lt;resultats&gt;[tableau des essais : référence échantillon, profondeur, type d'essai, résultat]&lt;/resultats&gt;
Par exécution de code : statistiques par type d'essai et par horizon (moyenne, écart-type, minimum, maximum, nombre d'essais), repérage des valeurs aberrantes, graphique des résultats en fonction de la profondeur. Rédige ensuite une synthèse technique d'une page qui distingue clairement les constats issus des données et les interprétations, et liste les essais complémentaires à envisager.</pre></div>
<h3>Recherche et rédaction académique</h3>
<div class="tableau"><table><thead><tr><th>Configuration</th><th>Usage clé</th><th>Point de contrôle</th></tr></thead><tbody><tr><td>Projet par travail de recherche avec plan, notes et bibliographie ; recherche approfondie pour l'état de l'art</td><td>Plan, revue de littérature, relecture, mise aux normes de citation</td><td>Chaque référence vérifiée dans la source réelle ; respect des règles de l'institution</td></tr></tbody></table></div>
<div class="prompt bon"><span class="lbl">Relecture académique sans réécriture</span><button class="copier" type="button">Copier</button><pre>Relis le chapitre ci-dessous en tant que directeur de mémoire exigeant. Ne réécris rien. Produis un tableau : passage cité, problème (argumentation, clarté, source manquante, orthographe), gravité, suggestion. Termine par les trois améliorations qui auraient le plus d'impact sur la note.</pre></div>

<section class="module" id="pratique" data-payant="1">
<div class="module-tete"><div class="module-num">★</div><h2>Projet final, glossaire et FAQ</h2></div>
<h3>Projet final : votre système d'IA professionnel</h3>
<p>Ce projet réunit tout le cours. Vous concevez, testez et documentez un système complet autour d'une activité réelle et récurrente. Comptez trois à quatre heures, réparties sur une semaine.</p>
<div class="exo"><label><input type="checkbox"><span><strong>Étape 1. Choisir et cadrer.</strong> Une activité fréquente et mesurable. Écrivez l'objectif, les utilisateurs, et trois critères de réussite mesurables (module 12).</span></label></div>
<div class="exo"><label><input type="checkbox"><span><strong>Étape 2. Le contexte.</strong> Créez le Projet : instructions de niveau expert avec hiérarchie des sources, seuils d'escalade et test d'acceptation (module 4), et une base documentaire organisée avec un fichier index.</span></label></div>
<div class="exo"><label><input type="checkbox"><span><strong>Étape 3. Les prompts.</strong> Rédigez deux prompts en huit blocs avec le générateur du module 2, puis passez-les à l'auditeur et corrigez.</span></label></div>
<div class="exo"><label><input type="checkbox"><span><strong>Étape 4. La Skill.</strong> Transformez la méthode la plus répétitive en Skill : SKILL.md avec une description précise, la méthode, les règles, le contrôle final (module 7). Importez-la et vérifiez qu'elle se déclenche au bon moment, et seulement à ce moment.</span></label></div>
<div class="exo"><label><input type="checkbox"><span><strong>Étape 5. L'outil.</strong> Construisez un Artifact à partir d'une spécification complète (module 6), avec ses cas limites.</span></label></div>

<div class="exo"><label><input type="checkbox"><span><strong>Étape 7. L'évaluation.</strong> Un jeu de 15 cas de test, dont 5 difficiles et 2 pièges. Mesurez, améliorez une chose, mesurez à nouveau (module 12).</span></label></div>
<div class="exo"><label><input type="checkbox"><span><strong>Étape 8. La sécurité.</strong> Passez le système à la règle des trois facteurs et à la défense en profondeur ; notez ce que vous avez restreint (module 13).</span></label></div>

<h3>Grille d'auto-évaluation de l'expert</h3>
<div class="tableau"><table><thead><tr><th>Compétence</th><th>Avancé</th><th>Expert</th><th>Référent</th></tr></thead><tbody><tr><td>Prompts</td><td>Balises et exemples</td><td>Huit blocs, chaînage, schémas avancés, audit</td><td>Bibliothèque partagée et évaluée</td></tr><tr><td>Contexte</td><td>Projet avec instructions</td><td>Architecture documentaire, hiérarchie des sources, compaction</td><td>Modèles de Projets pour l'organisation</td></tr><tr><td>Raisonnement et vérification</td><td>Relecture critique</td><td>Réflexion calibrée, vérificateur indépendant, exécution de code</td><td>Procédures de vérification écrites</td></tr><tr><td>Skills et MCP</td><td>Utilisation</td><td>Création, test et sécurisation</td><td>Catalogue interne maintenu</td></tr><tr><td>Agents</td><td>Délégations simples</td><td>Conception en sept décisions, échelle d'autonomie</td><td>Agents en production surveillés</td></tr><tr><td>Évaluation</td><td>Essais informels</td><td>Jeu de test, notation, amélioration sans régression</td><td>Évaluations automatisées et suivies</td></tr><tr><td>Sécurité et gouvernance</td><td>Bonnes habitudes</td><td>Trois facteurs, défense en profondeur, cadre juridique</td><td>Politique d'usage adoptée et appliquée</td></tr><tr><td>Déploiement</td><td>Usage personnel</td><td>Chiffrage et mesure du retour sur investissement</td><td>Pilote conduit et étendu</td></tr></tbody></table></div>
<h3>Votre plan des 90 prochains jours</h3>
<div class="grille"><div class="carte"><h4>Jours 1 à 30 : consolider</h4><p>Terminez le projet final. Chaque semaine, appliquez une technique avancée à une vraie tâche et notez le résultat.</p></div><div class="carte"><h4>Jours 31 à 60 : industrialiser</h4><p>Créez trois Skills et une bibliothèque de dix prompts évalués. Ajoutez un connecteur utile, en moindre privilège.</p></div><div class="carte"><h4>Jours 61 à 90 : transmettre</h4><p>Formez deux personnes avec les cours débutant et intermédiaire, conduisez un pilote dans votre équipe, mesurez.</p></div></div>
<h3>Glossaire de l'expert</h3>
<div class="tableau"><table><thead><tr><th>Terme</th><th>Signification</th></tr></thead><tbody><tr><td>Agent</td><td>Système où le modèle décide lui-même des étapes et des outils pour atteindre un objectif, en boucle</td></tr><tr><td>Agent SDK</td><td>Kit de développement qui fournit la boucle agentique de Claude Code pour construire ses propres agents</td></tr><tr><td>Aiguillage (routage)</td><td>Schéma où une première étape oriente chaque demande vers le traitement adapté</td></tr><tr><td>API</td><td>Interface de programmation qui permet d'appeler Claude depuis un logiciel, facturée au token</td></tr><tr><td>Auto-cohérence</td><td>Comparer plusieurs réponses indépendantes pour repérer les points solides et les points douteux</td></tr><tr><td>Cache de prompt</td><td>Mise en mémoire des parties répétées d'un prompt, facturées à une fraction du prix lors des réutilisations</td></tr><tr><td>Chaînage</td><td>Découpage d'une tâche en étapes successives, la sortie de l'une alimentant la suivante</td></tr><tr><td>Chargement progressif</td><td>Mécanisme des Skills : description toujours visible, instructions et fichiers chargés à la demande</td></tr><tr><td>CLAUDE.md</td><td>Fichier de consignes d'un projet, lu automatiquement par Claude Code à chaque session</td></tr><tr><td>Compaction</td><td>Résumé structuré d'un contexte saturé, pour poursuivre dans un contexte neuf</td></tr><tr><td>Défense en profondeur</td><td>Empilement de protections indépendantes, aucune n'étant parfaite seule</td></tr><tr><td>Évaluation (eval)</td><td>Mesure systématique de la qualité d'un prompt, d'une Skill ou d'un agent sur un jeu de test</td></tr><tr><td>Few-shot</td><td>Technique qui consiste à fournir quelques exemples dans le prompt</td></tr><tr><td>Fenêtre de contexte</td><td>Quantité maximale de tokens que le modèle peut lire en une fois</td></tr><tr><td>Hook</td><td>Commande exécutée automatiquement à un moment précis du travail d'un agent : un garde-fou déterministe</td></tr><tr><td>IA constitutionnelle</td><td>Méthode d'entraînement d'Anthropic fondée sur des principes écrits qui guident le comportement du modèle</td></tr><tr><td>Ingénierie du contexte</td><td>Art de fournir au modèle le plus petit ensemble d'informations à fort signal</td></tr><tr><td>Injection de consignes</td><td>Instruction cachée dans un contenu lu par l'IA pour la détourner</td></tr><tr><td>MCP</td><td>Model Context Protocol : standard ouvert pour relier un assistant à des outils et des données</td></tr><tr><td>Mode plan</td><td>Mode où l'agent explore et propose un plan sans rien modifier</td></tr><tr><td>Modèle juge</td><td>Modèle utilisé pour noter les réponses d'un autre selon une grille</td></tr><tr><td>Moindre privilège</td><td>Ne donner que les accès strictement nécessaires à une tâche</td></tr><tr><td>Post-entraînement</td><td>Phase où le modèle apprend à être utile, honnête et prudent, après le pré-entraînement</td></tr><tr><td>Prompt système</td><td>Cadre permanent d'une application : rôle, règles, format</td></tr><tr><td>Réflexion étendue ou adaptative</td><td>Raisonnement intermédiaire produit avant la réponse, avec un budget ou un effort réglable</td></tr><tr><td>Skill</td><td>Dossier de savoir-faire (SKILL.md, ressources, scripts) que Claude charge quand il est utile</td></tr><tr><td>Sortie structurée</td><td>Réponse conforme à un schéma (souvent JSON), directement exploitable par un logiciel</td></tr><tr><td>Sous-agent</td><td>Agent spécialisé lancé par un autre, avec son propre contexte, qui ne renvoie qu'un résumé</td></tr><tr><td>Température</td><td>Réglage de la part d'aléatoire dans la génération</td></tr><tr><td>Token</td><td>Morceau de texte, unité de lecture, d'écriture et de facturation du modèle</td></tr><tr><td>Traitement par lots</td><td>Envoi différé de nombreuses demandes à prix réduit</td></tr><tr><td>Trois facteurs (trifecta létale)</td><td>Données privées + contenu non fiable + communication vers l'extérieur : la combinaison à risque</td></tr><tr><td>Utilisation d'outils (tool use)</td><td>Mécanisme par lequel le modèle demande l'exécution d'un outil et reçoit son résultat</td></tr><tr><td>Workflow</td><td>Enchaînement d'étapes défini à l'avance, chaque étape faisant appel au modèle</td></tr></tbody></table></div>
<h3>Questions fréquentes</h3>
<details><summary>Faut-il savoir programmer pour devenir expert de Claude ?</summary><div class="contenu"><p>Non. Les modules 1 à 7, 10, 12 à 15 se pratiquent entièrement sans code. Les modules techniques (9 et 11) vous apprennent ce qui est possible, comment le demander à un développeur, ou comment le faire faire par Claude lui-même : Claude Code et Cowork permettent déjà beaucoup à des non-programmeurs.</p></div></details>
<details><summary>Un nouveau modèle vient de sortir. Dois-je tout refaire ?</summary><div class="contenu"><p>Non. Vos Projets, Skills et prompts restent valables. Faites passer votre jeu de test au nouveau modèle : s'il fait mieux, adoptez-le ; sinon, restez. Ajustez éventuellement les prompts qui s'appuyaient sur des contournements devenus inutiles.</p></div></details>
<details><summary>Quelle est la différence entre une Skill et un Projet ?</summary><div class="contenu"><p>Le Projet rassemble le contexte et les documents d'un dossier ; la Skill est un savoir-faire réutilisable dans tous vos dossiers, chargé automatiquement quand il est utile. On les combine : un Projet « Client X » et une Skill « Devis maison ».</p></div></details>
<details><summary>Comment éviter que Claude invente des chiffres ou des références ?</summary><div class="contenu"><p>Combinez : fournir les sources, exiger l'extraction de citations, autoriser « je ne sais pas », calculer par exécution de code, faire vérifier par une conversation indépendante, et ouvrir les sources importantes. Aucune technique seule ne suffit ; ensemble, elles réduisent très fortement le risque.</p></div></details>
<details><summary>Puis-je laisser un agent travailler seul toute la nuit ?</summary><div class="contenu"><p>Oui, pour des tâches réversibles, bien testées, dans un environnement isolé, avec un journal et des critères d'arrêt. Non, pour toute tâche qui envoie, paie, supprime ou publie : ces actions attendent votre validation.</p></div></details>
<details><summary>Comment rester à jour ?</summary><div class="contenu"><p>Suivez les annonces d'Anthropic, le centre d'aide (<a href="https://support.claude.com" target="_blank" rel="noopener">support.claude.com</a>), la documentation (<a href="https://docs.claude.com" target="_blank" rel="noopener">docs.claude.com</a>) et les publications techniques de son blog d'ingénierie. Réservez une heure par mois pour tester une nouveauté sur une vraie tâche.</p></div></details>
<details><summary>Ce certificat est-il reconnu par Anthropic ?</summary><div class="contenu"><p>Non. Il atteste que vous avez suivi ce cours et réussi ses quiz. Votre véritable preuve d'expertise sera votre projet final : un système qui fonctionne, documenté et mesuré.</p></div></details>

<div class="encart astuce"><b class="t">Bravo pour avoir terminé le cours expert !</b><p>Vous avez parcouru tout le spectre : du fonctionnement interne d'un modèle jusqu'au déploiement en organisation. Rendez-vous dans la section « Votre certificat ». Puis passez au projet final : c'est en construisant que l'expertise se consolide.</p></div>
</section>

  <b class="t">Before you start</b>
  <p>This course assumes you have mastered the beginner and intermediate courses: structured requests, Projects, files, Artifacts, research, privacy and verification. It goes much further, all the way to technical tools (Claude Code, the API, MCP). The technical modules remain readable without programming skills: you learn what is possible and how to ask for it. Claude evolves very quickly: this content reflects Claude as of <strong>November 2026</strong>. Model names, buttons, prices and limits change; the principles remain. Always check details at <a href="https://support.claude.com" target="_blank" rel="noopener">support.claude.com</a> and <a href="https://docs.claude.com" target="_blank" rel="noopener">docs.claude.com</a>.</p>
  <p>The examples are set in Senegal (amounts in FCFA, local businesses): the methods apply everywhere. This course is also available in French: use the <strong>Français</strong> button above. Your progress is kept when you switch languages.</p>

<div class="module-tete"><div class="module-num">1</div><h2>Under the hood: how Claude works</h2></div>
<div class="objectif"><strong>By the end of this module, you will be able to:</strong><ul><li>explain in simple terms how a language model produces an answer;</li><li>connect this to Claude's strengths and weaknesses (hallucinations, sycophancy, sensitivity to wording);</li><li>reason in terms of tokens, context window and cost;</li><li>choose a model with a method rather than at random.</li></ul></div>
<p>At beginner level, you learned to <em>talk</em> to Claude. At intermediate level, to <em>steer</em> it. At expert level, you will learn to <strong>design</strong> with it: prompts, contexts, tools, agents. That requires an accurate mental model of what Claude is. No mathematics needed: five ideas are enough.</p>
<h3>Where do you stand?</h3>
<p>Tick what you can already do without help. The result tells you how to approach this course.</p>

<h3>Five ideas to understand a language model</h3>
<div class="formule"><div><b>1. Tokens</b><span>Claude reads neither letters nor words, but pieces of text called tokens. Everything is counted in tokens: what it reads, what it writes, what you pay for.</span></div><div><b>2. The next token</b><span>Claude produces its answer one token at a time. At each step, it computes which piece of text makes the most sense after everything before it, then starts again.</span></div><div><b>3. Pre-training</b><span>The model first learned from a vast amount of text. It drew knowledge, skills and ways of reasoning from it, frozen at a cutoff date.</span></div><div><b>4. Post-training</b><span>Anthropic then trained it to be helpful, honest and careful, using human feedback and its own method, Constitutional AI: written principles that guide its behavior.</span></div><div><b>5. Frozen weights</b><span>During your conversation, Claude does not learn anything in the strict sense. Everything that "changes" comes from the context: your messages, your files, its memory, the results of its tools.</span></div></div>
<p>These five ideas explain almost everything you observe day to day:</p>
<div class="tableau"><table><thead><tr><th>What you observe</th><th>The explanation</th><th>The expert's countermeasure</th></tr></thead><tbody><tr><td>A wrong but very well-written answer</td><td>The model produces what is <em>plausible</em>, and plausible is not always true</td><td>Provide sources, require citations, verify</td></tr><tr><td>A different answer when you rephrase</td><td>Every word in the context influences the computation of the next token</td><td>Stabilize your prompts, test them on several cases</td></tr><tr><td>Claude agrees with you</td><td>Training rewards answers that humans find helpful, which can create sycophancy</td><td>Ask for contradiction, do not reveal your preference</td></tr><tr><td>It ignores a recent event</td><td>Its knowledge stops at a cutoff date</td><td>Turn on web search or provide the document</td></tr><tr><td>It "forgets" an instruction in a very long conversation</td><td>The more loaded the context, the more diluted the attention</td><td>Short, clean context, instructions repeated in the right places</td></tr><tr><td>It excels at writing, translating, structuring</td><td>These skills are everywhere in its training data</td><td>Give it these tasks first</td></tr></tbody></table></div>
<div class="encart astuce"><b class="t">The right mental model</b><p>Picture a brilliant, highly cultured, extremely fast colleague who arrives on day one knowing nothing about your company, who does not always dare to say "I don't know", and whose memory is limited to the pile of documents on their desk. Your job as an expert: prepare the best possible pile and check their work.</p></div>
<h3>Context: everything Claude sees</h3>
<p>Before each answer, Claude rereads its entire context. For an expert, it helps to break it down precisely, because each layer is adjusted in a different place.</p>
<figure class="schema"><svg viewBox="0 0 820 330" role="img" aria-label="The layers of Claude's context" xmlns="http://www.w3.org/2000/svg" font-family="Arial,Helvetica,sans-serif">
<text x="410" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1B1915">What Claude reads before each answer</text>
<g font-size="14">
<rect x="40" y="52" width="740" height="34" rx="8" fill="#1B1915"/><text x="56" y="74" fill="#fff" font-weight="700">1. System instructions</text><text x="770" y="74" fill="#F2B65C" text-anchor="end">set by Anthropic or by the application (API)</text>

<rect x="40" y="132" width="740" height="34" rx="8" fill="#D97857"/><text x="56" y="154" fill="#fff" font-weight="700">3. Available tools</text><text x="770" y="154" fill="#fff" text-anchor="end">connector descriptions, Skills, search, code</text>

<p>Three engineering rules follow from this diagram:</p>
<ol><li><strong>Signal over volume.</strong> A longer context is not a better context. Beyond a certain point, each useless document dilutes the attention paid to the useful ones.</li><li><strong>Placement matters.</strong> For a long document, put it at the start of the message and ask your question at the end: this layout generally gives the best results.</li><li><strong>What comes back often moves up a level.</strong> An instruction repeated in three conversations should become a Project instruction, a preference or a Skill (module 7).</li></ol>
<h3>Tokens and costs: think like an engineer</h3>
<p>In English, a token is roughly 4 characters, or about 0.75 words; French and other accented languages usually take a little more (about 3 to 4 characters per token). A dense A4 page is in the order of 800 to 1,000 tokens. These are orders of magnitude: only the official counter (in the Console or via the API) is exact.</p>
<p>On the API, you pay separately for <strong>input tokens</strong> (what Claude reads) and <strong>output tokens</strong> (what it writes, including its reasoning), at a price per million tokens. Output costs significantly more than input. On claude.ai, you do not pay per token, but your <strong>usage limits</strong> follow the same logic: long context, powerful model and extended thinking use up your quota faster.</p>

<h3>The Claude model family</h3>
<p>Anthropic releases several generations of models, and within each generation several sizes. In November 2026, the most recent generation is the Claude 5 family, which includes in particular <strong>Haiku 5.5</strong>, <strong>Sonnet 5.5</strong>, <strong>Opus 5.5</strong> and <strong>Fable 5.2</strong>. The names will change: remember the logic of the tiers rather than the numbers, and check Anthropic's models page for the exact positioning of each.</p>
<div class="tableau"><table><thead><tr><th>Tier</th><th>Profile</th><th>Typical uses</th></tr></thead><tbody><tr><td>Haiku</td><td>Fastest and most economical</td><td>Sorting, classification, high-volume extraction, instant answers, agent sub-tasks</td></tr><tr><td>Sonnet</td><td>Balance of quality, speed and cost</td><td>Most of the work: writing, analysis, code, everyday agents</td></tr><tr><td>Opus and frontier models</td><td>Maximum reasoning capability</td><td>Hard problems, long autonomous tasks, complex code, high-stakes decisions</td></tr></tbody></table></div>
<div class="encart note"><b class="t">The expert's method: escalation</b><p>Do not pick "the best model" on principle. First define what a good result is (module 12), test with the lightest reasonable model, then move up a tier only if the tests fail. For high-volume systems, combine them: a light model sorts, a powerful model handles the difficult cases.</p></div>
<h3>Settings an expert knows</h3>
<p>On claude.ai, most settings are hidden. On the API, you see more of them. Knowing what they do helps you understand the behavior you observe.</p>
<div class="tableau"><table><thead><tr><th>Setting</th><th>Role</th><th>Advice</th></tr></thead><tbody><tr><td>Temperature</td><td>Amount of randomness in token choice</td><td>Low for extraction and analysis, higher for creativity. With extended thinking, it usually cannot be changed</td></tr><tr><td>Maximum output length</td><td>Ceiling on the tokens Claude can write</td><td>Too low and the answer is cut off; leave room, especially with thinking</td></tr><tr><td>Stop sequences</td><td>Text that interrupts generation</td><td>Useful for tightly controlled formats</td></tr><tr><td>Thinking effort or budget</td><td>Amount of reasoning allowed</td><td>More thinking = more quality on hard problems, but more time and cost (module 3)</td></tr></tbody></table></div>
<div class="encart attention"><b class="t">A limit to keep in mind</b><p>Even perfectly steered, Claude remains a probabilistic system. Two identical calls can give two different answers. A professional system therefore never relies on a single unverified answer: it includes tests, validations and, for sensitive actions, a human decision.</p></div>

<section class="module" id="m2" data-module="2" data-payant="1">
<div class="module-tete"><div class="module-num">2</div><h2>Expert-level prompt engineering</h2></div>
<div class="objectif"><strong>By the end of this module, you will be able to:</strong><ul><li>build a complete eight-block prompt for complex and recurring tasks;</li><li>master tags, examples, chaining and output formats;</li><li>use advanced patterns: critique and revision, self-consistency, quote extraction;</li><li>audit an existing prompt and fix it before deploying it.</li></ul></div>
<p>An expert prompt is not a magic formula. It is a <strong>specification</strong>: it says who, what, for whom, from what material, in what form, within which limits, and how to check. Recent models follow instructions very precisely: they do what you write, not what you had in mind. The expert's job is therefore to write exactly what they want.</p>
<div class="encart astuce"><b class="t">The colleague test</b><p>Before sending an important prompt, imagine handing it to a capable colleague who knows nothing about the matter. Would they understand the goal, the audience, the format and the limits without asking you a question? If not, neither will Claude.</p></div>
<h3>Anatomy of an eight-block prompt</h3>
<div class="tableau"><table><thead><tr><th>Block</th><th>Content</th><th>Why it helps</th></tr></thead><tbody><tr><td>1. Role</td><td>The expected point of view and standard</td><td>Sets vocabulary, depth and priorities</td></tr><tr><td>2. Goal</td><td>The <em>why</em> of the task and how the result will be used</td><td>Claude makes better trade-offs when it knows the purpose</td></tr><tr><td>3. Context</td><td>Audience, situation, local constraints</td><td>Avoids generic answers</td></tr><tr><td>4. Data</td><td>The documents, inside tags</td><td>Clearly separates what to read from what to do</td></tr><tr><td>5. Task</td><td>The expected steps, with action verbs</td><td>Makes the work repeatable</td></tr><tr><td>6. Examples</td><td>Two to five reference cases</td><td>Shows the result better than a description</td></tr><tr><td>7. Format</td><td>Structure, length, tone, language</td><td>Makes the output directly usable</td></tr><tr><td>8. Verification</td><td>What Claude must check and flag</td><td>Surfaces uncertainty instead of hiding it</td></tr></tbody></table></div>
<div class="prompt bon"><span class="lbl">Complete example: analyzing a call for tenders</span><button class="copier" type="button">Copy</button><pre>You are a senior bid manager specialized in public works contracts in Senegal.

&lt;goal&gt;
I must decide by Friday whether our company bids for this tender. Your analysis will be the basis for the decision meeting with management.
&lt;/goal&gt;

&lt;context&gt;
Construction company with 45 employees based in Thiès, annual revenue about 1.8 billion FCFA. We have already carried out boreholes and small sanitation works, never a road.
&lt;/context&gt;

&lt;documents&gt;
&lt;document name="tender_file"&gt;[paste or attach the tender documents]&lt;/document&gt;
&lt;document name="company_references"&gt;[paste our list of references]&lt;/document&gt;
&lt;/documents&gt;

&lt;task&gt;
1. Extract into &lt;quotes&gt; the exact passages of the tender file that set the eligibility criteria, deadlines and guarantees.
2. Using only these quotes, assess our eligibility criterion by criterion.
3. Identify the three main risks for us.
4. Make a recommendation: bid, bid as a consortium, or do not bid.
&lt;/task&gt;

&lt;format&gt;
A table (criterion, quoted requirement, our situation, compliant yes/no/to check), then the risks, then the recommendation in five lines maximum. Professional English, no unnecessary jargon.
&lt;/format&gt;

&lt;verification&gt;
Do not invent any requirement that is not in the tender file. If information is missing to conclude, write "to check" and state which document would contain it. End with your overall confidence level.
&lt;/verification&gt;</pre></div>
<h3>Tags: the expert's grammar</h3>
<p>Claude has been trained to make use of tagged structures. A few rules are enough:</p>
<ul><li>Choose explicit names and keep them identical throughout the prompt: if you write <code>&lt;contract&gt;</code>, do not later call it "the document".</li><li>Refer to the tags in your instructions: "based only on the content of <code>&lt;contract&gt;</code>".</li><li>Nest them when there are several documents: <code>&lt;documents&gt;</code> containing several <code>&lt;document name="…"&gt;</code>.</li><li>Also ask for tagged output when you want to separate reasoning from result: <code>&lt;analysis&gt;</code> then <code>&lt;answer&gt;</code>. You can then keep only the answer.</li></ul>
<h3>Examples: the most underrated technique</h3>
<p>A description of the expected style leaves room for interpretation. Examples remove it. To make them effective:</p>
<ol><li>Give <strong>three to five</strong>, <strong>varied</strong> enough for Claude to grasp the principle rather than copy a single model.</li><li>Include at least one <strong>difficult</strong> or edge case, with the expected answer.</li><li>Wrap them: <code>&lt;examples&gt;&lt;example&gt;…&lt;/example&gt;&lt;/examples&gt;</code>, and specify "these are illustrations, do not copy their content".</li><li>Check that they are consistent with your instructions: when they conflict, Claude often follows the example.</li></ol>
<h3>Explain the why</h3>
<p>An instruction that comes with its reason is applied better and generalized better. "Never use ellipses" is less effective than "This text will be read by a text-to-speech engine that cannot pronounce ellipses, so do not use any". Claude then understands the intent and also applies it to cases you had not foreseen.</p>
<h3>Say what you want, and calibrate it</h3>
<div class="tableau"><table><thead><tr><th>Less effective</th><th>More effective</th></tr></thead><tbody><tr><td>Don't use a list.</td><td>Write in flowing paragraphs, with transitions.</td></tr><tr><td>Be brief.</td><td>120 words maximum, three sentences per paragraph.</td></tr><tr><td>Be creative!</td><td>Suggest three very different concepts, including one unexpected one.</td></tr><tr><td>IMPORTANT!!! FOLLOW THE FORMAT EXACTLY!</td><td>The result will be imported automatically into Excel: follow the columns below exactly.</td></tr><tr><td>Make a nice web page.</td><td>A clean, responsive page with these five sections, these colors, and buttons at least 44 pixels high for touch screens.</td></tr></tbody></table></div>
<div class="encart attention"><b class="t">Capital letters and threats backfire</b><p>With recent models, which pay close attention to instructions, commands in capitals ("CRITICAL", "MANDATORY") can trigger overzealousness: Claude applies the rule everywhere, even where it makes no sense. A normal tone, a clear reason and an example work better.</p></div>
<h3>Chaining: split to make it reliable</h3>
<p>A complex task given in a single prompt mixes several skills. By splitting it, each step becomes simpler, verifiable and improvable on its own. The output of one step becomes the input of the next.</p>
<div class="formule"><div><b>Extract</b><span>List the useful facts, figures and quotes, without interpretation.</span></div><div><b>Analyze</b><span>Reason only from the validated extraction.</span></div><div><b>Produce</b><span>Write the deliverable in the requested format.</span></div><div><b>Verify</b><span>Check the deliverable against the extraction and the instructions.</span></div></div>
<p>On claude.ai, each step can be a successive message in the same conversation. With the API or an agent, each step becomes a separate call, which lets you use a different model per step (module 10).</p>
<h3>Advanced patterns</h3>
<div class="grille"><div class="carte"><h4>Quote extraction</h4><p>For a long document: "first extract the relevant passages into &lt;quotes&gt;, then answer based only on them". Greatly reduces fabrication.</p></div><div class="carte"><h4>Critique and revision</h4><p>First draft, then "critique this text against these four criteria", then "rewrite it fixing each point". Three rounds are often worth more than one perfect prompt.</p></div><div class="carte"><h4>Self-consistency</h4><p>For a delicate question, generate several independent answers (fresh conversations) and compare: agreements are solid, disagreements need checking.</p></div><div class="carte"><h4>Permission to say "I don't know"</h4><p>Explicitly allow Claude to say it does not know or that information is missing. Without this permission, it tends to fill the gaps.</p></div><div class="carte"><h4>Meta-prompting</h4><p>Ask Claude to write or improve your prompt: "here is my goal and my draft prompt, ask me the useful questions, then propose an optimized version".</p></div><div class="carte"><h4>Questions first</h4><p>For a vague need: "before you start, ask me the five questions whose answers would change your work the most".</p></div></div>

<div class="prompt bon"><span class="lbl">Meta-prompt: have a system prompt written</span><button class="copier" type="button">Copy</button><pre>I want to create a reusable system prompt for the following task: [describe the task, the users, the frequency].
Examples of real requests: [2 or 3 typical requests].
What a bad result would look like: [mistakes to avoid].

1. First ask me the questions you need answered (5 maximum).
2. Then write the prompt in tagged blocks: role, goal, context, rules with their reason, format, what to do when in doubt.
3. Finally propose 8 test cases (including 3 difficult ones) to check this prompt, with the expected result for each.</pre></div>
<h3>System prompt or message?</h3>
<p>On the API and in applications, the <strong>system prompt</strong> sets the permanent frame (role, rules, tone), and the <strong>messages</strong> carry the request of the moment. On claude.ai, the equivalent of the system prompt is the combination of preferences, style and Project instructions. Rule of thumb: what is true for every request goes in the permanent frame; what changes each time goes in the message.</p>

<section class="module" id="m3" data-module="3" data-payant="1">
<div class="module-tete"><div class="module-num">3</div><h2>Reasoning, extended thinking and verification</h2></div>
<div class="objectif"><strong>By the end of this module, you will be able to:</strong><ul><li>know when extended thinking really improves the result, and when it wastes resources;</li><li>phrase requests that guide reasoning without constraining it;</li><li>understand what the displayed reasoning shows (and does not show);</li><li>organize an independent check of important results.</li></ul></div>
<p>Claude models can "think" before answering: they produce intermediate reasoning, then the answer. On claude.ai, this is the <strong>extended thinking</strong> option; on the API, a parameter that sets a thinking budget or effort level. Depending on the model, this thinking can also be <strong>adaptive</strong> (the model decides how much to think) and <strong>interleaved</strong> with tools: it thinks, calls a tool, then thinks again about the result.</p>
<h3>When to turn thinking on</h3>
<div class="tableau"><table><thead><tr><th>Thinking helps a lot</th><th>Thinking helps little or not at all</th></tr></thead><tbody><tr><td>Multi-step calculations, finance, sizing</td><td>Rephrasing, translating, spell-checking</td></tr><tr><td>Logic problems, planning under constraints</td><td>Writing a simple email</td></tr><tr><td>Analyzing a file with conflicting information</td><td>Answering a short factual question</td></tr><tr><td>Complex code, difficult debugging</td><td>Extracting fields from a clear document</td></tr><tr><td>Decisions with multiple trade-offs</td><td>Quick brainstorming</td></tr></tbody></table></div>
<p>The price: longer waits, and more consumption (thinking tokens are billed as output on the API and count against your limits on claude.ai).</p>
<h3>Guiding the reasoning well</h3>
<p>With extended thinking, <strong>high-level</strong> instructions often give better results than steps imposed in detail: the model sometimes finds a better path than the one you would have prescribed. Give the goal, the criteria and the checks; leave the method open, then read the reasoning to adjust.</p>
<div class="prompt bon"><span class="lbl">High-level instruction (with extended thinking)</span><button class="copier" type="button">Copy</button><pre>Think deeply about this planning problem. Consider several approaches before choosing one. Before concluding, check your solution against each of the listed constraints and correct it if any is not met.</pre></div>
<div class="prompt bon"><span class="lbl">Explicit reasoning (without extended thinking)</span><button class="copier" type="button">Copy</button><pre>Before answering, reason step by step inside an &lt;analysis&gt; tag: list the data, the assumptions, then the calculations. Then give only the final result inside an &lt;answer&gt; tag.</pre></div>

<div class="encart note"><b class="t">You can make Claude reason even without the option</b><p>If extended thinking is not available, or you want to keep control of the form, ask for written reasoning in a dedicated tag, then the separate answer. You get most of the benefits, and you can read the reasoning.</p></div>
<h3>What the displayed reasoning proves, and what it does not</h3>
<p>Visible reasoning is valuable for understanding an answer and spotting a methodological error. But Anthropic's research on reasoning faithfulness shows that it <strong>does not always faithfully</strong> reflect how the model actually reached its conclusion. Consequences for the expert:</p>
<ul><li>convincing reasoning is <strong>not proof</strong>: check the result, not just the approach;</li><li>reasoning that hesitates or contradicts itself is an excellent <strong>warning sign</strong>;</li><li>do not base an important decision on "it looks like it thought it through".</li></ul>
<h3>Organizing verification</h3>
<p>An expert's verification does not consist of rereading and hoping to spot the mistake. It is designed, just like the work itself.</p>
<div class="grille"><div class="carte"><h4>Test-based checks</h4><p>Give Claude an objective way to check its work: test cases for a calculation, known values, constraints to tick one by one.</p></div><div class="carte"><h4>Code execution</h4><p>For any figure that matters, ask for a calculation by code execution rather than "in its head". Retrieve the script so you can run it again.</p></div><div class="carte"><h4>Independent verifier</h4><p>Open a fresh conversation, give it the result and the original instructions, and ask it to look for errors. Without the history, it is not influenced by the first reasoning.</p></div><div class="carte"><h4>Counter-assessment</h4><p>"Here is the conclusion. Build the strongest possible argument for the opposite conclusion." If the counter-argument is solid, dig deeper.</p></div><div class="carte"><h4>Source checking</h4><p>For a fact, a law, a price: the primary source, opened and read, is the only check that counts.</p></div><div class="carte"><h4>Targeted human review</h4><p>Focus your own proofreading on high-stakes points (figures, commitments, names) rather than on the whole.</p></div></div>

<div class="prompt bon"><span class="lbl">Independent verifier (run in a new conversation)</span><button class="copier" type="button">Copy</button><pre>You are a demanding reviewer. Here are some instructions and the work produced in response.
&lt;instructions&gt;[paste the original instructions]&lt;/instructions&gt;
&lt;work&gt;[paste the result]&lt;/work&gt;
Actively look for errors: unsupported facts, wrong calculations, instructions not followed, omissions, internal contradictions. For each problem: the quoted passage, the problem, the severity (blocking, important, minor) and the proposed fix. If you find nothing serious, just say so, without inventing flaws.</pre></div>
<h3>Tool: choose the right approach</h3>
<div class="outil" id="outilApproche">
  <div class="grille-form">
    <div><label for="apCx">Difficulty of the reasoning</label><select id="apCx"><option value="1">Low (writing, rephrasing)</option><option value="2" selected>Medium (routine analysis)</option><option value="3">High (calculations, logic, trade-offs)</option></select></div>
    <div><label for="apFr">Could the information have changed recently?</label><select id="apFr"><option value="0">No</option><option value="1">Yes, a specific point</option><option value="2">Yes, a broad topic</option></select></div>
    <div><label for="apEnj">Stakes if wrong</label><select id="apEnj"><option value="1">Low</option><option value="2" selected>Medium</option><option value="3">High (money, legal, health, safety)</option></select></div>
    <div><label for="apVol">Volume</label><select id="apVol"><option value="1">A one-off request</option><option value="2">A task repeated every week</option><option value="3">Hundreds of cases</option></select></div>
  </div>
  <p class="reco" id="apReco"></p>
</div>

<div class="quiz" data-quiz="3"><h3>Check your knowledge</h3><div class="qs"></div><p class="statut" aria-live="polite"></p></div>
</section>


<section class="module" id="m4" data-module="4" data-payant="1">
<div class="module-tete"><div class="module-num">4</div><h2>Context engineering: Projects, memory and knowledge bases</h2></div>
<div class="objectif"><strong>By the end of this module, you will be able to:</strong><ul><li>move from writing prompts to designing complete contexts;</li><li>architect a professional Project and its document base;</li><li>master the personalization layers and memory;</li><li>apply the techniques for long tasks: compaction, external notes, just-in-time context.</li></ul></div>
<p>The prompt is one part of the problem. The other part, often the most important, is <strong>everything around the prompt</strong>: permanent instructions, documents, memory, tools, history. This is called <strong>context engineering</strong>: finding the smallest set of high-signal information that lets Claude do the job. Too little, and it improvises. Too much, and it gets distracted.</p>
<h3>The six layers you control on claude.ai</h3>
<div class="tableau"><table><thead><tr><th>Layer</th><th>Scope</th><th>What goes in</th><th>What does not</th></tr></thead><tbody><tr><td>Preferences</td><td>All conversations</td><td>Language, general tone, preferred formats, how to flag uncertainty</td><td>Rules specific to one matter</td></tr><tr><td>Styles</td><td>Writing tone and form</td><td>A house style created from your own texts</td><td>Facts or procedures</td></tr><tr><td>Project instructions</td><td>The conversations of one Project</td><td>Role, business rules, deliverable format, what to do when in doubt</td><td>Data that changes every week</td></tr><tr><td>Project knowledge</td><td>The conversations of one Project</td><td>Authoritative reference documents</td><td>Drafts, duplicates, outdated versions</td></tr><tr><td>Memory</td><td>From one conversation to the next, if enabled</td><td>Lasting facts about you</td><td>Secrets, sensitive data</td></tr><tr><td>Skills</td><td>Wherever they are enabled</td><td>Reusable procedural know-how (module 7)</td><td>Context specific to a single client</td></tr></tbody></table></div>
<h3>Architecting a professional Project</h3>
<p>An expert Project looks like a small document system. Here is a structure that works for most activities:</p>
<div class="grille"><div class="carte"><h4>00_index</h4><p>A short document describing each file in the Project: its content, its date, whether it is authoritative. Claude finds its way with it like a table of contents.</p></div><div class="carte"><h4>01_business_rules</h4><p>Stable rules: pricing, terms and conditions, procedures, approval thresholds.</p></div><div class="carte"><h4>02_reference_data</h4><p>Reference data: catalog, price list, product list, organization chart.</p></div><div class="carte"><h4>03_templates</h4><p>Deliverable templates: quote, report, standard email, with a filled-in example.</p></div><div class="carte"><h4>04_examples</h4><p>Three to five real successful deliverables (anonymized) that show the expected standard.</p></div><div class="carte"><h4>05_log</h4><p>Decisions taken, with their date: this avoids reopening what has already been settled.</p></div></div>

<div class="encart astuce"><b class="t">A golden rule for knowledge</b><p><strong>One piece of information, one place.</strong> If an item's price appears in two files with two values, Claude cannot know which one is authoritative. Remove duplicates, date your files, and state in the instructions which document prevails in case of conflict.</p></div>
<p>When a Project's document base becomes very large, Claude no longer reads all of it with every message: depending on the version, it switches to a <strong>knowledge search</strong> mode, where it retrieves the relevant passages when it needs them. This is powerful, but it makes well-named files, split by topic with explicit headings, even more important: a badly titled passage is a passage that is hard to find.</p>
<h3>Expert-level Project instructions</h3>
<p>Beyond the six blocks of the intermediate course, an expert adds three elements: the <strong>source hierarchy</strong>, the <strong>escalation thresholds</strong> and the <strong>acceptance tests</strong>.</p>
<div class="prompt bon"><span class="lbl">Project instructions: accounting firm</span><button class="copier" type="button">Copy</button><pre>ROLE
You are the assistant of a chartered accounting firm in Dakar. You prepare, you do not approve: every deliverable is reviewed by a staff accountant.

CONTEXT
Clients: SMEs and very small businesses in Senegal, revised SYSCOHADA framework. Amounts in FCFA.

SOURCE HIERARCHY
1. The client documents attached to the conversation.
2. The Project files "01_firm_rules" and "02_chart_of_accounts".
3. Your general knowledge, flagged explicitly.
In case of conflict, the highest-ranked source prevails, and you flag the conflict.

RULES
- Never cite a legal article or a rate without stating its source; if it comes from your general knowledge, write "to check against the text in force".
- Do all calculations by code execution and show the details.
- Anonymize the names of individuals in your deliverables.

ESCALATION
Stop and ask if: an amount exceeds 10 million FCFA, an entry does not balance, or a document seems inconsistent.

FORMAT
Tables first, comments after. End every deliverable with "Points for the accountant to check".

ACCEPTANCE TEST
A good deliverable can be reviewed in under five minutes and contains no unsourced statement.</pre></div>
<h3>Memory, from an expert's point of view</h3>
<p>Claude's memory (if enabled) summarizes lasting elements from your conversations and feeds them back into the context of later conversations. It is not a full recording: it is a <strong>summary</strong>, which may be incomplete or out of date. Good practice:</p>
<ul><li><strong>Keep things separate</strong>: depending on the version, each Project can have its own memory, separate from the general memory. Use it to prevent one client's information from bleeding into another's.</li><li><strong>Review and correct</strong> the memory regularly in the settings; delete what is wrong or outdated.</li><li><strong>Use private (incognito) chat</strong> for anything that must leave no trace.</li><li><strong>Do not rely on memory for critical facts</strong>: a price or a business rule belongs in a dated, verifiable Project document.</li></ul>
<h3>Long tasks: three engineering techniques</h3>
<p>When a piece of work exceeds what one conversation can hold (a thesis, an audit, a project lasting several weeks), the expert uses the techniques employed in professional agents:</p>
<div class="formule"><div><b>Compaction</b><span>Before saturation, have Claude produce a structured summary (goal, decisions, constraints, key figures, what remains) and restart in a fresh conversation with that summary.</span></div><div><b>External notes</b><span>Keep a progress file (for example "NOTES.md" or a Project document) that Claude updates at each step and rereads at the start of the next.</span></div><div><b>Just-in-time context</b><span>Do not load everything up front: let Claude look for the right document when it needs it (Project knowledge, Drive connector, search across past chats).</span></div></div>

<div class="prompt bon"><span class="lbl">Keeping a progress log</span><button class="copier" type="button">Copy</button><pre>At the end of each of our work sessions on this matter, update the log below rather than rewriting it entirely:
- what was done today (3 lines maximum);
- the decisions taken, with the date;
- the open questions;
- the precise next action.
&lt;log&gt;[paste the existing log, or "empty" the first time]&lt;/log&gt;</pre></div>
<h3>Tool: Project instructions generator (expert level)</h3>
<div class="outil" id="outilProj">
  <div class="grille-form">
    <div><label for="ipNom">Project name</label><input id="ipNom" type="text" placeholder="Joinery quotes"></div>
    <div><label for="ipRole">Claude's role</label><input id="ipRole" type="text" placeholder="administrative assistant of a joinery workshop"></div>
  </div>
  <label for="ipContexte">Business context</label><textarea id="ipContexte" rows="2"></textarea>
  <label for="ipSources">Sources, in order of authority (one per line)</label><textarea id="ipSources" rows="3" placeholder="Documents attached by the user&#10;prices_2026.xlsx&#10;terms_and_conditions.pdf"></textarea>
  <label for="ipRegles">Rules (one per line)</label><textarea id="ipRegles" rows="3"></textarea>
  <label for="ipEsc">Cases where Claude must stop and ask (one per line)</label><textarea id="ipEsc" rows="2" placeholder="Discount above 10%&#10;Lead time under 15 days"></textarea>
  <label for="ipFormat">Usual deliverable format</label><textarea id="ipFormat" rows="2"></textarea>
  <label for="ipTest">Acceptance test (how do you recognize a good deliverable?)</label><input id="ipTest" type="text">
  <p style="margin:16px 0 6px;font-weight:600">Generated instructions</p>
  <pre class="sortie" id="ipSortie">Fill in at least one field.</pre>
  <div class="rang"><button class="btn" type="button" id="ipCopier">Copy the instructions</button></div>
</div>

<div class="quiz" data-quiz="4"><h3>Check your knowledge</h3><div class="qs"></div><p class="statut" aria-live="polite"></p></div>
</section>


<section class="module" id="m5" data-module="5" data-payant="1">
<div class="module-tete"><div class="module-num">5</div><h2>Documents, data and files at scale</h2></div>
<div class="objectif"><strong>By the end of this module, you will be able to:</strong><ul><li>make full use of PDF, image and spreadsheet reading, while knowing their limits;</li><li>design a reliable structured extraction, with a schema and checks;</li><li>run a reproducible data analysis through code execution;</li><li>handle files of several hundred pages and produce professional documents.</li></ul></div>
<h3>What Claude actually reads</h3>
<div class="tableau"><table><thead><tr><th>Source</th><th>What Claude perceives</th><th>Points of caution</th></tr></thead><tbody><tr><td>Text PDF</td><td>The text, and in some cases the page images (charts, tables, layout)</td><td>Very dense tables, footnotes, multiple columns</td></tr><tr><td>Scanned PDF, photo</td><td>The image, read by the model's vision</td><td>Small print, handwriting, glare, skewed pages</td></tr><tr><td>Excel, CSV</td><td>The data, ideally analyzed through code execution</td><td>Merged cells, several tables per sheet, mixed date formats</td></tr><tr><td>Images, diagrams, screenshots</td><td>The visual content: objects, text, relationships, charts</td><td>Reading precise values off a chart, counting many objects</td></tr><tr><td>Word, PowerPoint</td><td>The text and the structure</td><td>Content inside floating text boxes or images</td></tr></tbody></table></div>
<div class="encart astuce"><b class="t">Helping vision</b><p>For a photo of a document: good light, tight framing, one page per image, no glare. For a dense table, crop it into several images. Ask Claude to <strong>transcribe first</strong> what it reads, check the transcription, and only then have it analyzed.</p></div>
<h3>Structured extraction: the most profitable technique</h3>
<p>Turning unstructured documents (invoices, delivery notes, contracts, field reports) into a usable table is one of Claude's best uses. To make it reliable, the expert works with a <strong>schema</strong>.</p>
<div class="formule"><div><b>1. Define the schema</b><span>Each field with its name, type, format and rule when it is missing.</span></div><div><b>2. Extract</b><span>One document at a time, or in small batches, requiring the source page or passage.</span></div><div><b>3. Validate</b><span>Automatic checks: totals that add up, plausible dates, required fields present.</span></div><div><b>4. Reconcile</b><span>Handle cases flagged "uncertain" separately; never merge them without checking.</span></div></div>
<div class="prompt bon"><span class="lbl">Extracting supplier invoices</span><button class="copier" type="button">Copy</button><pre>Extract the information from each attached invoice according to the schema below. Answer only with a valid JSON array, one entry per invoice.

&lt;schema&gt;
supplier: text, company name as written
invoice_number: text
invoice_date: date in YYYY-MM-DD format
amount_excl_tax: number in FCFA, no spaces
vat: number in FCFA
amount_incl_tax: number in FCFA
source_page: page number where the total appears
uncertain: list of fields you are not sure about, empty otherwise
&lt;/schema&gt;

Rules:
- If a field is missing, use null: never invent a value.
- Check that amount_excl_tax + vat = amount_incl_tax; otherwise, add "amount_incl_tax" to uncertain.
- Do not correct the invoice's mistakes: transcribe.</pre></div>
<h3>Reproducible data analysis</h3>
<p>When code execution is enabled (often in the settings, under capabilities), Claude actually writes and runs code to compute, filter and plot charts. It is the difference between an <em>estimated</em> figure and a <em>calculated</em> one. The expert makes full use of it:</p>
<ul><li>Ask Claude to "<strong>calculate</strong>", not "estimate"; require totals to be produced by the code.</li><li>Ask for the <strong>script</strong> at the end: you can rerun it next month on a new file.</li><li>Have the file <strong>profiled</strong> before any conclusion: number of rows, missing values, duplicates, outliers.</li><li>Beware of <strong>causal conclusions</strong>: a correlation in your sales is not an explanation. Ask for alternative explanations.</li><li>On small samples (a few weeks of data), explicitly ask whether the observed difference is significant or could be due to chance.</li></ul>
<div class="prompt bon"><span class="lbl">Reproducible analysis of a laying register</span><button class="copier" type="button">Copy</button><pre>Here is the daily laying register of my three poultry houses (attached file).
1. Profile the file: columns, period, missing values, anomalies. Do not conclude anything yet.
2. Using code execution, calculate for each house: weekly laying rate, cumulative mortality, feed consumption per egg.
3. Plot the laying rate of the three houses on a single chart.
4. Flag the abnormal weeks and suggest two possible explanations for each, without deciding.
5. Give me the complete, commented script to rerun this analysis next month.</pre></div>
<h3>Very large files</h3>
<p>A 300-page file is not handled with a single "summarize" question. Three strategies, to combine:</p>
<div class="tableau"><table><thead><tr><th>Strategy</th><th>Principle</th><th>When to use it</th></tr></thead><tbody><tr><td>Map then zoom</td><td>First the outline and the stakes of each part, then the analysis part by part</td><td>Reports, studies, theses</td></tr><tr><td>Two-stage synthesis</td><td>One sheet per section (same headings), then a synthesis of the sheets</td><td>Batches of similar documents (contracts, CVs, monthly reports)</td></tr><tr><td>Targeted questions</td><td>A list of precise questions, with quote and page for each answer</td><td>Audits, compliance checks, tenders</td></tr></tbody></table></div>
<div class="encart attention"><b class="t">The shallow summary trap</b><p>The longer the document, the more a one-pass summary risks skipping the decisive details, often located in the middle. For a binding document (contract, regulatory report), always prefer targeted questions with quotes and pages.</p></div>
<h3>Producing professional files</h3>
<p>Depending on your plan and settings, Claude creates Excel, Word, PowerPoint and PDF files to download. These capabilities rely on <strong>Skills</strong> provided by Anthropic (module 7). For a professional-grade result:</p>
<ul><li><strong>Excel</strong>: ask for <strong>live formulas</strong> (not copied values), separate tabs for data, calculations and summary, and conditional formatting for alerts.</li><li><strong>Word</strong>: ask for heading styles (for an automatic table of contents), clean tables, headers and footers.</li><li><strong>PowerPoint</strong>: one idea per slide, a title that states the conclusion, speaker notes.</li><li><strong>House template</strong>: attach your template (logo, colors, structure) and ask for it to be followed; better still, turn it into a Skill.</li></ul>
<h3>Tool: extraction schema generator</h3>
<p>Describe the fields to extract: the tool produces an extraction prompt and a reusable JSON schema (for example with the API in module 11).</p>
<div class="outil" id="outilSchema">
  <label for="scDoc">Document type</label><input id="scDoc" type="text" placeholder="delivery note">
  <label for="scChamps">Fields, one per line, as name : type : description (types: text, number, date, boolean, list)</label>
  <textarea id="scChamps" rows="5" placeholder="supplier : text : company name&#10;delivery_date : date : date on the note&#10;total_quantity : number : in 50 kg bags&#10;compliant : boolean : note signed without reservation"></textarea>
  <p style="margin:16px 0 6px;font-weight:600">Extraction prompt</p>
  <pre class="sortie" id="scPrompt">Fill in the fields.</pre>
  <div class="rang"><button class="btn" type="button" id="scCopierP">Copy the prompt</button></div>
  <p style="margin:16px 0 6px;font-weight:600">JSON schema</p>
  <pre class="sortie" id="scJson">{}</pre>
  <div class="rang"><button class="btn sec" type="button" id="scCopierJ">Copy the schema</button></div>
</div>

<div class="quiz" data-quiz="5"><h3>Check your knowledge</h3><div class="qs"></div><p class="statut" aria-live="polite"></p></div>
</section>


<section class="module" id="m6" data-module="6" data-payant="1">
<div class="module-tete"><div class="module-num">6</div><h2>Artifacts, applications and rapid prototyping</h2></div>
<div class="objectif"><strong>By the end of this module, you will be able to:</strong><ul><li>write an application specification that Claude can build right the first time;</li><li>run a development in versions, with tests and edge cases;</li><li>know the advanced capabilities of Artifacts: storage, Claude-powered apps, connectors;</li><li>know when an Artifact is enough, and when to move to Claude Code or real development.</li></ul></div>
<p>An Artifact is really a small <strong>standalone web application</strong>: an HTML page or a React component, run in an isolated environment. With the right method, you can build in an hour tools that used to take days: business calculators, dashboards, forms, simulators, educational games, interface prototypes.</p>
<h3>What an Artifact can do (depending on versions and plans)</h3>
<div class="grille"><div class="carte"><h4>Complete interface</h4><p>Forms, tables, charts, tabs, a layout adapted to phones.</p></div><div class="carte"><h4>Saved data</h4><p>Some Artifacts keep data from one visit to the next, either personal or shared between users.</p></div><div class="carte"><h4>Powered by Claude</h4><p>The Artifact can call Claude itself: built-in assistant, analysis of entered text, on-demand generation. Usage is counted against the account of the person using it.</p></div><div class="carte"><h4>Connected</h4><p>Depending on the version, an Artifact can rely on your connectors (MCP) to read from or write to your tools.</p></div><div class="carte"><h4>Publishing</h4><p>A share link, private by default, that you choose to distribute.</p></div><div class="carte"><h4>Common libraries</h4><p>Charts, icons, calculations, formatting: the major usual web libraries are generally available.</p></div></div>

<div class="encart attention"><b class="t">What an Artifact must never contain</b><p>An API key, a password, real personal data of customers, a confidential price list. An Artifact's code can be read by anyone who has access to it. Always test with fake data.</p></div>
<h3>The specification: the secret of a successful first draft</h3>
<p>Most failed Artifacts fail because of a vague request. An expert specification fits on one page and covers seven headings.</p>
<div class="prompt bon"><span class="lbl">Application specification: laying tracker</span><button class="copier" type="button">Copy</button><pre>Build a web application (a single file) to track production for a laying-hen farm.

USERS AND CONTEXT
The farm manager, on an entry-level Android phone, often outdoors. Unreliable Internet connection.

DATA ENTERED (every day, per house)
Date, house (B1, B2, B3), eggs collected, broken eggs, mortality, feed distributed in kg.

CALCULATIONS
Laying rate = eggs collected / birds present × 100. Birds present = initial flock − cumulative mortality. Consumption per egg = feed in grams / eggs collected.

SCREENS
1. Today's entry (large fields, numeric keypad).
2. Dashboard: laying rate over the last 14 days per house, as a curve, and alerts.
3. History with CSV export.

RULES AND ALERTS
Red alert if the laying rate drops by more than 5 points in 3 days or if mortality exceeds 0.5% over a week.

EDGE CASES TO HANDLE
Empty field, zero eggs, duplicate entry for the same date, flock at zero.

CONSTRAINTS
Interface in English, buttons at least 44 pixels high, numbers with thousands separators, data saved on the device. Start with the entry screen and the history; we will add the dashboard afterwards.</pre></div>
<h3>The expert's development cycle</h3>
<div class="formule"><div><b>1. Specify</b><span>The seven headings above. Five minutes of specification beat five rounds of back-and-forth.</span></div><div><b>2. Minimal core</b><span>The smallest useful version, tested. Nothing is added until it works.</span></div><div><b>3. Test</b><span>Real cases, then edge cases: empty, zero, negative, very large number, duplicate entry.</span></div><div><b>4. Iterate</b><span>One improvement per request, stating precisely what must change and what must not move.</span></div><div><b>5. Harden</b><span>Input validation, clear error messages, accessibility, display on phones.</span></div><div><b>6. Deliver</b><span>Publish, or download the HTML file, with a short user guide.</span></div></div>
<h3>Fixing like a developer</h3>
<div class="prompt bon"><span class="lbl">Targeted fix for a defect</span><button class="copier" type="button">Copy</button><pre>Problem observed: when I enter 0 eggs collected, the consumption per egg shows "Infinity".
Steps to reproduce: entry screen, B2, eggs = 0, feed = 12 kg, Save.
Expected behavior: show "–" and a tooltip "no laying today".
1. First explain the cause in two sentences.
2. Fix only this problem, without changing anything else.
3. List the other places in the code where the same division could cause a problem.</pre></div>
<h3>Artifact, Claude Code or traditional development?</h3>
<div class="tableau"><table><thead><tr><th>Need</th><th>Suitable tool</th></tr></thead><tbody><tr><td>Personal tool or tool for a small team, one or a few screens</td><td>Artifact</td></tr><tr><td>Prototype to test an idea with customers before investing</td><td>Published Artifact</td></tr><tr><td>Application with several files, a database, user accounts, deployment on a server</td><td>Claude Code (module 9) in a real project</td></tr><tr><td>Critical software (payments, health data, many users)</td><td>Professional development, with Claude Code as an accelerator and rigorous human review</td></tr></tbody></table></div>
<h3>Beyond tools: diagrams and visual material</h3>
<p>Artifacts also produce <strong>diagrams</strong> (organization charts, processes, timelines, in Mermaid or SVG), <strong>interactive presentations</strong> and <strong>educational simulators</strong>. Explicitly ask for an editable format (SVG or Mermaid) rather than a fixed image: you can then have a detail corrected with a simple request.</p>

<section class="module" id="m7" data-module="7" data-payant="1">
<div class="module-tete"><div class="module-num">7</div><h2>Skills: turning your know-how into a reusable capability</h2></div>
<div class="objectif"><strong>By the end of this module, you will be able to:</strong><ul><li>explain what a Skill is and how Claude loads it on demand;</li><li>distinguish a Skill, a Project, a saved prompt and an MCP connector;</li><li>write an effective Skill: description, instructions, resources and scripts;</li><li>test, share and secure your Skills.</li></ul></div>
<p>A <strong>Skill</strong> is a folder that teaches Claude to carry out a specific task your way: produce a quote in your company's format, correct a thesis according to your standards, analyze a laying register, write a drilling report. It contains a main file, <code>SKILL.md</code>, and possibly reference documents, templates and scripts.</p>
<p>The strength of Skills lies in <strong>progressive disclosure</strong>. Claude does not read all your Skills all the time: at first it only sees their name and description. When a request matches, it opens the Skill and reads its instructions; if needed, it then consults its supporting files or runs its scripts. You can therefore install dozens of Skills without cluttering the context.</p>
<figure class="schema"><svg viewBox="0 0 820 250" role="img" aria-label="Progressive disclosure of a Skill" xmlns="http://www.w3.org/2000/svg" font-family="Arial,Helvetica,sans-serif">
