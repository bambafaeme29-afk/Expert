<style>

:root{
  --encre:#1B1915;
  --fond:#FBF6EE;
  --papier:#FFFFFF;
  --vert:#B8512D;
  --vert-clair:#FBE8DE;
  --soleil:#F2B65C;
  --soleil-clair:#FBEEC8;
  --corail:#B3261E;
  --corail-clair:#F9DEDA;
  --brume:#E8DFD2;
  --doux:#6A6158;
  --titre:Arial,'Helvetica Neue',Helvetica,sans-serif;
  --texte:Arial,'Helvetica Neue',Helvetica,sans-serif;
  --lateral:290px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:20px}
body{margin:0;background:var(--fond);color:var(--encre);font-family:var(--texte);font-size:17px;line-height:1.65}
a{color:var(--vert)}
:focus-visible{outline:3px solid var(--soleil);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--titre);line-height:1.15;margin:0 0 .6em;letter-spacing:-.01em}
h1{font-size:clamp(2.3rem,5vw,3.6rem);font-weight:800}
h2{font-size:clamp(1.7rem,3vw,2.2rem);font-weight:800}
h3{font-size:1.25rem;font-weight:700;margin-top:1.8em}
p{margin:0 0 1em;max-width:70ch}
ul,ol{max-width:70ch;padding-left:1.3em}
li{margin-bottom:.4em}
code,kbd{font-family:Consolas,Menlo,monospace;font-size:.92em;background:#F0E9DE;padding:.1em .4em;border-radius:4px}

/* ===== Mise en page ===== */
.layout{display:grid;grid-template-columns:var(--lateral) 1fr;min-height:100vh}
.lateral{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--encre);color:#EFE8DD;padding:26px 20px 30px;display:flex;flex-direction:column;gap:18px}
.marque{font-family:var(--titre);font-weight:800;font-size:1.25rem;color:#fff;line-height:1.2}
.marque small{display:block;font-family:var(--texte);font-weight:400;font-size:.82rem;color:#B9AC9C;margin-top:4px}
.progres-bloc{background:rgba(255,255,255,.07);border-radius:12px;padding:14px}
.progres-bloc p{margin:0 0 8px;font-size:.88rem;color:#DDD2C3}
.barre{height:8px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}
.barre span{display:block;height:100%;width:0;background:var(--soleil);border-radius:99px;transition:width .4s}
.nav{list-style:none;margin:0;padding:0}
.nav li{margin:0}
.nav a{display:flex;gap:12px;align-items:flex-start;text-decoration:none;color:#E3D8C9;padding:9px 10px;border-radius:9px;font-size:.95rem;line-height:1.35}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a.actif{background:rgba(255,255,255,.14);color:#fff}
.nav .n{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid #8C8073;display:grid;place-items:center;font-size:.78rem;font-weight:600;margin-top:1px}
.nav a.fait .n{background:var(--soleil);border-color:var(--soleil);color:var(--encre)}
.nav a.fait .n::before{content:"✓"}
.nav a.fait .n span{display:none}
.btn.danger{background:#fff;color:var(--corail);border:2px solid var(--corail)}
.btn.danger:hover:not(:disabled){background:var(--corail-clair)}
.btn.danger.plein{background:var(--corail);color:#fff}
.options{margin-top:26px;font-size:.88rem}
.options summary{cursor:pointer;color:var(--doux);display:inline-block}
.options .options-corps{margin-top:10px;padding:14px 16px;background:var(--papier);border:1px solid var(--brume);border-radius:12px;max-width:520px}
.options .options-corps p{margin:0 0 10px;color:var(--doux)}
dialog#dlgReset{border:0;border-radius:18px;padding:26px 28px;max-width:540px;width:calc(100% - 32px);box-shadow:0 30px 80px rgba(27,25,21,.35);color:var(--encre);font-family:var(--texte)}
dialog#dlgReset::backdrop{background:rgba(27,25,21,.6)}
dialog#dlgReset h2{font-size:1.4rem;margin-bottom:10px}
dialog#dlgReset .alerte{background:var(--corail-clair);border-left:5px solid var(--corail);border-radius:0 10px 10px 0;padding:10px 14px;margin:0 0 14px}
dialog#dlgReset h3{font-size:1rem;margin:14px 0 4px}
dialog#dlgReset ul{margin:0 0 6px;padding-left:1.2em;font-size:.95rem}
dialog#dlgReset li{margin-bottom:.25em}
dialog#dlgReset .cert-alerte{background:var(--soleil-clair);border-radius:10px;padding:10px 14px;margin-top:12px;font-size:.93rem}
dialog#dlgReset label.ok{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-weight:600;cursor:pointer}
dialog#dlgReset label.ok input{margin-top:4px;width:18px;height:18px;accent-color:var(--corail)}
dialog#dlgReset .actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:18px}
.menu-btn{display:none}

main{padding:0 clamp(18px,4vw,64px) 80px;max-width:1100px}

/* ===== Hero ===== */
.hero{padding:70px 0 40px;display:grid;grid-template-columns:1.05fr 1fr;gap:44px;align-items:center}
.hero p.chapo{font-size:1.2rem;color:var(--doux);max-width:46ch}
.hero .meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.pastille{background:var(--papier);border:1px solid var(--brume);border-radius:99px;padding:6px 14px;font-size:.9rem}
.echange{background:var(--papier);border:1px solid var(--brume);border-radius:18px;padding:22px;box-shadow:0 14px 40px rgba(27,25,21,.09)}
.bulle{padding:12px 16px;border-radius:14px;font-size:.96rem;line-height:1.55;margin-bottom:12px}
.bulle.moi{background:var(--encre);color:#fff;margin-left:34px;border-bottom-right-radius:4px}
.bulle.claude{background:var(--vert-clair);margin-right:18px;border-bottom-left-radius:4px}
.bulle.claude p{margin:0 0 .6em;max-width:none}
.bulle.claude p:last-child{margin:0}
.echange .legende{font-size:.82rem;color:var(--doux);margin:6px 0 0}

/* ===== Modules ===== */
section.module{padding:56px 0 20px;border-top:1px solid var(--brume)}
section.module:first-of-type{border-top:0}
.module-tete{display:flex;gap:16px;align-items:flex-start;margin-bottom:8px}
.module-num{flex:none;width:52px;height:52px;border-radius:14px;background:var(--vert);color:#fff;font-family:var(--titre);font-weight:800;font-size:1.5rem;display:grid;place-items:center}
.objectif{background:var(--papier);border-left:5px solid var(--vert);padding:14px 18px;border-radius:0 12px 12px 0;margin:8px 0 26px;max-width:70ch}
.objectif strong{font-family:var(--titre)}
.objectif ul{margin:.5em 0 0}
.encart{border-radius:12px;padding:16px 20px;margin:22px 0;max-width:70ch}
.encart p:last-child{margin-bottom:0}
.encart.astuce{background:var(--vert-clair)}
.encart.attention{background:var(--corail-clair)}
.encart.note{background:var(--soleil-clair)}
.encart b.t{font-family:var(--titre);display:block;margin-bottom:4px}

.grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin:18px 0}
.carte{background:var(--papier);border:1px solid var(--brume);border-radius:14px;padding:18px}
.carte h4{font-family:var(--titre);margin:0 0 6px;font-size:1.08rem}
.carte p{margin:0;font-size:.95rem;color:var(--doux)}

table{border-collapse:collapse;width:100%;background:var(--papier);border-radius:12px;overflow:hidden;font-size:.95rem;margin:16px 0}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--brume);vertical-align:top}
th{background:var(--encre);color:#fff;font-family:var(--titre);font-weight:700}
tr:last-child td{border-bottom:0}
.tableau{overflow-x:auto}

/* ===== Prompts ===== */
.prompt{position:relative;background:var(--papier);border:1px solid var(--brume);border-radius:12px;padding:16px 18px;margin:14px 0;max-width:74ch}
.prompt .lbl{font-family:var(--titre);font-weight:700;font-size:.9rem;margin-bottom:6px;display:block}
.prompt.bon{border-left:5px solid var(--vert)}
.prompt.mauvais{border-left:5px solid var(--corail)}
.prompt pre{margin:0;white-space:pre-wrap;font-family:var(--texte);font-size:.98rem;line-height:1.55}
.copier{position:absolute;top:10px;right:10px;border:1px solid var(--brume);background:var(--fond);border-radius:8px;padding:5px 11px;font:inherit;font-size:.82rem;cursor:pointer}
.copier:hover{border-color:var(--vert);color:var(--vert)}
.prompt.bon pre,.prompt.mauvais pre{padding-right:78px}
.formule{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:18px 0}
.formule div{background:var(--encre);color:#fff;border-radius:12px;padding:14px 16px}
.formule b{font-family:var(--titre);color:var(--soleil);display:block;margin-bottom:4px}
.formule span{font-size:.92rem;color:#E3D8C9}

/* ===== Maquette interactive ===== */
.maquette-zone{display:grid;grid-template-columns:1.5fr 1fr;gap:22px;align-items:start;margin:20px 0}
.fenetre{background:var(--papier);border:1px solid var(--brume);border-radius:16px;overflow:hidden;box-shadow:0 14px 40px rgba(27,25,21,.1)}
.fen-barre{background:#EFE8DD;padding:9px 14px;display:flex;gap:7px;align-items:center}
.fen-barre i{width:11px;height:11px;border-radius:50%;background:#CFC3B3;display:block}
.fen-corps{display:grid;grid-template-columns:150px 1fr;min-height:340px}
.hs{cursor:pointer;border:2px dashed transparent;background:none;font:inherit;color:inherit;text-align:left;transition:background .15s,border-color .15s}
.hs:hover{border-color:var(--soleil)}
.hs.actif{border-color:var(--vert);background:var(--vert-clair)}
.m-lateral{background:#F3EDE3;padding:12px 8px;display:flex;flex-direction:column;gap:6px;font-size:.85rem}
.m-lateral .hs{padding:8px 10px;border-radius:8px}
.m-lateral .plein{background:var(--encre);color:#fff;font-weight:600}
.m-lateral .plein.actif{background:var(--vert);border-color:var(--vert)}
.m-lateral .liste{padding:8px 10px;color:var(--doux);font-size:.8rem;line-height:1.9}
.m-principal{padding:26px 22px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.m-titre{font-family:var(--titre);font-weight:700;font-size:1.35rem;text-align:center}
.m-saisie{border:1px solid var(--brume);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:14px;background:#FDFBF7}
.m-saisie .hs{border-radius:10px;padding:6px 8px}
.m-champ{color:#9A8F83;font-size:.95rem}
.m-bas{display:flex;justify-content:space-between;align-items:center;gap:8px}
.m-bas .droite{display:flex;gap:8px;align-items:center}
.m-plus{width:34px;height:34px;padding:0!important;display:grid;place-items:center;font-size:1.3rem;border:1px solid var(--brume)!important;border-radius:50%!important}
.m-modele{font-size:.85rem;color:var(--doux)}
.m-envoi{width:34px;height:34px;padding:0!important;border-radius:50%!important;background:var(--vert);color:#fff;display:grid;place-items:center;font-size:1rem;border:2px solid var(--vert)!important}
.m-envoi.actif{background:var(--encre);border-color:var(--encre)!important}
.explication{background:var(--encre);color:#fff;border-radius:16px;padding:22px;position:sticky;top:20px;min-height:220px}
.explication h4{font-family:var(--titre);font-size:1.15rem;margin:0 0 8px;color:var(--soleil)}
.explication p{margin:0;font-size:.98rem;color:#EFE6D8}
.explication .aide{font-size:.85rem;color:#B3A79A;margin-top:14px}

/* ===== Quiz ===== */
.quiz{background:var(--papier);border:2px solid var(--brume);border-radius:16px;padding:22px;margin:34px 0 10px;max-width:760px}
.quiz h3{margin:0 0 14px}
.q{margin-bottom:22px}
.q p{font-weight:600;margin-bottom:8px}
.q .choix{display:flex;flex-direction:column;gap:8px}
.q button{font:inherit;text-align:left;background:var(--fond);border:1px solid var(--brume);border-radius:10px;padding:10px 14px;cursor:pointer;color:inherit}
.q button:hover:not(:disabled){border-color:var(--vert)}
.q button.ok{background:var(--vert-clair);border-color:var(--vert)}
.q button.ko{background:var(--corail-clair);border-color:var(--corail)}
.q .retour{font-size:.93rem;margin:8px 0 0;color:var(--doux)}
.quiz .statut{font-weight:600;margin:0}
.quiz .statut.reussi{color:var(--vert)}

/* ===== Exercices ===== */
.exo{background:var(--papier);border:1px solid var(--brume);border-radius:14px;padding:16px 20px;margin:14px 0;max-width:760px}
.exo label{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.exo input{margin-top:6px;width:18px;height:18px;accent-color:var(--vert);flex:none}
.exo b{font-family:var(--titre)}
.exo.fait{background:var(--vert-clair);border-color:var(--vert)}

details{background:var(--papier);border:1px solid var(--brume);border-radius:12px;padding:0;margin:10px 0;max-width:760px}
summary{cursor:pointer;padding:14px 18px;font-weight:600;font-family:var(--titre)}
details[open] summary{border-bottom:1px solid var(--brume)}
details .contenu{padding:14px 18px}
details .contenu p:last-child{margin-bottom:0}

footer{margin-top:60px;padding-top:26px;border-top:1px solid var(--brume);color:var(--doux);font-size:.9rem}
footer p{max-width:70ch}





/* ===== Outils interactifs ===== */
.outil{background:#fff;border:1px solid var(--brume);border-radius:16px;padding:20px 22px;margin:18px 0;max-width:820px}
.outil label{display:block;font-weight:600;margin:12px 0 5px}
.outil label:first-child{margin-top:0}
.outil label.coche{display:flex;gap:12px;align-items:flex-start;font-weight:400;cursor:pointer;margin:8px 0}
.outil label.coche input{margin-top:5px;width:18px;height:18px;accent-color:var(--vert);flex:none}
.outil input[type=text],.outil input[type=number],.outil textarea,.outil select{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--brume);border-radius:10px;background:#fff;color:var(--encre)}
.outil textarea{resize:vertical}
.outil input:focus,.outil textarea:focus,.outil select:focus{border-color:var(--vert);outline:none}
.grille-form{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.sortie{background:var(--fond);border:1px dashed #CFC3B3;border-radius:10px;padding:14px;white-space:pre-wrap;font-family:var(--texte);font-size:.95rem;margin:0;max-height:520px;overflow:auto}
.outil .rang{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.resultat,.reco{margin:14px 0 0;padding:12px 16px;background:var(--soleil-clair);border-radius:12px;font-weight:600}
.reco:empty{display:none}
.resultats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.resultats div{background:var(--fond);border-radius:10px;padding:10px 12px}
.resultats b{font-family:var(--titre);font-size:1.4rem;display:block}
.resultats span{font-size:.85rem;color:var(--doux)}
.jauge{height:12px;background:#E9E1D5;border-radius:99px;overflow:hidden}
.jauge span{display:block;height:100%;width:0;background:var(--vert);transition:width .3s}
.jauge span.chaud{background:var(--soleil)}
.jauge span.rouge{background:var(--corail)}
@media (max-width:700px){.grille-form{grid-template-columns:1fr}}
@media print{.outil{display:none!important}}

/* ===== Activation ===== */
body.vue-activation .layout,body.vue-activation .menu-btn{display:none}
body:not(.vue-activation) #activation{display:none}
body.apercu section[data-payant]{display:none}
.bandeau-apercu,.teaser,#btnActiverLat{display:none}
body.apercu .bandeau-apercu{display:flex}
body.apercu .teaser{display:block}
body.apercu #btnActiverLat{display:block;width:100%}
.bandeau-apercu{flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between;background:var(--soleil-clair);border:1px solid var(--soleil);border-radius:14px;padding:14px 18px;margin-top:22px}
.bandeau-apercu p{margin:0;max-width:62ch}
.teaser{background:var(--encre);color:#fff;border-radius:16px;padding:26px;margin:40px 0 10px;max-width:760px}
.teaser h3{color:var(--soleil);margin-top:0}
.teaser ul{color:#E3D8C9;margin:.6em 0 1em}
.teaser p{color:#EFE6D8}
body.apercu .nav a.verrouille::after{content:"Clé requise";margin-left:auto;flex:none;font-size:.68rem;background:rgba(255,255,255,.14);border-radius:99px;padding:2px 8px;align-self:center;white-space:nowrap}
.activation{min-height:100vh;padding:clamp(20px,5vw,60px) clamp(16px,4vw,48px);background:var(--fond)}
.act-in{max-width:880px;margin:0 auto}
.act-in h1{font-size:clamp(2rem,5vw,3rem)}
.act-in .chapo{font-size:1.15rem;color:var(--doux);max-width:60ch}
.act-carte{background:var(--papier);border:1px solid var(--brume);border-radius:16px;padding:22px;margin-top:22px}
.act-carte h2{font-size:1.35rem;margin-bottom:10px}
.act-liste{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 22px}
.act-liste li{padding-left:24px;position:relative;margin:0}
.act-liste li::before{content:"\2713";position:absolute;left:0;color:var(--vert);font-weight:700}
.code-app{display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:var(--soleil-clair);border-radius:12px;padding:14px 18px;margin:12px 0}
.code-app strong{font-family:var(--titre);font-size:clamp(1.4rem,4vw,1.9rem);letter-spacing:.06em}
.act-carte textarea{width:100%;font:inherit;font-size:.95rem;letter-spacing:.03em;padding:12px 14px;border:2px solid var(--brume);border-radius:10px;background:#fff;color:var(--encre);min-height:110px;resize:vertical;word-break:break-all}
.act-carte textarea:focus{border-color:var(--vert);outline:none}
.act-carte label{display:block;font-weight:600;margin-bottom:6px}
.act-etapes{padding-left:1.2em;max-width:none}
.act-etapes li{margin-bottom:.6em}
a.btn{display:inline-block;text-decoration:none}
[hidden]{display:none!important}
.act-in .msg.ok{color:var(--vert);font-weight:600}

.btn-wa:hover{background:#E6F6EC}
/* ===== Paiement ===== */
.act-table tr{cursor:pointer}
.act-table td:first-child label{display:flex;gap:10px;align-items:center;margin:0;font-weight:600;cursor:pointer}
.act-table input{width:18px;height:18px;accent-color:var(--vert)}
.act-table tr.sel{background:var(--vert-clair)}
.pay-choix{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:14px 0}
.pay-btn{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid var(--brume);border-radius:14px;padding:12px 16px;font:inherit;cursor:pointer;text-align:left;color:var(--encre)}
.pay-btn:hover{border-color:var(--soleil)}
.pay-btn[aria-pressed="true"]{border-color:var(--vert);background:var(--vert-clair)}
.pay-btn img{height:48px;width:auto;border-radius:8px;display:block}
.pay-btn span{font-family:var(--titre);font-weight:700;font-size:1.05rem}
.pay-btn small{display:block;font-family:var(--texte);font-weight:400;font-size:.85rem;color:var(--doux)}
.pay-panel{background:var(--soleil-clair);border-radius:14px;padding:18px 20px;margin-top:6px}
.pay-panel h3{margin:0 0 8px;font-size:1.15rem}
.pay-num{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:10px 0}
.pay-num strong{font-family:var(--titre);font-size:clamp(1.4rem,4vw,1.9rem);letter-spacing:.03em}
.pay-panel ol{margin:.6em 0 1em;padding-left:1.3em;max-width:none}

/* ===== Certificat ===== */
.btn{background:var(--vert);color:#fff;border:0;border-radius:10px;padding:13px 22px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:disabled{background:#C9BFB1;cursor:not-allowed}
.btn.sec{background:var(--papier);color:var(--encre);border:1px solid var(--brume)}
.conditions{list-style:none;padding:0;margin:20px 0;max-width:760px}
.conditions li{display:flex;gap:14px;align-items:flex-start;background:var(--papier);border:1px solid var(--brume);border-radius:12px;padding:12px 16px;margin-bottom:10px}
.conditions .pt{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--brume);display:grid;place-items:center;font-size:.85rem;font-weight:700;margin-top:1px}
.conditions li.ok{background:var(--vert-clair);border-color:var(--vert)}
.conditions li.ok .pt{background:var(--vert);border-color:var(--vert);color:#fff}
.conditions li.ok .pt::before{content:"\2713"}
.conditions li.ko{background:var(--corail-clair);border-color:var(--corail)}
.conditions li.ko .pt{background:var(--corail);border-color:var(--corail);color:#fff}
.conditions li.ko .pt::before{content:"!"}
.scoregrille{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;max-width:760px;margin:16px 0}
.scoregrille div{background:var(--papier);border:1px solid var(--brume);border-radius:10px;padding:10px 12px;font-size:.92rem}
.scoregrille b{font-family:var(--titre);display:block}
.cert-form{max-width:560px;margin:26px 0 10px}
.cert-form label{display:block;font-weight:600;margin-bottom:6px}
.cert-form input{width:100%;font:inherit;padding:12px 14px;border:2px solid var(--brume);border-radius:10px;background:#fff;color:var(--encre)}
.cert-form input:focus{border-color:var(--vert);outline:none}
.cert-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.msg{min-height:1.5em;margin:10px 0 0;font-size:.95rem;color:var(--doux)}
.msg.err{color:var(--corail);font-weight:600}
#resultCert{margin:24px 0;max-width:860px}
#certCanvas{width:100%;height:auto;display:block;border:1px solid var(--brume);border-radius:10px;box-shadow:0 14px 40px rgba(27,25,21,.12);background:#fff}
.petit{font-size:.88rem;color:var(--doux);max-width:70ch}
.q button:disabled{cursor:default}
.q button:disabled:not(.ok){opacity:.55}
.quiz .note-score{font-size:.88rem;color:var(--doux);margin:-6px 0 16px}

/* ===== Illustrations ===== */
figure.capture{margin:26px 0;max-width:860px}
figure.capture .cadre{border-radius:14px;overflow:hidden;box-shadow:0 14px 40px rgba(27,25,21,.12);border:1px solid var(--brume);background:#fff}
figure.capture svg,figure.capture img{display:block;width:100%;height:auto}
figure.capture figcaption{font-size:.93rem;color:var(--doux);margin-top:12px}
figure.capture figcaption strong{color:var(--encre)}
figure.capture figcaption ol{margin:.6em 0 0;columns:2;column-gap:32px;padding-left:1.4em}
figure.capture figcaption li{break-inside:avoid}
figure.capture.reelle figcaption .avert{display:none}
@media (max-width:700px){figure.capture figcaption ol{columns:1}}

/* ===== Responsive ===== */
@media (max-width:980px){
  .layout{grid-template-columns:1fr}
  .lateral{position:fixed;inset:0 auto 0 0;width:min(320px,86vw);z-index:50;transform:translateX(-100%);transition:transform .25s}
  .lateral.ouvert{transform:none;box-shadow:0 0 0 100vmax rgba(27,25,21,.5)}
  .menu-btn{display:flex;position:sticky;top:0;z-index:40;align-items:center;gap:10px;width:100%;background:var(--encre);color:#fff;border:0;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer}
  .hero{grid-template-columns:1fr;padding-top:40px}
  .maquette-zone{grid-template-columns:1fr}
  .explication{position:static}
}
@media (max-width:560px){
  body{font-size:16px}
  .fen-corps{grid-template-columns:1fr}
  .m-lateral{flex-direction:row;flex-wrap:wrap}
  .m-lateral .liste{display:none}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important}
}
.print-only{display:none}
@page{size:A4}
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;font-size:11pt;line-height:1.55}
  #activation,.bandeau-apercu,.teaser,#btnActiverLat,.lateral,.menu-btn,.copier,.options,.quiz,.maquette-zone,#certificat,.no-print,.hero .meta .pastille:last-child{display:none!important}
  .print-only{display:block}
  .layout{display:block}
  main{padding:0;max-width:none}
  .hero{grid-template-columns:1fr;padding:34mm 0 10mm;gap:22px;break-after:page}
  .hero h1{font-size:34pt}
  .toc{break-after:page;padding-top:6mm}
  .toc ol{list-style:none;padding:0;max-width:none}
  .toc li{padding:10px 0;border-bottom:1px solid var(--brume);font-size:13pt;margin:0}
  section.module{padding:0;border:0;break-before:page}
  h2,h3{break-after:avoid}
  figure.capture,.prompt,.encart,.carte,table,tr,.objectif,.exo,details,.formule div,.q,.echange{break-inside:avoid}
  .grille{grid-template-columns:repeat(2,1fr)}
  .formule{grid-template-columns:repeat(2,1fr)}
  figure.capture{margin:14px 0;max-width:90%}
  figure.capture .cadre{box-shadow:none}
  .echange{box-shadow:none}
  a{color:var(--vert);text-decoration:none}
  footer{break-before:avoid}
}

/* ===== Identité : Arial, palette des logos Claude ===== */
:root{--succes:#2E7D4F;--succes-clair:#E2F1E7;--terre:#D97857}
html,body,button,input,select,textarea{font-family:var(--texte)}
h1,h2,h3{letter-spacing:0}
.q button.ok{background:var(--succes-clair);border-color:var(--succes)}
.quiz .statut.reussi,.q .retour{}
.quiz .statut.reussi{color:var(--succes)}
.conditions li.ok{background:var(--succes-clair);border-color:var(--succes)}
.conditions li.ok .pt{background:var(--succes);border-color:var(--succes)}
.exo.fait{background:var(--succes-clair);border-color:var(--succes)}
.msg.ok{color:var(--succes)}
.prompt.bon{border-left-color:var(--succes)}

.marque-mention{font-size:.85rem;color:var(--doux)}
@media print{.logo-side{display:none}.logo-badge{box-shadow:none}}

/* Sommaire repliable sur ordinateur */
.lat-replier{align-self:flex-end;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);color:#E3D8C9;border:1px solid rgba(255,255,255,.22);border-radius:99px;padding:6px 12px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;margin-bottom:-6px}
.lat-replier:hover{background:rgba(255,255,255,.16);color:#fff}
.lat-ouvrir{display:none;position:fixed;top:14px;left:14px;z-index:45;align-items:center;gap:8px;background:var(--encre);color:#fff;border:0;border-radius:99px;padding:10px 18px;font:inherit;font-size:.92rem;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(27,25,21,.25)}
.lat-ouvrir:hover{background:#2c2924}
body.lat-ferme .layout{grid-template-columns:1fr}
body.lat-ferme .lateral{display:none}
body.lat-ferme .lat-ouvrir{display:inline-flex}
body.lat-ferme main{margin:0 auto;padding-top:40px}
body.vue-activation .lat-ouvrir{display:none!important}
@media (max-width:980px){.lat-replier,.lat-ouvrir{display:none!important}body.lat-ferme .lateral{display:flex}body.lat-ferme main{margin:0;padding-top:0}}
@media print{.lat-replier,.lat-ouvrir{display:none!important}}

/* ===== Ajouts du cours expert ===== */
.prompt.code{border-left:5px solid var(--encre);background:#1F1D19;color:#F3ECE1;border-color:#1F1D19}
.prompt.code .lbl{color:var(--soleil)}
.prompt.code pre{font-family:Consolas,Menlo,monospace;font-size:.86rem;line-height:1.5;padding-right:78px;overflow-x:auto;white-space:pre}
.prompt.code .copier{background:#2C2924;color:#F3ECE1;border-color:#4A453D}
.prompt{max-width:820px}
main{min-width:0}
.prompt.code{overflow:hidden}
figure.schema{margin:24px 0;max-width:860px}
figure.schema svg{display:block;width:100%;height:auto;background:#fff;border:1px solid var(--brume);border-radius:14px}
figure.schema figcaption{font-size:.92rem;color:var(--doux);margin-top:10px}
.niveaux{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:18px 0}
.niveaux div{background:var(--papier);border:1px solid var(--brume);border-radius:12px;padding:12px 14px;font-size:.92rem}
.niveaux b{display:block;font-family:var(--titre);color:var(--vert);margin-bottom:4px}
.score-audit{font-size:1.6rem;font-weight:800;font-family:var(--titre)}
.audit-liste{list-style:none;padding:0;margin:10px 0 0;max-width:none}
.audit-liste li{padding:6px 0 6px 28px;position:relative;border-bottom:1px solid var(--brume);margin:0;font-size:.95rem}
.audit-liste li::before{position:absolute;left:0;font-weight:700}
.audit-liste li.ok::before{content:"\2713";color:#2E7D4F}
.audit-liste li.ko::before{content:"\2717";color:var(--corail)}
.eval-table input[type=text]{width:100%;font:inherit;font-size:.9rem;padding:6px 8px;border:1px solid var(--brume);border-radius:8px}
.eval-table select{font:inherit;font-size:.9rem;padding:6px;border:1px solid var(--brume);border-radius:8px}
.eval-table td{padding:6px 8px}
@media print{figure.schema{break-inside:avoid}.lang-switch{display:none!important}}
.lang-switch{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lang-switch button{font:inherit;font-size:.85rem;font-weight:600;padding:6px 12px;border-radius:99px;cursor:pointer;border:1px solid rgba(255,255,255,.3);background:transparent;color:#E3D8C9}
.lang-switch button[aria-pressed="true"]{background:var(--soleil);border-color:var(--soleil);color:var(--encre)}
.lang-haut{justify-content:flex-end;padding-top:18px}
.lang-haut span{font-size:.88rem;color:var(--doux);margin-right:4px}
.lang-haut button{border-color:var(--brume);color:var(--encre);background:var(--papier)}
.lang-haut button[aria-pressed="true"]{background:var(--encre);border-color:var(--encre);color:#fff}
/* Activation : libellé du cadenas en anglais, sélecteur de langue sur l'écran d'activation */
html[lang="en"] body.apercu .nav a.verrouille::after{content:"Key required"}
.activation .lang-haut{justify-content:flex-start}

.lat-ouvrir:hover{background:#2c2924}

body.lat-ferme .lateral{display:none}

<section class="module" id="m1" data-module="1">
<div class="module-tete"><div class="module-num">1</div><h2>Sous le capot : comment fonctionne Claude</h2></div>
<div class="objectif"><strong>À la fin de ce module, vous saurez :</strong><ul><li>expliquer en termes simples comment un modèle de langage produit une réponse ;</li><li>relier ce fonctionnement aux forces et aux défauts de Claude (hallucinations, complaisance, sensibilité à la formulation) ;</li><li>raisonner en tokens, en fenêtre de contexte et en coût ;</li><li>choisir un modèle avec une méthode, et non au hasard.</li></ul></div>
<p>Au niveau débutant, vous avez appris à <em>parler</em> à Claude. Au niveau intermédiaire, à le <em>piloter</em>. Au niveau expert, vous allez apprendre à <strong>concevoir</strong> avec lui : des prompts, des contextes, des outils, des agents. Pour cela, il faut un modèle mental juste de ce qu'est Claude. Pas besoin de mathématiques : cinq idées suffisent.</p>
<h3>Où en êtes-vous ?</h3>
<p>Cochez ce que vous savez déjà faire sans aide. Le résultat vous indique comment aborder ce cours.</p>
<div class="outil" id="positionnement">
  <label class="coche"><input type="checkbox"><span>J'écris des prompts structurés avec des balises, des exemples et un format imposé.</span></label>
  <label class="coche"><input type="checkbox"><span>J'ai un Projet avec des instructions en six blocs et des documents de référence entretenus.</span></label>
  <label class="coche"><input type="checkbox"><span>Je sais expliquer la différence entre fenêtre de contexte et limite d'usage.</span></label>
  <label class="coche"><input type="checkbox"><span>Je reprends une conversation saturée avec un résumé de passage de relais.</span></label>
  <label class="coche"><input type="checkbox"><span>Je conduis une analyse de données en cinq étapes et je recalcule les chiffres clés.</span></label>
  <label class="coche"><input type="checkbox"><span>J'ai fait évoluer un Artifact sur plusieurs versions en corrigeant de façon ciblée.</span></label>
  <label class="coche"><input type="checkbox"><span>Je sais reconnaître une injection de consignes et j'applique le moindre privilège aux connecteurs.</span></label>
  <label class="coche"><input type="checkbox"><span>J'utilise le croisement, l'ancrage et la contradiction pour vérifier un résultat.</span></label>
  <p class="resultat" id="posResultat" aria-live="polite">Cochez les cases pour voir votre orientation.</p>
</div>
<h3>Cinq idées pour comprendre un modèle de langage</h3>
<div class="formule"><div><b>1. Des tokens</b><span>Claude ne lit pas des lettres ni des mots, mais des morceaux de texte appelés tokens. Tout se compte en tokens : ce qu'il lit, ce qu'il écrit, ce que vous payez.</span></div><div><b>2. Le token suivant</b><span>Claude produit sa réponse un token à la fois. À chaque pas, il calcule quel morceau de texte a le plus de sens après tout ce qui précède, puis recommence.</span></div><div><b>3. Le pré-entraînement</b><span>Le modèle a d'abord appris sur une immense quantité de textes. Il en a tiré des connaissances, des savoir-faire et des façons de raisonner, figés à une date limite.</span></div><div><b>4. Le post-entraînement</b><span>Anthropic l'a ensuite entraîné à être utile, honnête et prudent, avec des retours humains et une méthode propre à Anthropic, l'IA constitutionnelle : des principes écrits qui guident son comportement.</span></div><div><b>5. Des poids figés</b><span>Pendant votre conversation, Claude n'apprend rien au sens strict. Tout ce qui « change » vient du contexte : vos messages, vos fichiers, sa mémoire, les résultats de ses outils.</span></div></div>
<p>Ces cinq idées expliquent presque tout ce que vous observez au quotidien :</p>
<div class="tableau"><table><thead><tr><th>Ce que vous observez</th><th>L'explication</th><th>La parade de l'expert</th></tr></thead><tbody><tr><td>Une réponse fausse mais très bien écrite</td><td>Le modèle produit ce qui est <em>plausible</em>, et le plausible n'est pas toujours vrai</td><td>Fournir les sources, exiger des citations, vérifier</td></tr><tr><td>Une réponse différente quand vous reformulez</td><td>Chaque mot du contexte influence le calcul du token suivant</td><td>Stabiliser vos prompts, les tester sur plusieurs cas</td></tr><tr><td>Claude abonde dans votre sens</td><td>L'entraînement valorise les réponses jugées utiles par les humains, ce qui peut créer de la complaisance</td><td>Demander la contradiction, ne pas révéler votre préférence</td></tr><tr><td>Il ignore un événement récent</td><td>Ses connaissances s'arrêtent à une date limite</td><td>Activer la recherche web ou fournir le document</td></tr><tr><td>Il « oublie » une consigne dans une très longue conversation</td><td>Plus le contexte est chargé, plus l'attention se dilue</td><td>Contexte court et propre, consignes répétées aux bons endroits</td></tr><tr><td>Il est excellent pour rédiger, traduire, structurer</td><td>Ce sont des compétences omniprésentes dans ses données d'entraînement</td><td>Lui confier ces tâches en priorité</td></tr></tbody></table></div>
<div class="encart astuce"><b class="t">Le bon modèle mental</b><p>Imaginez un collaborateur brillant, très cultivé, extrêmement rapide, qui arrive le premier jour sans rien savoir de votre entreprise, qui n'ose pas toujours dire « je ne sais pas », et dont la mémoire se limite à la pile de documents posée sur son bureau. Votre travail d'expert : lui préparer la meilleure pile possible et vérifier son travail.</p></div>
<h3>Le contexte : tout ce que Claude voit</h3>
<p>À chaque réponse, Claude relit l'intégralité de son contexte. Pour l'expert, il est utile de le décomposer précisément, car chaque couche se règle à un endroit différent.</p>
<figure class="schema"><svg viewBox="0 0 820 330" role="img" aria-label="Les couches du contexte de Claude" xmlns="http://www.w3.org/2000/svg" font-family="Arial,Helvetica,sans-serif">
<text x="410" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1B1915">Ce que Claude lit avant chaque réponse</text>
<g font-size="14">
<rect x="40" y="52" width="740" height="34" rx="8" fill="#1B1915"/><text x="56" y="74" fill="#fff" font-weight="700">1. Consignes système</text><text x="770" y="74" fill="#F2B65C" text-anchor="end">fixées par Anthropic ou par l'application (API)</text>
<rect x="40" y="92" width="740" height="34" rx="8" fill="#B8512D"/><text x="56" y="114" fill="#fff" font-weight="700">2. Vos réglages permanents</text><text x="770" y="114" fill="#fff" text-anchor="end">préférences, style, instructions de Projet, mémoire</text>
<rect x="40" y="132" width="740" height="34" rx="8" fill="#D97857"/><text x="56" y="154" fill="#fff" font-weight="700">3. Outils disponibles</text><text x="770" y="154" fill="#fff" text-anchor="end">descriptions des connecteurs, Skills, recherche, code</text>
<rect x="40" y="172" width="740" height="34" rx="8" fill="#F2B65C"/><text x="56" y="194" fill="#1B1915" font-weight="700">4. Documents et fichiers</text><text x="770" y="194" fill="#1B1915" text-anchor="end">pièces jointes, connaissances du Projet</text>
<rect x="40" y="212" width="740" height="34" rx="8" fill="#FBEEC8"/><text x="56" y="234" fill="#1B1915" font-weight="700">5. Historique de la conversation</text><text x="770" y="234" fill="#1B1915" text-anchor="end">vos messages, ses réponses, résultats des outils</text>
<rect x="40" y="252" width="740" height="34" rx="8" fill="#FBE8DE" stroke="#B8512D" stroke-width="2"/><text x="56" y="274" fill="#1B1915" font-weight="700">6. Votre dernier message</text><text x="770" y="274" fill="#1B1915" text-anchor="end">la demande du moment, souvent la plus influente</text>
</g>
<text x="410" y="312" text-anchor="middle" font-size="13" fill="#6A6158">Tout ce qui n'est pas dans ces couches n'existe pas pour Claude.</text>
</svg><figcaption>Les couches du contexte. L'expert sait sur laquelle agir : un défaut récurrent se corrige dans les réglages permanents, un défaut ponctuel dans le message.</figcaption></figure>
<p>Trois règles d'ingénierie découlent de ce schéma :</p>
<ol><li><strong>Le signal avant le volume.</strong> Un contexte plus long n'est pas un meilleur contexte. Au-delà d'un certain point, chaque document inutile dilue l'attention portée aux documents utiles.</li><li><strong>L'emplacement compte.</strong> Pour un long document, placez-le en début de message et posez votre question à la fin : c'est la disposition qui donne en général les meilleurs résultats.</li><li><strong>Ce qui revient souvent monte d'un étage.</strong> Une consigne répétée dans trois conversations doit devenir une instruction de Projet, une préférence ou une Skill (module 7).</li></ol>
<h3>Tokens et coûts : penser comme un ingénieur</h3>
<p>En français, comptez environ un token pour 3 à 4 caractères, soit à peu près 1,3 à 1,5 token par mot. Une page A4 dense représente de l'ordre de 800 à 1 000 tokens. Ces chiffres sont des ordres de grandeur : seul le compteur officiel (dans la Console ou via l'API) est exact.</p>
<p>Sur l'API, on paie séparément les <strong>tokens d'entrée</strong> (ce que Claude lit) et les <strong>tokens de sortie</strong> (ce qu'il écrit, y compris sa réflexion), à un prix exprimé par million de tokens. La sortie coûte nettement plus cher que l'entrée. Sur claude.ai, vous ne payez pas au token, mais vos <strong>limites d'usage</strong> suivent la même logique : contexte long, modèle puissant et réflexion étendue consomment plus vite votre quota.</p>
<div class="outil" id="outilTok">
  <label for="tkTexte">Texte à mesurer (collez un document, un prompt, un tableau…)</label>
  <textarea id="tkTexte" rows="5" placeholder="Collez ici votre texte…"></textarea>
  <div class="grille-form">
    <div><label for="tkSortie">Longueur de réponse attendue (en mots)</label><input id="tkSortie" type="number" min="0" value="400"></div>
    <div><label for="tkFen">Fenêtre de contexte du modèle (tokens, valeur d'exemple)</label><input id="tkFen" type="number" min="1000" value="200000"></div>
    <div><label for="tkPrixE">Prix d'entrée (en dollars par million de tokens, à relever sur la page des tarifs)</label><input id="tkPrixE" type="number" min="0" step="0.01" value="3"></div>
    <div><label for="tkPrixS">Prix de sortie (en dollars par million de tokens)</label><input id="tkPrixS" type="number" min="0" step="0.01" value="15"></div>
    <div><label for="tkNb">Nombre d'appels identiques par mois</label><input id="tkNb" type="number" min="1" value="1000"></div>
    <div><label for="tkTaux">Taux de change (FCFA pour 1 dollar)</label><input id="tkTaux" type="number" min="1" value="600"></div>
  </div>
  <div class="resultats">
    <div><b id="tkE">0</b><span>tokens d'entrée estimés</span></div>
    <div><b id="tkS">0</b><span>tokens de sortie estimés</span></div>
    <div><b id="tkC1">0</b><span>coût d'un appel (FCFA)</span></div>
    <div><b id="tkCm">0</b><span>coût mensuel (FCFA)</span></div>
  </div>
  <p style="margin:14px 0 6px">Part de la fenêtre de contexte occupée : <strong id="tkPct">0 %</strong></p>
  <div class="jauge"><span id="tkJauge"></span></div>
  <p class="petit" style="margin-top:10px">Estimation indicative (1 token ≈ 3,5 caractères, 1 mot ≈ 1,4 token). Les prix par défaut sont des valeurs d'exemple : remplacez-les par les tarifs officiels du modèle choisi.</p>
</div>
<h3>La famille des modèles Claude</h3>
<p>Anthropic publie plusieurs générations de modèles, et dans chaque génération plusieurs tailles. En novembre 2026, la génération la plus récente est la famille Claude 5 : on y trouve notamment <strong>Haiku 5.5</strong>, <strong>Sonnet 5.5</strong>, <strong>Opus 5.5</strong> et <strong>Fable 5.2</strong>. Les noms changeront : retenez la logique des gammes plutôt que les numéros, et consultez la page des modèles d'Anthropic pour le positionnement exact de chacun.</p>
<div class="tableau"><table><thead><tr><th>Gamme</th><th>Profil</th><th>Usages typiques</th></tr></thead><tbody><tr><td>Haiku</td><td>Le plus rapide et le plus économique</td><td>Tri, classement, extraction en volume, réponses instantanées, sous-tâches d'un agent</td></tr><tr><td>Sonnet</td><td>L'équilibre qualité, vitesse et coût</td><td>La grande majorité du travail : rédaction, analyse, code, agents du quotidien</td></tr><tr><td>Opus et modèles de pointe</td><td>Le maximum de capacité de raisonnement</td><td>Problèmes difficiles, longues tâches autonomes, code complexe, décisions à fort enjeu</td></tr></tbody></table></div>
<div class="encart note"><b class="t">La méthode de l'expert : l'escalade</b><p>Ne choisissez pas « le meilleur modèle » par principe. Définissez d'abord ce qu'est un bon résultat (module 12), testez avec le modèle le plus léger raisonnable, puis montez d'une gamme seulement si les tests échouent. Pour les systèmes en volume, combinez : un modèle léger trie, un modèle puissant traite les cas difficiles.</p></div>
<h3>Les réglages que l'expert connaît</h3>
<p>Sur claude.ai, l'essentiel des réglages est caché. Sur l'API, vous en voyez d'autres. Connaître leur rôle vous aide à comprendre les comportements observés.</p>
<div class="tableau"><table><thead><tr><th>Réglage</th><th>Rôle</th><th>Conseil</th></tr></thead><tbody><tr><td>Température</td><td>Dose d'aléatoire dans le choix des tokens</td><td>Basse pour l'extraction et l'analyse, plus haute pour la créativité. Avec la réflexion étendue, elle n'est en général pas modifiable</td></tr><tr><td>Longueur maximale de sortie</td><td>Plafond de tokens que Claude peut écrire</td><td>Trop basse, la réponse est coupée net ; prévoyez de la marge, surtout avec la réflexion</td></tr><tr><td>Séquences d'arrêt</td><td>Textes qui interrompent la génération</td><td>Utile pour des formats très contrôlés</td></tr><tr><td>Effort ou budget de réflexion</td><td>Quantité de raisonnement autorisée</td><td>Plus de réflexion = plus de qualité sur les problèmes durs, mais plus de temps et de coût (module 3)</td></tr></tbody></table></div>
<div class="encart attention"><b class="t">Une limite à garder en tête</b><p>Même parfaitement piloté, Claude reste un système probabiliste. Deux appels identiques peuvent donner deux réponses différentes. Un système professionnel ne repose donc jamais sur une seule réponse non vérifiée : il prévoit des tests, des validations et, pour les actions sensibles, une décision humaine.</p></div>

<section class="module" id="m2" data-module="2" data-payant="1">
<div class="module-tete"><div class="module-num">2</div><h2>Ingénierie des prompts, niveau expert</h2></div>
<div class="objectif"><strong>À la fin de ce module, vous saurez :</strong><ul><li>construire un prompt complet en huit blocs, adapté aux tâches complexes et répétées ;</li><li>maîtriser les balises, les exemples, le chaînage et les formats de sortie ;</li><li>utiliser les schémas avancés : critique et révision, auto-cohérence, extraction de citations ;</li><li>auditer un prompt existant et le corriger avant de le déployer.</li></ul></div>
<p>Un prompt d'expert n'est pas une formule magique. C'est un <strong>cahier des charges</strong> : il dit qui, quoi, pour qui, à partir de quoi, sous quelle forme, avec quelles limites, et comment vérifier. Les modèles récents suivent les consignes avec une grande précision : ils font ce que vous écrivez, pas ce que vous pensiez. Le travail de l'expert est donc d'écrire exactement ce qu'il veut.</p>
<div class="encart astuce"><b class="t">Le test du collègue</b><p>Avant d'envoyer un prompt important, imaginez que vous le donnez à un collègue compétent qui ne connaît rien au dossier. Comprendrait-il le but, le public, le format et les limites sans vous poser de question ? Si non, Claude non plus.</p></div>
<h3>Anatomie d'un prompt en huit blocs</h3>
<div class="tableau"><table><thead><tr><th>Bloc</th><th>Contenu</th><th>Pourquoi c'est utile</th></tr></thead><tbody><tr><td>1. Rôle</td><td>Le point de vue et le niveau d'exigence attendus</td><td>Règle le vocabulaire, la profondeur et les priorités</td></tr><tr><td>2. Objectif</td><td>Le <em>pourquoi</em> de la tâche et l'usage du résultat</td><td>Claude fait de meilleurs arbitrages quand il connaît le but</td></tr><tr><td>3. Contexte</td><td>Public, situation, contraintes locales</td><td>Évite les réponses génériques</td></tr><tr><td>4. Données</td><td>Les documents, entre balises</td><td>Sépare clairement ce qu'il faut lire de ce qu'il faut faire</td></tr><tr><td>5. Tâche</td><td>Les étapes attendues, avec des verbes d'action</td><td>Rend le travail reproductible</td></tr><tr><td>6. Exemples</td><td>Deux à cinq cas de référence</td><td>Montre le résultat mieux qu'une description</td></tr><tr><td>7. Format</td><td>Structure, longueur, ton, langue</td><td>Rend la sortie directement exploitable</td></tr><tr><td>8. Vérification</td><td>Ce que Claude doit contrôler et signaler</td><td>Fait apparaître les incertitudes au lieu de les cacher</td></tr></tbody></table></div>
<div class="prompt bon"><span class="lbl">Exemple complet : analyse d'un appel d'offres</span><button class="copier" type="button">Copier</button><pre>Tu es un ingénieur commercial senior spécialisé dans les marchés publics de travaux au Sénégal.

&lt;objectif&gt;
Je dois décider d'ici vendredi si notre entreprise répond à cet appel d'offres. Ton analyse servira de base à la réunion de décision avec la direction.
&lt;/objectif&gt;

&lt;contexte&gt;
Entreprise de BTP de 45 salariés basée à Thiès, chiffre d'affaires annuel d'environ 1,8 milliard de FCFA. Nous avons déjà réalisé des forages et de petits ouvrages d'assainissement, jamais de route.
&lt;/contexte&gt;

&lt;documents&gt;
&lt;document nom="dossier_consultation"&gt;[collez ou joignez le DAO]&lt;/document&gt;
&lt;document nom="references_entreprise"&gt;[collez la liste de nos références]&lt;/document&gt;
&lt;/documents&gt;

&lt;tâche&gt;
1. Extrais dans &lt;citations&gt; les passages exacts du DAO qui fixent les critères d'éligibilité, les délais et les garanties.
2. À partir de ces seules citations, évalue notre éligibilité critère par critère.
3. Identifie les trois principaux risques pour nous.
4. Formule une recommandation : répondre, répondre en groupement, ou ne pas répondre.
&lt;/tâche&gt;

&lt;format&gt;
Un tableau (critère, exigence citée, notre situation, conforme oui/non/à vérifier), puis les risques, puis la recommandation en cinq lignes maximum. Français professionnel, sans jargon inutile.
&lt;/format&gt;

&lt;vérification&gt;
N'invente aucune exigence absente du DAO. Si une information manque pour conclure, écris « à vérifier » et indique quel document la contiendrait. Termine par ton niveau de confiance global.
&lt;/vérification&gt;</pre></div>
<h3>Les balises : la grammaire de l'expert</h3>
<p>Claude a été entraîné à exploiter des structures balisées. Quelques règles suffisent :</p>
<ul><li>Choisissez des noms explicites et gardez-les identiques dans tout le prompt : si vous écrivez <code>&lt;contrat&gt;</code>, ne parlez pas ensuite du « document ».</li><li>Faites référence aux balises dans vos consignes : « en t'appuyant uniquement sur le contenu de <code>&lt;contrat&gt;</code> ».</li><li>Imbriquez quand il y a plusieurs documents : <code>&lt;documents&gt;</code> contenant plusieurs <code>&lt;document nom="…"&gt;</code>.</li><li>Demandez aussi une sortie balisée quand vous voulez séparer raisonnement et résultat : <code>&lt;analyse&gt;</code> puis <code>&lt;réponse&gt;</code>. Vous pourrez ne garder que la réponse.</li></ul>
<h3>Les exemples : la technique la plus sous-estimée</h3>
<p>Une description du style attendu laisse une marge d'interprétation. Des exemples la suppriment. Pour qu'ils soient efficaces :</p>
<ol><li>Donnez-en <strong>trois à cinq</strong>, assez <strong>variés</strong> pour que Claude comprenne le principe et ne recopie pas un modèle unique.</li><li>Incluez au moins un <strong>cas difficile</strong> ou limite, avec la réponse attendue.</li><li>Encadrez-les : <code>&lt;exemples&gt;&lt;exemple&gt;…&lt;/exemple&gt;&lt;/exemples&gt;</code>, et précisez « ce sont des illustrations, ne recopie pas leur contenu ».</li><li>Vérifiez qu'ils sont cohérents avec vos consignes : en cas de contradiction, Claude suit souvent l'exemple.</li></ol>
<h3>Expliquer le pourquoi</h3>
<p>Une consigne accompagnée de sa raison est mieux appliquée et mieux généralisée. « N'utilise jamais de points de suspension » est moins efficace que « Ce texte sera lu par une synthèse vocale qui ne sait pas prononcer les points de suspension, n'en utilise donc pas ». Claude comprend alors l'intention et l'applique aussi aux cas que vous n'aviez pas prévus.</p>
<h3>Dire ce que l'on veut, et le calibrer</h3>
<div class="tableau"><table><thead><tr><th>Moins efficace</th><th>Plus efficace</th></tr></thead><tbody><tr><td>Ne fais pas de liste.</td><td>Rédige en paragraphes continus, avec des transitions.</td></tr><tr><td>Sois bref.</td><td>120 mots maximum, trois phrases par paragraphe.</td></tr><tr><td>Sois créatif !</td><td>Propose trois concepts très différents les uns des autres, dont un inattendu.</td></tr><tr><td>IMPORTANT !!! RESPECTE ABSOLUMENT LE FORMAT !</td><td>Le résultat sera importé automatiquement dans Excel : respecte exactement les colonnes ci-dessous.</td></tr><tr><td>Fais une belle page web.</td><td>Une page sobre, responsive, avec ces cinq rubriques, ces couleurs, et des boutons d'au moins 44 pixels pour le tactile.</td></tr></tbody></table></div>
<div class="encart attention"><b class="t">Les majuscules et les menaces sont contre-productives</b><p>Avec les modèles récents, très attentifs aux consignes, les injonctions en majuscules (« CRITIQUE », « OBLIGATOIRE ») peuvent provoquer un excès de zèle : Claude applique la règle partout, même là où elle n'a pas de sens. Un ton normal, une raison claire et un exemple valent mieux.</p></div>
<h3>Le chaînage : découper pour fiabiliser</h3>
<p>Une tâche complexe confiée en un seul prompt mélange plusieurs compétences. En la découpant, chaque étape est plus simple, vérifiable et améliorable séparément. Le résultat d'une étape devient l'entrée de la suivante.</p>
<div class="formule"><div><b>Extraire</b><span>Lister les faits, chiffres et citations utiles, sans interprétation.</span></div><div><b>Analyser</b><span>Raisonner uniquement à partir de l'extraction validée.</span></div><div><b>Produire</b><span>Rédiger le livrable au format demandé.</span></div><div><b>Vérifier</b><span>Relire le livrable par rapport à l'extraction et aux consignes.</span></div></div>
<p>Dans claude.ai, chaque étape peut être un message successif de la même conversation. Avec l'API ou un agent, chaque étape devient un appel distinct, ce qui permet d'utiliser un modèle différent par étape (module 10).</p>
<h3>Les schémas avancés</h3>
<div class="grille"><div class="carte"><h4>Extraction de citations</h4><p>Pour un long document : « extrais d'abord dans &lt;citations&gt; les passages pertinents, puis réponds en t'appuyant uniquement sur eux ». Réduit fortement les inventions.</p></div><div class="carte"><h4>Critique et révision</h4><p>Premier jet, puis « critique ce texte selon ces quatre critères », puis « réécris en corrigeant chaque point ». Trois tours valent souvent mieux qu'un prompt parfait.</p></div><div class="carte"><h4>Auto-cohérence</h4><p>Pour une question délicate, générez plusieurs réponses indépendantes (conversations neuves) et comparez : les convergences sont solides, les divergences sont à vérifier.</p></div><div class="carte"><h4>Droit au « je ne sais pas »</h4><p>Autorisez explicitement Claude à dire qu'il ne sait pas ou que l'information manque. Sans cette permission, il a tendance à combler les trous.</p></div><div class="carte"><h4>Méta-prompting</h4><p>Demandez à Claude de rédiger ou d'améliorer votre prompt : « voici mon objectif et mon brouillon de prompt, pose-moi les questions utiles puis propose une version optimisée ».</p></div><div class="carte"><h4>Questions d'abord</h4><p>Pour un besoin flou : « avant de commencer, pose-moi les cinq questions dont les réponses changeraient le plus ton travail ».</p></div></div>

<div class="prompt bon"><span class="lbl">Méta-prompt : faire écrire un prompt système</span><button class="copier" type="button">Copier</button><pre>Je veux créer un prompt système réutilisable pour la tâche suivante : [décrivez la tâche, les utilisateurs, la fréquence].
Exemples de demandes réelles : [2 ou 3 demandes typiques].
Ce qui serait un mauvais résultat : [erreurs à éviter].

1. Pose-moi d'abord les questions qui te manquent (5 maximum).
2. Rédige ensuite le prompt en blocs balisés : rôle, objectif, contexte, règles avec leur raison, format, conduite en cas de doute.
3. Propose enfin 8 cas de test (dont 3 difficiles) pour vérifier ce prompt, avec le résultat attendu pour chacun.</pre></div>
<h3>Prompt système ou message ?</h3>
<p>Sur l'API et dans les applications, le <strong>prompt système</strong> fixe le cadre permanent (rôle, règles, ton), et les <strong>messages</strong> portent la demande du moment. Sur claude.ai, l'équivalent du prompt système est la combinaison préférences, style et instructions de Projet. Règle pratique : ce qui est vrai pour toutes les demandes va dans le cadre permanent, ce qui change à chaque fois va dans le message.</p>
<h3>Outil : générateur de prompt expert</h3>
<div class="outil" id="outilGen">

    <div><label for="pgRole">Rôle</label><input id="pgRole" type="text" placeholder="contrôleur de gestion senior dans une PME de négoce"></div>

</div>

<section class="module" id="m3" data-module="3" data-payant="1">
<div class="module-tete"><div class="module-num">3</div><h2>Raisonnement, réflexion étendue et vérification</h2></div>
<div class="objectif"><strong>À la fin de ce module, vous saurez :</strong><ul><li>savoir quand la réflexion étendue améliore vraiment le résultat, et quand elle gaspille ;</li><li>formuler des demandes qui guident le raisonnement sans le brider ;</li><li>comprendre ce que montre (et ne montre pas) le raisonnement affiché ;</li><li>organiser une vérification indépendante des résultats importants.</li></ul></div>
<p>Les modèles Claude peuvent « réfléchir » avant de répondre : ils produisent un raisonnement intermédiaire, puis la réponse. Sur claude.ai, c'est l'option de <strong>réflexion étendue</strong> ; sur l'API, un paramètre qui fixe un budget ou un niveau d'effort de réflexion. Selon les modèles, cette réflexion peut aussi être <strong>adaptative</strong> (le modèle décide lui-même de combien réfléchir) et <strong>intercalée</strong> avec les outils : il réfléchit, appelle un outil, réfléchit à nouveau sur le résultat.</p>
<h3>Quand activer la réflexion</h3>
<div class="tableau"><table><thead><tr><th>La réflexion aide beaucoup</th><th>La réflexion aide peu ou pas</th></tr></thead><tbody><tr><td>Calculs en plusieurs étapes, finances, dimensionnements</td><td>Reformuler, traduire, corriger l'orthographe</td></tr><tr><td>Problèmes logiques, planification sous contraintes</td><td>Rédiger un courriel simple</td></tr><tr><td>Analyse d'un dossier avec des informations contradictoires</td><td>Répondre à une question factuelle courte</td></tr><tr><td>Code complexe, débogage difficile</td><td>Extraire des champs d'un document clair</td></tr><tr><td>Décision avec arbitrages multiples</td><td>Brainstorming rapide</td></tr></tbody></table></div>
<p>Le prix à payer : plus de temps d'attente, et plus de consommation (les tokens de réflexion sont facturés comme de la sortie sur l'API et pèsent sur vos limites sur claude.ai).</p>
<h3>Bien guider le raisonnement</h3>
<p>Avec la réflexion étendue, les consignes de <strong>haut niveau</strong> donnent souvent de meilleurs résultats que des étapes imposées dans le détail : le modèle trouve parfois un meilleur chemin que celui que vous auriez prescrit. Donnez l'objectif, les critères et les contrôles ; laissez la méthode ouverte, puis lisez le raisonnement pour ajuster.</p>
<div class="prompt bon"><span class="lbl">Consigne de haut niveau (avec réflexion étendue)</span><button class="copier" type="button">Copier</button><pre>Réfléchis en profondeur à ce problème de planification. Envisage plusieurs approches avant d'en choisir une. Avant de conclure, vérifie ta solution contre chacune des contraintes listées et corrige-la si l'une n'est pas respectée.</pre></div>
<div class="prompt bon"><span class="lbl">Raisonnement explicite (sans réflexion étendue)</span><button class="copier" type="button">Copier</button><pre>Avant de répondre, raisonne étape par étape dans une balise &lt;analyse&gt; : liste les données, les hypothèses, puis les calculs. Donne ensuite uniquement le résultat final dans une balise &lt;réponse&gt;.</pre></div>

<div class="encart note"><b class="t">Sans l'option, on peut quand même faire raisonner</b><p>Si la réflexion étendue n'est pas disponible ou que vous voulez garder la maîtrise de la forme, demandez un raisonnement écrit dans une balise dédiée, puis la réponse séparée. Vous obtenez la plupart des bénéfices, et vous pouvez lire le raisonnement.</p></div>
<h3>Ce que le raisonnement affiché prouve, et ce qu'il ne prouve pas</h3>
<p>Le raisonnement visible est précieux pour comprendre une réponse et repérer une erreur de méthode. Mais les travaux de recherche d'Anthropic sur la fidélité du raisonnement montrent qu'il ne reflète <strong>pas toujours fidèlement</strong> la manière dont le modèle est réellement arrivé à sa conclusion. Conséquences pour l'expert :</p>
<ul><li>un raisonnement convaincant n'est <strong>pas une preuve</strong> : vérifiez le résultat, pas seulement la démarche ;</li><li>un raisonnement qui hésite ou se contredit est un excellent <strong>signal d'alerte</strong> ;</li><li>ne fondez pas une décision importante sur « il a l'air d'avoir bien réfléchi ».</li></ul>
<h3>Organiser la vérification</h3>
<p>La vérification d'un expert ne consiste pas à relire en espérant voir l'erreur. Elle se conçoit, comme le travail lui-même.</p>
<div class="grille"><div class="carte"><h4>Vérification par les tests</h4><p>Donnez à Claude un moyen objectif de contrôler son travail : des cas de test pour un calcul, des valeurs connues, des contraintes à cocher une par une.</p></div><div class="carte"><h4>Exécution de code</h4><p>Pour tout chiffre qui compte, demandez un calcul par exécution de code plutôt qu'un calcul « de tête ». Récupérez le script pour pouvoir le relancer.</p></div><div class="carte"><h4>Vérificateur indépendant</h4><p>Ouvrez une conversation neuve, donnez-lui le résultat et la consigne d'origine, et demandez de chercher les erreurs. Sans l'historique, il n'est pas influencé par le premier raisonnement.</p></div><div class="carte"><h4>Contre-expertise</h4><p>« Voici la conclusion. Construis le meilleur argument possible pour la conclusion opposée. » Si l'argument contraire est solide, creusez.</p></div><div class="carte"><h4>Vérification à la source</h4><p>Pour un fait, une loi, un prix : la source primaire, ouverte et lue, est la seule vérification qui vaille.</p></div><div class="carte"><h4>Revue humaine ciblée</h4><p>Concentrez votre propre relecture sur les points à fort enjeu (chiffres, engagements, noms) plutôt que sur l'ensemble.</p></div></div>

<div class="prompt bon"><span class="lbl">Vérificateur indépendant (à lancer dans une nouvelle conversation)</span><button class="copier" type="button">Copier</button><pre>Tu es un relecteur exigeant. Voici une consigne et le travail produit pour y répondre.
&lt;consigne&gt;[collez la consigne d'origine]&lt;/consigne&gt;
&lt;travail&gt;[collez le résultat]&lt;/travail&gt;
Cherche activement les erreurs : faits non justifiés, calculs faux, consignes non respectées, oublis, contradictions internes. Pour chaque problème : la citation concernée, le problème, la gravité (bloquant, important, mineur) et la correction proposée. Si tu ne trouves rien de sérieux, dis-le simplement, sans inventer de défaut.</pre></div>
<h3>Outil : choisir l'approche adaptée</h3>
<div class="outil" id="outilApproche">
  <div class="grille-form">
    <div><label for="apCx">Difficulté du raisonnement</label><select id="apCx"><option value="1">Faible (rédiger, reformuler)</option><option value="2" selected>Moyenne (analyse courante)</option><option value="3">Élevée (calculs, logique, arbitrages)</option></select></div>

    <div><label for="apEnj">Enjeu en cas d'erreur</label><select id="apEnj"><option value="1">Faible</option><option value="2" selected>Moyen</option><option value="3">Élevé (argent, juridique, santé, sécurité)</option></select></div>

<section class="module" id="m4" data-module="4" data-payant="1">
<div class="module-tete"><div class="module-num">4</div><h2>Ingénierie du contexte : Projets, mémoire et bases de connaissances</h2></div>
<div class="objectif"><strong>À la fin de ce module, vous saurez :</strong><ul><li>passer de l'écriture de prompts à la conception de contextes complets ;</li><li>architecturer un Projet professionnel et sa base documentaire ;</li><li>maîtriser les couches de personnalisation et la mémoire ;</li><li>appliquer les techniques des longues tâches : compaction, notes externes, contexte à la demande.</li></ul></div>
<p>Le prompt est une partie du problème. L'autre partie, souvent la plus importante, est <strong>tout ce qui entoure le prompt</strong> : instructions permanentes, documents, mémoire, outils, historique. On parle d'<strong>ingénierie du contexte</strong> : trouver le plus petit ensemble d'informations à fort signal qui permet à Claude de faire le travail. Trop peu, il improvise. Trop, il se disperse.</p>
<h3>Les six couches que vous contrôlez sur claude.ai</h3>
<div class="tableau"><table><thead><tr><th>Couche</th><th>Portée</th><th>Ce qu'on y met</th><th>Ce qu'on n'y met pas</th></tr></thead><tbody><tr><td>Préférences</td><td>Toutes les conversations</td><td>Langue, ton général, formats préférés, façon de signaler l'incertitude</td><td>Des règles propres à un dossier</td></tr><tr><td>Styles</td><td>Le ton et la forme de rédaction</td><td>Un style maison créé à partir de vos textes</td><td>Des faits ou des procédures</td></tr><tr><td>Instructions de Projet</td><td>Les conversations d'un Projet</td><td>Rôle, règles métier, format des livrables, conduite en cas de doute</td><td>Des données qui changent chaque semaine</td></tr><tr><td>Connaissances du Projet</td><td>Les conversations d'un Projet</td><td>Documents de référence qui font autorité</td><td>Des brouillons, doublons, versions périmées</td></tr><tr><td>Mémoire</td><td>D'une conversation à l'autre, si activée</td><td>Faits durables vous concernant</td><td>Des secrets, des données sensibles</td></tr><tr><td>Skills</td><td>Partout où elles sont activées</td><td>Des savoir-faire procéduraux réutilisables (module 7)</td><td>Du contexte propre à un seul client</td></tr></tbody></table></div>
<h3>Architecturer un Projet professionnel</h3>
<p>Un Projet d'expert ressemble à un petit système documentaire. Voici une structure qui fonctionne pour la plupart des activités :</p>
<div class="grille"><div class="carte"><h4>00_index</h4><p>Un document court qui décrit chaque fichier du Projet : son contenu, sa date, s'il fait autorité. Claude s'y repère comme dans une table des matières.</p></div><div class="carte"><h4>01_regles_metier</h4><p>Les règles stables : tarification, conditions générales, procédures, seuils de validation.</p></div><div class="carte"><h4>02_referentiels</h4><p>Les données de référence : catalogue, grille de prix, liste des produits, organigramme.</p></div><div class="carte"><h4>03_modeles</h4><p>Les gabarits de livrables : devis, rapport, courriel type, avec un exemple rempli.</p></div><div class="carte"><h4>04_exemples</h4><p>Trois à cinq livrables réels réussis (anonymisés) qui montrent le niveau attendu.</p></div><div class="carte"><h4>05_journal</h4><p>Les décisions prises, avec leur date : ce qui évite de rediscuter ce qui a été tranché.</p></div></div>

<div class="encart astuce"><b class="t">Une règle d'or pour les connaissances</b><p><strong>Une information, un seul endroit.</strong> Si le prix d'un article figure dans deux fichiers avec deux valeurs, Claude ne peut pas savoir lequel fait foi. Supprimez les doublons, datez les fichiers, et dites dans les instructions quel document l'emporte en cas de conflit.</p></div>
<p>Quand la base documentaire d'un Projet devient très volumineuse, Claude ne la lit plus intégralement à chaque message : selon les versions, il passe à un mode de <strong>recherche dans les connaissances</strong>, où il retrouve les passages pertinents au moment où il en a besoin. C'est puissant, mais cela renforce l'intérêt de fichiers bien nommés, découpés par sujet, avec des titres explicites : un passage mal titré est un passage difficile à retrouver.</p>
<h3>Des instructions de Projet de niveau expert</h3>
<p>Au-delà des six blocs du cours intermédiaire, l'expert ajoute trois éléments : la <strong>hiérarchie des sources</strong>, les <strong>seuils d'escalade</strong> et les <strong>tests d'acceptation</strong>.</p>
<div class="prompt bon"><span class="lbl">Instructions de Projet : cabinet comptable</span><button class="copier" type="button">Copier</button><pre>RÔLE
Tu es l'assistant d'un cabinet d'expertise comptable à Dakar. Tu prépares, tu ne valides pas : chaque livrable est relu par un collaborateur.

CONTEXTE
Clients : PME et TPE au Sénégal, référentiel SYSCOHADA révisé. Montants en FCFA.

HIÉRARCHIE DES SOURCES
1. Les documents du client joints à la conversation.
2. Les fichiers du Projet « 01_regles_cabinet » et « 02_plan_comptable ».
3. Tes connaissances générales, en le signalant explicitement.
En cas de conflit, la source de rang le plus élevé l'emporte, et tu signales le conflit.

RÈGLES
- Ne cite jamais un article de loi ou un taux sans indiquer sa source ; s'il vient de tes connaissances générales, écris « à vérifier dans le texte en vigueur ».
- Fais tous les calculs par exécution de code et donne le détail.
- Anonymise les noms de personnes physiques dans tes livrables.

ESCALADE
Arrête-toi et pose la question si : un montant dépasse 10 millions de FCFA, une écriture ne s'équilibre pas, ou un document semble incohérent.

FORMAT
Tableaux d'abord, commentaires ensuite. Termine chaque livrable par « Points à vérifier par le collaborateur ».

TEST D'ACCEPTATION
Un bon livrable peut être relu en moins de cinq minutes et ne contient aucune affirmation non sourcée.</pre></div>
<h3>La mémoire, vue par l'expert</h3>
<p>La mémoire de Claude (si elle est activée) synthétise des éléments durables issus de vos conversations et les réinjecte dans le contexte des conversations suivantes. Ce n'est pas un enregistrement intégral : c'est un <strong>résumé</strong>, qui peut être incomplet ou dater. Bonnes pratiques :</p>
<ul><li><strong>Cloisonnez</strong> : selon les versions, chaque Projet peut avoir sa propre mémoire, séparée de la mémoire générale. Utilisez-le pour éviter que les informations d'un client ne déteignent sur un autre.</li><li><strong>Relisez et corrigez</strong> la mémoire régulièrement dans les réglages ; supprimez ce qui est faux ou périmé.</li><li><strong>Utilisez le chat privé</strong> (incognito) pour ce qui ne doit rien laisser derrière soi.</li><li><strong>Ne comptez pas sur la mémoire pour les faits critiques</strong> : un tarif ou une règle métier se met dans un document du Projet, daté et vérifiable.</li></ul>
<h3>Les longues tâches : trois techniques d'ingénierie</h3>
<p>Quand un travail dépasse ce que contient une conversation (un mémoire, un audit, un projet de plusieurs semaines), l'expert utilise les techniques employées dans les agents professionnels :</p>
<div class="formule"><div><b>La compaction</b><span>Avant saturation, faire produire un résumé structuré (objectif, décisions, contraintes, chiffres clés, reste à faire) et repartir dans une conversation neuve avec ce résumé.</span></div><div><b>Les notes externes</b><span>Tenir un fichier d'avancement (par exemple « NOTES.md » ou un document du Projet) que Claude met à jour à chaque étape et relit au début de la suivante.</span></div><div><b>Le contexte à la demande</b><span>Ne pas tout charger d'emblée : laisser Claude chercher le bon document au moment où il en a besoin (connaissances du Projet, connecteur Drive, recherche dans les anciens chats).</span></div></div>

<div class="prompt bon"><span class="lbl">Tenir un journal d'avancement</span><button class="copier" type="button">Copier</button><pre>À la fin de chacune de nos séances de travail sur ce dossier, mets à jour le journal ci-dessous au lieu de le réécrire entièrement :
- ce qui a été fait aujourd'hui (3 lignes maximum) ;
- les décisions prises, avec la date ;
- les questions ouvertes ;
- la prochaine action précise.
&lt;journal&gt;[collez le journal existant, ou « vide » la première fois]&lt;/journal&gt;</pre></div>
<h3>Outil : générateur d'instructions de Projet (niveau expert)</h3>
<div class="outil" id="outilProj">

<section class="module" id="m5" data-module="5" data-payant="1">
<div class="module-tete"><div class="module-num">5</div><h2>Documents, données et fichiers à grande échelle</h2></div>
<div class="objectif"><strong>À la fin de ce module, vous saurez :</strong><ul><li>exploiter pleinement la lecture de PDF, d'images et de tableurs, en connaissant leurs limites ;</li><li>concevoir une extraction structurée fiable, avec un schéma et des contrôles ;</li><li>conduire une analyse de données reproductible par exécution de code ;</li><li>traiter des dossiers de plusieurs centaines de pages et produire des fichiers professionnels.</li></ul></div>
<h3>Ce que Claude lit vraiment</h3>
<div class="tableau"><table><thead><tr><th>Source</th><th>Ce que Claude perçoit</th><th>Points de vigilance</th></tr></thead><tbody><tr><td>PDF texte</td><td>Le texte, et selon les cas l'image des pages (graphiques, tableaux, mise en page)</td><td>Tableaux très denses, notes de bas de page, colonnes multiples</td></tr><tr><td>PDF scanné, photo</td><td>L'image, lue par la vision du modèle</td><td>Petits caractères, écriture manuscrite, reflets, pages de travers</td></tr><tr><td>Excel, CSV</td><td>Les données, idéalement analysées par exécution de code</td><td>Cellules fusionnées, plusieurs tableaux par feuille, formats de date mélangés</td></tr><tr><td>Images, schémas, captures</td><td>Le contenu visuel : objets, textes, relations, graphiques</td><td>Lecture de valeurs précises sur un graphique, comptage d'objets nombreux</td></tr><tr><td>Word, PowerPoint</td><td>Le texte et la structure</td><td>Contenu dans des zones de texte flottantes ou des images</td></tr></tbody></table></div>
<div class="encart astuce"><b class="t">Aider la vision</b><p>Pour une photo de document : bonne lumière, cadrage serré, une page par image, pas de reflet. Pour un tableau dense, recadrez en plusieurs images. Demandez à Claude de <strong>retranscrire d'abord</strong> ce qu'il lit, vérifiez la retranscription, puis seulement ensuite faites-le analyser.</p></div>
<h3>L'extraction structurée : la technique la plus rentable</h3>
<p>Transformer des documents non structurés (factures, bons de livraison, contrats, rapports de terrain) en tableau exploitable est l'un des meilleurs usages de Claude. Pour que ce soit fiable, l'expert travaille avec un <strong>schéma</strong>.</p>
<div class="formule"><div><b>1. Définir le schéma</b><span>Chaque champ avec son nom, son type, son format et sa règle quand il est absent.</span></div><div><b>2. Extraire</b><span>Un document à la fois, ou par petits lots, en exigeant la page ou le passage source.</span></div><div><b>3. Valider</b><span>Contrôles automatiques : totaux qui se recoupent, dates plausibles, champs obligatoires présents.</span></div><div><b>4. Réconcilier</b><span>Traiter à part les cas signalés « incertain » ; ne jamais les fusionner sans contrôle.</span></div></div>
<div class="prompt bon"><span class="lbl">Extraction de factures fournisseurs</span><button class="copier" type="button">Copier</button><pre>Extrais les informations de chaque facture jointe selon le schéma ci-dessous. Réponds uniquement par un tableau JSON valide, une entrée par facture.

&lt;schéma&gt;
fournisseur : texte, raison sociale telle qu'écrite
numero_facture : texte
date_facture : date au format AAAA-MM-JJ
montant_ht : nombre en FCFA, sans espace
tva : nombre en FCFA
montant_ttc : nombre en FCFA
page_source : numéro de page où figure le total
incertain : liste des champs dont tu n'es pas sûr, vide sinon
&lt;/schéma&gt;

Règles :
- Si un champ est absent, mets null : n'invente jamais une valeur.
- Vérifie que montant_ht + tva = montant_ttc ; sinon, ajoute "montant_ttc" dans incertain.
- Ne corrige pas les fautes de la facture : retranscris.</pre></div>
<h3>Analyse de données reproductible</h3>
<p>Quand l'exécution de code est activée (souvent dans les réglages, rubrique des capacités), Claude écrit et exécute réellement du code pour calculer, filtrer et tracer des graphiques. C'est la différence entre un chiffre <em>estimé</em> et un chiffre <em>calculé</em>. L'expert l'exploite à fond :</p>
<ul><li>Demandez « <strong>calcule</strong> » et non « estime » ; exigez que les totaux soient obtenus par le code.</li><li>Demandez le <strong>script</strong> à la fin : vous pourrez le relancer le mois prochain sur un nouveau fichier.</li><li>Faites <strong>profiler</strong> le fichier avant toute conclusion : nombre de lignes, valeurs manquantes, doublons, valeurs aberrantes.</li><li>Méfiez-vous des <strong>conclusions causales</strong> : une corrélation dans vos ventes n'est pas une explication. Demandez les explications alternatives.</li><li>Sur de petits échantillons (quelques semaines de données), demandez explicitement si l'écart observé est significatif ou peut être dû au hasard.</li></ul>
<div class="prompt bon"><span class="lbl">Analyse reproductible d'un registre de ponte</span><button class="copier" type="button">Copier</button><pre>Voici le registre quotidien de ponte de mes trois bâtiments (fichier joint).
1. Profile le fichier : colonnes, période, valeurs manquantes, anomalies. Ne conclus rien encore.
2. Calcule par exécution de code, pour chaque bâtiment : taux de ponte hebdomadaire, mortalité cumulée, consommation d'aliment par œuf.
3. Trace l'évolution du taux de ponte des trois bâtiments sur un même graphique.
4. Signale les semaines anormales et propose deux explications possibles pour chacune, sans trancher.
5. Donne-moi le script complet et commenté pour refaire cette analyse le mois prochain.</pre></div>
<h3>Les très gros dossiers</h3>
<p>Un dossier de 300 pages ne se traite pas avec une seule question « résume ». Trois stratégies, à combiner :</p>
<div class="tableau"><table><thead><tr><th>Stratégie</th><th>Principe</th><th>Quand l'utiliser</th></tr></thead><tbody><tr><td>Carte puis zoom</td><td>D'abord le plan et les enjeux de chaque partie, puis l'analyse partie par partie</td><td>Rapports, études, mémoires</td></tr><tr><td>Synthèse en deux temps</td><td>Une fiche par section (mêmes rubriques), puis une synthèse des fiches</td><td>Lots de documents homogènes (contrats, CV, rapports mensuels)</td></tr><tr><td>Questions ciblées</td><td>Une liste de questions précises, avec citation et page pour chaque réponse</td><td>Audit, vérification de conformité, appel d'offres</td></tr></tbody></table></div>
<div class="encart attention"><b class="t">Le piège du résumé superficiel</b><p>Plus un document est long, plus un résumé en une passe risque de survoler les détails décisifs, souvent situés au milieu. Pour un document qui engage (contrat, rapport réglementaire), privilégiez toujours les questions ciblées avec citations et pages.</p></div>
<h3>Produire des fichiers professionnels</h3>
<p>Selon votre forfait et vos réglages, Claude crée des fichiers Excel, Word, PowerPoint et PDF à télécharger. Ces capacités reposent sur des <strong>Skills</strong> fournies par Anthropic (module 7). Pour un résultat de niveau professionnel :</p>
<ul><li><strong>Excel</strong> : demandez des <strong>formules vivantes</strong> (et non des valeurs recopiées), des onglets séparés pour les données, les calculs et la synthèse, et une mise en forme conditionnelle pour les alertes.</li><li><strong>Word</strong> : demandez l'usage de styles de titres (pour une table des matières automatique), des tableaux propres, des en-têtes et pieds de page.</li><li><strong>PowerPoint</strong> : une idée par diapositive, un titre qui énonce la conclusion, des notes du présentateur.</li><li><strong>Gabarit maison</strong> : joignez votre modèle (logo, couleurs, structure) et demandez de le respecter ; mieux encore, transformez-le en Skill.</li></ul>
<h3>Outil : générateur de schéma d'extraction</h3>
<p>Décrivez les champs à extraire : l'outil produit un prompt d'extraction et un schéma JSON réutilisable (par exemple avec l'API au module 11).</p>
