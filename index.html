ne écrite dans CLAUDE.md ?","c":["Rien","Un hook est plus poli","Un hook est une commande exécutée automatiquement, donc un garde-fou déterministe"],"a":2,"f":"Une consigne peut être oubliée ; un hook s'exécute à chaque fois, quel que soit le comportement du modèle."},{"q":"Que rend le plus fiable le travail de Claude Code ?","c":["Une session très longue avec beaucoup de tâches mélangées","Un moyen objectif de vérifier : des tests ou une commande qui réussit ou échoue","Des consignes en majuscules"],"a":1,"f":"La boucle agentique converge quand l'agent peut observer objectivement si l'objectif est atteint."}],"10":[{"q":"Quelle est la recommandation d'Anthropic pour construire un système avec Claude ?","c":["Toujours construire un système à plusieurs agents","Commencer par la solution la plus simple et n'ajouter de l'autonomie que si elle améliore réellement le résultat","Éviter tout workflow"],"a":1,"f":"La complexité a un coût (tokens, délais, erreurs) : elle doit être justifiée par un gain mesuré."},{"q":"Une première étape classe les demandes clients et les envoie vers trois traitements différents. Quel schéma est-ce ?","c":["L'aiguillage (routage)","L'évaluateur-optimiseur","La compaction"],"a":0,"f":"Le routage oriente chaque demande vers le traitement le plus adapté."},{"q":"Quel objectif d'agent est le mieux formulé ?","c":["« Étudie le marché »","« Fais de ton mieux sur les fournisseurs »","« Un tableau des 20 fournisseurs avec prix, délais et source pour chacun »"],"a":2,"f":"Un objectif vérifiable permet à l'agent de savoir quand il a fini, et à vous de contrôler."},{"q":"Vous confiez une tâche à Claude dans le navigateur. Quelle précaution est essentielle ?","c":["Autoriser tous les sites d'un coup","Autoriser site par site et garder la validation des actions importantes, car les pages peuvent contenir des instructions malveillantes","Désactiver l'antivirus"],"a":1,"f":"La navigation expose Claude à du contenu non fiable : moindre privilège et validation humaine."}],"11":[{"q":"Dans la boucle d'utilisation d'outils, qui exécute réellement l'outil ?","c":["Claude, sur les serveurs d'Anthropic, pour tous les outils","Votre programme, qui renvoie ensuite le résultat à Claude","Le navigateur de l'utilisateur"],"a":1,"f":"Pour vos outils, Claude renvoie une demande structurée ; c'est votre code qui exécute et garde le contrôle."},{"q":"L'API se souvient-elle des messages précédents d'une conversation ?","c":["Oui, automatiquement pendant 30 jours","Oui, si on paie plus cher","Non : votre application renvoie l'historique à chaque appel"],"a":2,"f":"L'API est sans état : l'historique fait partie de chaque requête."},{"q":"Vous posez des milliers de questions sur le même catalogue de 80 pages. Quelle fonction réduit le plus le coût ?","c":["Le cache de prompt sur le catalogue","Augmenter max_tokens","Écrire le catalogue en majuscules"],"a":0,"f":"Le préfixe répété est mis en cache : les lectures suivantes coûtent une fraction du prix normal."},{"q":"Où ne faut-il jamais placer une clé d'API ?","c":["Dans une variable d'environnement du serveur","Dans un coffre à secrets","Dans le code d'une page web ou dans un dépôt de code"],"a":2,"f":"Une clé exposée est volée et utilisée à vos frais : elle reste côté serveur, hors du code."}],"12":[{"q":"Quel critère de réussite est le mieux formulé ?","c":["« Les résumés doivent être bons »","« Chaque résumé contient les 3 décisions, fait moins de 150 mots et n'invente aucun fait »","« Les résumés doivent plaire »"],"a":1,"f":"Un critère spécifique et mesurable permet de comparer objectivement deux versions."},{"q":"Pourquoi inclure des cas pièges dans un jeu de test ?","c":["Pour vérifier le comportement face aux demandes hors périmètre et aux instructions cachées","Pour faire baisser le score volontairement","Parce que c'est obligatoire légalement"],"a":0,"f":"Un système doit être robuste aux situations difficiles qu'il rencontrera en usage réel."},{"q":"Comment limiter les biais d' e d'entretien d'embauche, quelles questions faut-il exclure ?","c":["Les questions comportementales","Les questions sur les compétences","Les questions sur la vie privée, l'âge, la religion, la situation familiale ou l'origine"],"a":2,"f":"Ces questions sont discriminatoires : la grille porte uniquement sur les compétences."},{"q":"Pour une revue de contrat, pourquoi exiger la clause exacte et son numéro ?","c":["Pour ancrer l'analyse dans le texte réel et permettre une vérification rapide","Pour allonger le rapport","Parce que Claude ne sait pas résumer"],"a":0,"f":"L'ancrage sur des citations réduit les inventions et facilite la relecture par le juriste."}]},"en":{"1":[{"q":"Why can Claude produce false information with great confidence?","c":["Because it always copies a wrong website","Because it generates the most plausible text, and plausible is not always true","Because your connection is slow"],"a":1,"f":"The model predicts plausible sequences of tokens: plausibility is no guarantee of accuracy, hence the importance of sources and verification."},{"q":"During a conversation, does Claude learn from your messages in the sense that its weights change?","c":["Yes, it retrains with every message","Yes, but only on a paid plan","No: everything that changes comes from the context (messages, files, memory, tools)"],"a":2,"f":"The model's weights are frozen during use. \"Memory\" is a mechanism that feeds information back into the context."},{"q":"You need a 40-page report analyzed. Which layout generally gives the best results?","c":["The document first, the question and instructions at the end","The question first, then the document, no instructions","The document split across ten different conversations"],"a":0,"f":"For long documents, putting the content at the top and the request at the end generally improves answer quality."},{"q":"Under the escalation method, how do you choose a model for a new high-volume use case?","c":["Always take the most powerful","Always take the cheapest without testing","Define success criteria, test with a light model, move up a tier only if the tests fail"],"a":2,"f":"Start from the lightest model that passes the tests: the best combination of quality, cost and speed."}],"2":[{"q":"Which block of a prompt helps Claude most to make good trade-offs when the instructions do not cover a case?","c":["The goal, i.e. the why of the task","The font","The length of the prompt"],"a":0,"f":"When Claude knows the purpose and how the result will be used, it can settle unforeseen cases in the right direction."},{"q":"Why give several varied examples rather than just one?","c":["To make the prompt longer","So that Claude grasps the principle without copying a single model","Because a single example is forbidden"],"a":1,"f":"Varied examples, including a difficult case, show the general rule and prevent slavish imitation."},{"q":"For a long document, which technique reduces fabrication the most?","c":["Writing the instruction in capitals","Asking for a longer answer","First extracting the exact quotes, then answering only from them"],"a":2,"f":"Grounding on extracted quotes forces Claude to rely on the actual text."},{"q":"Why are commands like \"CRITICAL!!!\" discouraged with recent models?","c":["They can trigger overzealousness and out-of-place application of the rule","Anthropic forbids them","They slow down the network"],"a":0,"f":"Recent models follow instructions closely: a normal tone with a clear reason is more effective."}],"3":[{"q":"In which case does extended thinking add the least?","c":["A planning problem under constraints","Spell-checking an email","Debugging difficult code"],"a":1,"f":"Simple tasks gain nothing from long thinking, which costs time and usage."},{"q":"With extended thinking, which way of guiding is generally most effective?","c":["Imposing every micro-step in detail","Forbidding any reasoning","Giving the goal, the criteria and the checks, while leaving the method open"],"a":2,"f":"The model often finds a better path; you then read its reasoning to adjust the instructions."},{"q":"The displayed reasoning is clear and convincing. What should you conclude?","c":["That the conclusion is necessarily right","That it helps understanding, but the result itself still needs checking","That thinking should be turned off"],"a":1,"f":"Visible reasoning does not always faithfully reflect the real process: only checking the result is verification."},{"q":"Why run the verifier in a fresh conversation?","c":["So it is not influenced by the history and the first reasoning","Because it is faster","Because old conversations are deleted"],"a":0,"f":"A reviewer without the history judges the work on its merits, like a real independent expert."}],"4":[{"q":"What is context engineering?","c":["Writing longer prompts","Choosing the smallest set of high-signal information that lets Claude do the job","Turning on every available option"],"a":1,"f":"Too little context makes Claude improvise, too much distracts it: the expert looks for the right set."},{"q":"An item's price appears with two values in two Project files. What should you do?","c":["Keep both, Claude will choose","Add a third file","Remove the duplicate, date the files and state which source is authoritative"],"a":2,"f":"Information should live in a single place; the source hierarchy settles any remaining conflicts."},{"q":"Where should you store a price used in every quote for an activity?","c":["In Claude's general memory","In a dated document in the Project knowledge","In the conversation title"],"a":1,"f":"Critical facts belong in a verifiable document; memory is a summary that may be incomplete."},{"q":"Which technique lets you continue a very long task without saturating the context?","c":["Compaction: a structured summary, then a fresh conversation","Pasting all documents into every message","Writing in capitals"],"a":0,"f":"Compaction, external notes and just-in-time context are the three techniques for long tasks."}],"5":[{"q":"Why ask Claude to \"calculate\" rather than \"estimate\" when code execution is on?","c":["So the figures are actually produced by code, and therefore reproducible","Because \"estimate\" is forbidden","To get a longer answer"],"a":0,"f":"With code execution, Claude really computes; the retrieved script lets you redo and check the analysis."},{"q":"In a structured extraction, what should Claude do when a field is missing from the document?","c":["Guess the most likely value","Copy the value from the previous invoice","Use null and never invent"],"a":2,"f":"The missing-value rule is part of the schema: an invented value is worse than a flagged missing one."},{"q":"To check a 120-page contract that binds you, which strategy should you choose?","c":["A single-pass summary","Targeted questions, with quote and page for each answer","Reading only the first page"],"a":1,"f":"The decisive details can be anywhere: targeted questions with quotes are the safest method."},{"q":"What makes an Excel file produced by Claude truly reusable?","c":["Copied values everywhere","A single sheet with everything mixed together","Live formulas and separate data, calculation and summary tabs"],"a":2,"f":"With formulas, the workbook updates when the data changes."}],"6":[{"q":"Why must an API key never be placed in an Artifact?","c":["Because the code can be read by anyone who has access to the Artifact","Because the Artifact would become too slow","Because keys are free"],"a":0,"f":"Anything in a web page's code can be read: a secret does not belong there."},{"q":"What does the expert's development cycle start with?","c":["The final design","A specification covering users, data, calculations, screens, rules, edge cases and constraints","The CSV export"],"a":1,"f":"A clear specification enables a successful first draft and avoids many rounds of back-and-forth."},{"q":"Your tool has a defect. Which request is best?","c":["\"It doesn't work, redo everything\"","\"Improve the code\"","Describe the symptom, the steps to reproduce it and the expected behavior, then ask for a targeted fix"],"a":2,"f":"This is the format of a good bug report: it allows a precise fix without regressions."},{"q":"You need an application with user accounts, a database and a server. What is the most suitable choice?","c":["A single Artifact","A real project with Claude Code, plus human review","A custom style"],"a":1,"f":"Beyond a standalone tool, you need a structured project: Claude Code speeds things up, human review keeps it safe."}],"7":[{"q":"Which part of a Skill decides whether Claude will use it?","c":["The folder name only","The description, which says what the Skill does and when to use it","The size of the supporting files"],"a":1,"f":"At first, Claude only sees the name and description: the description is what triggers the Skill."},{"q":"What is progressive disclosure?","c":["Claude keeps only the description loaded at all times, then loads the instructions and files only when useful","Claude downloads the Skill slowly","The Skill updates itself"],"a":0,"f":"This mechanism lets you install many Skills without cluttering the context."},{"q":"Why put a calculation in a script rather than in the instructions?","c":["To look more technical","Because instructions are limited to ten lines","Because a script gives an exact, identical result every time"],"a":2,"f":"For anything that must be exact, code is more reliable than reasoning \"in its head\"."},{"q":"The Project says what you are working on. What does the Skill say?","c":["Which external tools","How you work: reusable procedural know-how","Who has access to the Project"],"a":1,"f":"Project = subject and documents, Skill = method, connector = access to tools."}],"8":[{"q":"What problem does the Model Context Protocol solve?","c":["It replaces the Internet","It avoids building a custom integration for each assistant-software pair, thanks to a common standard","It speeds up typing"],"a":1,"f":"MCP is a universal plug: an MCP server becomes usable by all compatible applications."},{"q":"Among the MCP primitives, which one does the model call to take action?","c":["Tools","Resources","Styles"],"a":0,"f":"Tools are actions the model decides to call, under the control of the host's permissions."},{"q":"Why should a tool return concise responses?","c":["To save electricity","Because MCP forbids long responses","Because every token returned takes up the model's context"],"a":2,"f":"A massive export dilutes attention and consumes context: return the essentials."},{"q":"Which practice most reduces the risk of an internal integration?","c":["Granting administrator rights to avoid blockages","Using a dedicated low-privilege account and separating read from write","Turning off logs"],"a":1,"f":"Least privilege limits the possible damage in case of error or attack."}],"9":[{"q":"What is the role of the CLAUDE.md file?","c":["Storing the project's passwords","Giving Claude, at every session, the project's commands, architecture and rules","Replacing the tests"],"a":1,"f":"It is the project's memory, read automatically: the equivalent of Project instructions."},{"q":"Before an important and risky change, which mode should you use first?","c":["Plan mode, to get a plan without changing anything","Bypassing permissions","None, start coding straight away"],"a":0,"f":"Explore and plan before changing anything: reviewing the plan costs little and prevents damage."},{"q":"What distinguishes a hook from an instruction written in CLAUDE.md?","c":["Nothing","A hook is more polite","A hook is a command run automatically, and therefore a deterministic guardrail"],"a":2,"f":"An instruction can be forgotten; a hook runs every time, whatever the model does."},{"q":"What makes Claude Code's work most reliable?","c":["A very long session with many mixed tasks","An objective way to check: tests or a command that succeeds or fails","Instructions in capitals"],"a":1,"f":"The agentic loop converges when the agent can objectively observe whether the goal is reached."}],"10":[{"q":"What is Anthropic's recommendation for building a system with Claude?","c":["Always build a multi-agent system","Start with the simplest solution and only add autonomy if it genuinely improves the result","Avoid any workflow"],"a":1,"f":"Complexity has a cost (tokens, delays, errors): it must be justified by a measured gain."},{"q":"A first step classifies customer requests and sends them to three different processes. Which pattern is this?","c":["Routing","Evaluator-optimizer","Compaction"],"a":0,"f":"Routing directs each request to the most appropriate handling."},{"q":"Which agent goal is best phrased?","c":["\"Study the market\"","\"Do your best on the suppliers\"","\"A table of the 20 suppliers with price, lead time and source for each\""],"a":2,"f":"A verifiable goal lets the agent know when it is done, and lets you check."},{"q":"You hand a task to Claude in the browser. Which precaution is essential?","c":["Authorize all sites at once","Authorize site by site and keep approval of important actions, because pages may contain malicious instructions","Disable the antivirus"],"a":1,"f":"Browsing exposes Claude to untrusted content: least privilege and human approval."}],"11":[{"q":"In the tool use loop, who actually runs the tool?","c":["Claude, on Anthropic's servers, for every tool","Your program, which then sends the result back to Claude","The user's browser"],"a":1,"f":"For your own tools, Claude returns a structured request; your code runs it and stays in control."},{"q":"Does the API remember the previous messages of a conversation?","c":["Yes, automatically for 30 days","Yes, if you pay more","No: your application sends the history with every call"],"a":2,"f":"The API is stateless: the history is part of every request."},{"q":"You ask thousands of questions about the same 80-page catalog. Which feature cuts costs the most?","c":["Prompt caching on the catalog","Raising max_tokens","Writing the catalog in capitals"],"a":0,"f":"The repeated prefix is cached: subsequent reads cost a fraction of the normal price."},{"q":"Where must an API key never be placed?","c":["In a server environment variable","In a secrets vault","In a web page's code or in a code repository"],"a":2,"f":"An exposed key gets stolen and used at your expense: it stays server-side, out of the code."}],"12":[{"q":"Which success criterion is best phrased?","c":["\"Summaries must be good\"","\"Each summary contains the 3 decisions, is under 150 words and invents no fact\"","\"Summaries must be pleasing\""],"a":1,"f":"A specific, measurable criterion lets you compare two versions objectively."},{"q":"Why include trap cases in a test set?","c":["To check the behavior with out-of-scope requests and hidden instructions","To lower the score on purpose","Because it is legally required"],"a":0,"f":"A system must be robust to the difficult situations it will meet in real use."},{"q":"How do you limit the biases of a model-based judge?","c":["Ask for a score from 1 to 100 without explanation","Always present the best answer first","Precise binary criteria, reasoning before the verdict and calibration against human grades"],"a":2,"f":"These three countermeasures make the judge more reliable and verifiable."},{"q":"You change a prompt to fix a case that was failing. What should you do next?","c":["Test only that case","Rerun the whole test set to check that no other case has regressed","Change the model at the same time"],"a":1,"f":"One fix can break others: always measure on the whole set, changing one thing at a time."}],"13":[{"q":"According to the three-factor rule, which combination makes an agent dangerous?","c":["Access to private data, exposure to untrusted content and the ability to communicate externally, all combined","A fast model and a slow model","A long conversation"],"a":0,"f":"All three combined allow exfiltration: remove at least one, or require human approval."},{"q":"Why prefer an allowlist to a list of prohibitions?","c":["Because it is longer","Because a list of prohibitions is always incomplete, whereas explicit authorization bounds the risk","Because it looks nicer"],"a":1,"f":"You cannot foresee every dangerous action; you allow only what is necessary."},{"q":"An autonomous agent must run downloaded code. What precaution should you take?","c":["Run it on your main machine","Give it your passwords to save time","Isolate it in a disposable container or virtual machine, with no access to your secrets"],"a":2,"f":"Isolation limits the consequences of an error or malicious content."},{"q":"Who remains responsible for a letter sent to a customer after Claude drafted it?","c":["Anthropic","The person or organization that sends it","Nobody"],"a":1,"f":"The tool helps, but responsibility for published or sent content remains human."}],"14":[{"q":"What is generally the most powerful cost-optimization lever?","c":["Writing more polite prompts","Choosing the right model for each task","Using a more recent browser"],"a":1,"f":"The choice of model (and routing between models) weighs more than all the other levers."},{"q":"To analyze the day's reports every night, with no urgency, which processing mode should you choose?","c":["Batch processing, at about half price","The most powerful model in real time","One manual conversation per report"],"a":0,"f":"Non-urgent tasks go through the batch API, which is much cheaper."},{"q":"Which formula gives an honest measure of return on investment?","c":["Time saved only","The number of messages sent","Time saved minus review time, setup time and the cost of the tool"],"a":2,"f":"Review and setup are part of the real cost."},{"q":"What is the right first step of a team rollout?","c":["Give everyone access on the same day","Choose a frequent, measurable, low-risk use case, then run a pilot"],"a":1,"f":"A well-scoped pilot produces measurable results and practices that can be expanded."}],"15":[{"q":"In every guide, which element must never be skipped?","c":["The profession-specific checkpoint (human or source verification)","The choice of document color","Enabling every connector"],"a":0,"f":"Each workflow includes a checkpoint: that is what makes professional use safe."},{"q":"For a flock performance diagnosis, what limit does the prompt set?","c":["Do not use figures","Make no health diagnosis and state when to call the vet","Do not compare with a reference"],"a":1,"f":"Claude helps analyze and point in a direction; the health decision belongs to the vet."},{"q":"In a job interview grid, which questions must be excluded?","c":["Behavioral questions","Questions about skills","Questions about private life, age, religion, family situation or origin"],"a":2,"f":"These questions are discriminatory: the grid covers only competencies."},{"q":"In a contract review, why require the exact clause and its number?","c":["To ground the analysis in the actual text and allow quick verification","To make the report longer","Because Claude cannot summarize"],"a":0,"f":"Grounding in quotes reduces fabrication and makes the lawyer's review easier."}]}})[EN?'en':'fr'];
  var NB=15;
  /* Progression commune aux deux langues : mêmes modules, mêmes bonnes réponses */
  var KEY='cours-claude-expert-progression-v1';
  var S={done:{},quiz:{},cert:{}};
  function charger(){try{var x=JSON.parse(localStorage.getItem(KEY)||'{}')||{};S.done=x.done||{};S.quiz=x.quiz||{};S.cert=x.cert||{};}catch(e){}}
  function sauver(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
  function etat(num){if(!S.quiz[num])S.quiz[num]={a:[],r:[]};return S.quiz[num];}
  function pc(x){return EN?x+'%':x+' %';}
  function stats(){
    var tot=0,att=0,bon=0,mods=0,par={};
    for(var m=1;m<=NB;m++){
      var n=QUIZ[m].length,st=S.quiz[m]||{a:[]},b=0,a=0;
      for(var i=0;i<n;i++){if(st.a[i]===0||st.a[i]===1){a++;if(st.a[i]===1)b++;}}
      tot+=n;att+=a;bon+=b;par[m]={n:n,a:a,b:b};
      if(S.done['m'+m])mods++;
    }
    return {tot:tot,att:att,bon:bon,mods:mods,par:par,pct:tot?Math.round(bon/tot*100):0};
  }
  function eligible(s){return s.mods===NB&&s.att===s.tot&&s.bon*100>=CONFIG.seuil*s.tot;}
  function majProgres(){
    var s=stats();
    document.querySelectorAll('#nav a[data-m]').forEach(function(a){a.classList.toggle('fait',!!S.done['m'+a.getAttribute('data-m')]);});
    var p=Math.round(s.mods/NB*100);
    document.getElementById('barre').style.width=p+'%';
    document.getElementById('barreAria').setAttribute('aria-valuenow',p);
    document.getElementById('progresTexte').textContent=EN?(s.mods+' of '+NB+' modules completed'):(s.mods+(s.mods>1?' modules terminés':' module terminé')+' sur '+NB);
    document.getElementById('scoreTexte').textContent=s.att?(L('Score des quiz : ','Quiz score: ')+pc(Math.round(s.bon/s.att*100))):L('Score des quiz : à venir','Quiz score: not yet');
  }
  charger();

  document.querySelectorAll('.quiz').forEach(function(box){
    var num=box.getAttribute('data-quiz'),data=QUIZ[num],zone=box.querySelector('.qs'),statut=box.querySelector('.statut'),st=etat(num);
    var note=document.createElement('p');note.className='note-score';note.textContent=L('Le score retenu est celui de votre première réponse à chaque question.','The score counts your first answer to each question.');
    box.insertBefore(note,zone);
    function maj(){
      var res=0,pr=0;data.forEach(function(_,i){if(st.r[i])res++;if(st.a[i]===1)pr++;});
      if(res===data.length){statut.textContent=L('Quiz terminé : '+pr+' / '+data.length+' à la première réponse. Module validé.','Quiz complete: '+pr+' / '+data.length+' on first answer. Module completed.');statut.className='statut reussi';S.done['m'+num]=true;}
      else{statut.textContent=EN?(res+' of '+data.length+' question'+(data.length>1?'s':'')+' answered correctly.'):(res+' question'+(res>1?'s':'')+' réussie'+(res>1?'s':'')+' sur '+data.length+'.');statut.className='statut';}
    }
    data.forEach(function(item,i){
      var q=document.createElement('div');q.className='q';
      var p=document.createElement('p');p.textContent=(i+1)+'. '+item.q;q.appendChild(p);
      var ch=document.createElement('div');ch.className='choix';
      var retour=document.createElement('p');retour.className='retour';retour.setAttribute('aria-live','polite');
      var boutons=[];
      item.c.forEach(function(txt,j){
        var b=document.createElement('button');b.type='button';b.textContent=txt;boutons.push(b);
        b.addEventListener('click',function(){
          if(st.r[i])return;
          var juste=(j===item.a);
          if(st.a[i]!==0&&st.a[i]!==1)st.a[i]=juste?1:0;
          boutons.forEach(function(x){x.classList.remove('ko');});
          if(juste){b.classList.add('ok');st.r[i]=true;boutons.forEach(function(x){x.disabled=true;});retour.textContent=L('Bonne réponse. ','Correct. ')+item.f;}
          else{b.classList.add('ko');retour.textContent=L('Pas tout à fait : essayez une autre réponse. Votre première réponse est comptée dans le score.','Not quite: try another answer. Your first answer is the one counted in the score.');}
          maj();sauver();majProgres();majCert();
        });
        ch.appendChild(b);
      });
      if(st.r[i]){boutons[item.a].classList.add('ok');boutons.forEach(function(x){x.disabled=true;});retour.textContent=L('Bonne réponse. ','Correct. ')+item.f;}
      q.appendChild(ch);q.appendChild(retour);zone.appendChild(q);
    });
    maj();
  });

  function setCond(id,ok,txt,ko){var li=document.getElementById(id);li.className=ok?'ok':(ko?'ko':'');li.querySelector('.tx').textContent=txt;}
  function majCert(){
    var s=stats(),errMax=s.tot-Math.ceil(CONFIG.seuil*s.tot/100);
    document.getElementById('totQ').textContent=s.tot;document.getElementById('errMax').textContent=errMax;
    setCond('cMods',s.mods===NB,s.mods+' / '+NB+L(' modules validés (chaque quiz réussi jusqu’au bout valide son module).',' modules completed (each quiz answered correctly to the end completes its module).'));
    setCond('cQuiz',s.att===s.tot,s.att+' / '+s.tot+L(' questions répondues.',' questions answered.'));
    var suff=s.bon*100>=CONFIG.seuil*s.tot,txt;
    if(s.att<s.tot)txt=L('Score provisoire : ','Provisional score: ')+pc(s.att?Math.round(s.bon/s.att*100):0)+L(' sur les questions déjà répondues. Minimum requis : ',' on the questions answered so far. Minimum required: ')+pc(CONFIG.seuil)+L(' au total.',' overall.');
    else txt=L('Votre score : ','Your score: ')+pc(s.pct)+L('. Minimum requis : ','. Minimum required: ')+pc(CONFIG.seuil)+'.';
    setCond('cScore',s.att===s.tot&&suff,txt,s.att===s.tot&&!suff);
    var g=document.getElementById('scoreGrille');g.innerHTML='';
    for(var m=1;m<=NB;m++){var d=document.createElement('div'),pm=s.par[m],b=document.createElement('b');b.textContent='Module '+m;d.appendChild(b);d.appendChild(document.createTextNode(pm.a?(pm.b+' / '+pm.n+L(' à la 1re réponse',' on first answer')):L('Pas encore fait','Not done yet')));g.appendChild(d);}
    var ok=eligible(s);
    document.getElementById('genCert').disabled=!ok;
    document.getElementById('refaire').hidden=!(s.att===s.tot&&!suff);
    var msg=document.getElementById('msgCert');
    if(ok){msg.className='msg';msg.textContent=L('Bravo, toutes les conditions sont remplies. Saisissez votre nom puis générez votre certificat.','Well done, all the conditions are met. Enter your name, then generate your certificate.');}
    else if(s.att===s.tot&&!suff){msg.className='msg err';msg.textContent=L('Le score minimum n’est pas atteint. Relisez les modules concernés, puis recommencez les quiz.','The minimum score has not been reached. Reread the modules concerned, then restart the quizzes.');}
    else{msg.className='msg';msg.textContent=L('Le bouton s’active dès que toutes les conditions ci-dessus sont remplies.','The button becomes active as soon as all the conditions above are met.');}
  }
  document.getElementById('refaire').addEventListener('click',function(){
    if(confirm(L('Effacer vos réponses aux quiz pour les recommencer ? Vos exercices cochés sont conservés.','Erase your quiz answers to start them again? Your ticked exercises are kept.'))){S.quiz={};S.done={};sauver();location.hash='#m1';location.reload();}
  });
  var nomInput=document.getElementById('nomCert');if(S.cert&&S.cert.nom)nomInput.value=S.cert.nom;

  function coupe(ctx,texte,maxW){var mots=texte.split(' '),lignes=[],cur='';mots.forEach(function(w){var t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lignes.push(cur);cur=w;}else cur=t;});if(cur)lignes.push(cur);return lignes;}
  function dessiner(cv,nom,score,dateTxt,ref){
    var CW=1123,CH=794,SC=2,ENC='#1B1915',VERT='#B8512D',SOL='#F2B65C',DOUX='#6A6158';
    cv.width=CW*SC;cv.height=CH*SC;var ctx=cv.getContext('2d');ctx.setTransform(SC,0,0,SC,0,0);
    var T='Arial,"Helvetica Neue",Helvetica,sans-serif';
    ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,CW,CH);
    ctx.strokeStyle=ENC;ctx.lineWidth=6;ctx.strokeRect(24,24,CW-48,CH-48);

    ctx.strokeStyle=ENC;ctx.lineWidth=1.5;ctx.lineCap='butt';ctx.beginPath();ctx.moveTo(CW-340,640);ctx.lineTo(CW-112,640);ctx.stroke();
    ctx.textAlign='center';ctx.fillStyle=DOUX;ctx.font='400 16px '+T;ctx.fillText(CONFIG.signataire,CW-226,664);
    ctx.font='500 14px '+T;ctx.fillText(L('Référence : ','Reference: ')+ref,CW/2,712);
    ctx.font='400 12.5px '+T;ctx.fillText(L('Attestation de suivi délivrée par ce cours de formation. Elle n’est ni émise ni reconnue par Anthropic.','Certificate of completion issued by this training course. It is neither issued nor recognized by Anthropic.'),CW/2,738);
  }
  function pdfDepuisCanvas(cv){
    var b64=cv.toDataURL('image/jpeg',0.93).split(',')[1],bin=atob(b64),jpg=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)jpg[i]=bin.charCodeAt(i);
    var enc=new TextEncoder(),parts=[],pos=0,offs={};
    function add(x){var u=(typeof x==='string')?enc.encode(x):x;parts.push(u);pos+=u.length;}
    function pad(n){var s=String(n);while(s.length<10)s='0'+s;return s;}
    var d=new Date();function z(n){return (n<10?'0':'')+n;}
    var dateP='D:'+d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+z(d.getHours())+z(d.getMinutes())+z(d.getSeconds());
    add('%PDF-1.4\n');add(new Uint8Array([37,226,227,207,211,10]));
    offs[1]=pos;add('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
    offs[2]=pos;add('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
    offs[3]=pos;add('3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 841.89 595.28] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>\nendobj\n');
    var cs='q 841.89 0 0 595.28 0 0 cm /Im0 Do Q\n';
    offs[4]=pos;add('4 0 obj\n<< /Length '+cs.length+' >>\nstream\n'+cs+'endstream\nendobj\n');
    offs[5]=pos;add('5 0 obj\n<< /Type /XObject /Subtype /Image /Width '+cv.width+' /Height '+cv.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg.length+' >>\nstream\n');
    add(jpg);add('\nendstream\nendobj\n');
    offs[6]=pos;add('6 0 obj\n<< /Title ('+L('Certificat de reussite - Cours Claude niveau expert','Certificate of Achievement - Claude expert course')+') /Producer (Cours Claude) /CreationDate ('+dateP+') >>\nendobj\n');
    var xr=pos;add('xref\n0 7\n0000000000 65535 f \n');for(var n=1;n<=6;n++)add(pad(offs[n])+' 00000 n \n');
    add('trailer\n<< /Size 7 /Root 1 0 R /Info 6 0 R >>\nstartxref\n'+xr+'\n%%EOF\n');
    return new Blob(parts,{type:'application/pdf'});
  }
  function nomFichier(nom){var s=nom.normalize?nom.normalize('NFD').replace(/[̀-ͯ]/g,''):nom;s=s.replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'');return L('Certificat-Claude-Expert-','Certificate-Claude-Expert-')+(s||L('apprenant','learner'))+'.pdf';}
  function telecharger(blob,nom){var url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=nomFichier(nom);document.body.appendChild(a);a.click();setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},1500);}
  function genId(){var al='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',out='',arr=new Uint8Array(6);if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(arr);else for(var i=0;i<6;i++)arr[i]=Math.floor(Math.random()*256);for(var k=0;k<6;k++)out+=al.charAt(arr[k]%al.length);return 'CX-'+new Date().getFullYear()+'-'+out;}
  var LOGO=null;
  function logo(){return new Promise(function(res){if(LOGO){res();return;}var el=document.querySelector('.logo-badge'),m=el&&/url\("?([^")]+)"?\)/.exec(getComputedStyle(el).backgroundImage);if(!m){res();return;}var im=new Image();im.onload=function(){LOGO=im;res();};im.onerror=function(){res();};im.src=m[1];setTimeout(res,2000);});}
  var dernierBlob=null,dernierNom='';

    var s=stats(),msg=document.getElementById('msgCert');if(!eligible(s))return;

    if(nom.length<2){msg.className='msg err';msg.textContent=L('Saisissez votre nom complet pour générer le certificat.','Enter your full name to generate the certificate.');nomInput.focus();return;}
    if(S.cert.nom!==nom||!S.cert.id){S.cert={nom:nom,id:genId(),date:new Date().toISOString()};sauver();}
    var dateTxt=new Date(S.cert.date).toLocaleDateString(EN?'en-GB':'fr-FR',{day:'numeric',month:'long',year:'numeric'});
    var btn=this;btn.disabled=true;msg.className='msg';msg.textContent=L('Génération du certificat…','Generating the certificate…');
    logo().then(function(){
      var cv=document.getElementById('certCanvas');dessiner(cv,nom,s.pct,dateTxt,S.cert.id);

  function fallback(txt,cb){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');cb();}catch(e){}document.body.removeChild(ta);}

      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok,function(){fallback(txt,ok);});else fallback(txt,ok);
    });

  var exos=document.querySelectorAll('.exo input'),EXKEY='cours-claude-expert-exercices-v1',exState={};
  try{exState=JSON.parse(localStorage.getItem(EXKEY)||'{}')||{};}catch(e){exState={};}
  exos.forEach(function(cb,i){
    if(exState[i]){cb.checked=true;cb.closest('.exo').classList.add('fait');}
    cb.addEventListener('change',function(){cb.closest('.exo').classList.toggle('fait',cb.checked);exState[i]=cb.checked;try{localStorage.setItem(EXKEY,JSON.stringify(exState));}catch(e){}});
  });
  var lat=document.getElementById('lateral'),mb=document.getElementById('menuBtn');
  function fermer(){lat.classList.remove('ouvert');mb.setAttribute('aria-expanded','false');}

  var LATK='cours-claude-expert-sommaire',btnRep=document.getElementById('latReplier'),btnOuv=document.getElementById('latOuvrir');

    btnRep.setAttribute('aria-expanded',f?'false':'true');btnOuv.setAttribute('aria-expanded',f?'false':'true');
    if(memo){try{localStorage.setItem(LATK,f?'1':'0');}catch(e){}}
  }
  var latF=false;try{latF=localStorage.getItem(LATK)==='1';}catch(e){}
  replier(latF,false);
  btnRep.addEventListener('click',function(){replier(true,true);btnOuv.focus();});
  btnOuv.addEventListener('click',function(){replier(false,true);btnRep.focus();});
  /* Fermer la barre latérale quand on touche ou clique en dehors */
  function horsBarre(e){
    if(!lat.classList.contains('ouvert'))return;
    if(lat.contains(e.target)||mb.contains(e.target))return;
    e.preventDefault();e.stopPropagation();fermer();
  }
  document.addEventListener('click',horsBarre,true);
  var liens=document.querySelectorAll('#nav a'),secs=document.querySelectorAll('section.module');
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(en){en.forEach(function(x){if(x.isIntersecting){var id='#'+x.target.id;liens.forEach(function(l){l.classList.toggle('actif',l.getAttribute('href')===id);});}});},{rootMargin:'-20% 0px -70% 0px'});
    secs.forEach(function(s){io.observe(s);});
  }
  var dlg=document.getElementById('dlgReset'),dlgOk=document.getElementById('dlgOk'),dlgConf=document.getElementById('dlgConfirmer');
  function effacer(){try{localStorage.removeItem(KEY);localStorage.removeItem(EXKEY);}catch(e){}location.reload();}
  document.getElementById('reset').addEventListener('click',function(){
    if(!dlg||typeof dlg.showModal!=='function'){if(confirm(L('Action définitive : effacer toute votre progression sur cet appareil ?','Permanent action: erase all your progress on this device?')))effacer();return;}
    dlgOk.checked=false;dlgConf.disabled=true;document.getElementById('dlgCert').hidden=!eligible(stats());dlg.showModal();
  });
  dlgOk.addEventListener('change',function(){dlgConf.disabled=!dlgOk.checked;});
  document.getElementById('dlgAnnuler').addEventListener('click',function(){dlg.close();});
  dlgConf.addEventListener('click',function(){if(dlgOk.checked){dlg.close();effacer();}});
  majProgres();majCert();
})();

</script>
<script>
(function(){
  var EN=(window.LANG==='en');
  function L(fr,en){return EN?en:fr;}
  var $=function(id){return document.getElementById(id);};
  function v(id){var e=$(id);return e?e.value.trim():'';}
  function n(id){var x=parseFloat(String(v(id)).replace(',','.'));return isFinite(x)?x:0;}
  function nf(x){return String(Math.round(x)).replace(/\B(?=(\d{3})+(?!\d))/g,EN?',':' ');}
  function pc(x){return EN?x+'%':x+' %';}
  function lignes(t){return String(t||'').split(/\n+/).map(function(s){return s.trim().replace(/^[-•]\s*/,'');}).filter(Boolean);}
  function sansPoint(s){return s.replace(/[.\s]+$/,'');}
  function role(s){return sansPoint(s.replace(/^(tu es|you are)\s+/i,''));}
  function copier(txt,btn){
    function ok(){if(!btn)return;var t=btn.textContent;btn.textContent=L('Copié','Copied');setTimeout(function(){btn.textContent=t;},1500);}
    function f(){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok();}catch(e){}document.body.removeChild(ta);}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok,f);else f();
  }
  function lier(ids,fn){ids.forEach(function(id){var e=$(id);if(e){e.addEventListener('input',fn);e.addEventListener('change',fn);}});fn();}
  function bouton(id,fn){var b=$(id);if(b)b.addEventListener('click',function(){var o=fn();if(o)copier(o,b);});}

  /* 1. Positionnement */
  var pos=document.querySelectorAll('#positionnement input[type=checkbox]');
  function majPos(){
    var k=0;pos.forEach(function(c){if(c.checked)k++;});var t;
    if(!k)t=L('Cochez les cases pour voir votre orientation.','Tick the boxes to see your recommendation.');
    else if(k<=3)t=k+' / 8 : '+L('refaites d’abord le cours intermédiaire (au moins les modules 2, 3, 8 et 9). Ce cours restera difficile à exploiter sans ces bases.','take the intermediate course first (at least modules 2, 3, 8 and 9). This course will be hard to benefit from without these basics.');
    else if(k<=6)t=k+' / 8 : '+L('vous pouvez suivre ce cours. Révisez au passage les points non cochés dans le cours intermédiaire.','you can take this course. Along the way, review the unticked points in the intermediate course.');
    else t=k+' / 8 : '+L('vous avez toutes les bases. Place à l’expertise.','you have all the basics. Time for expertise.');
    $('posResultat').textContent=t;
  }
  pos.forEach(function(c){c.addEventListener('change',majPos);});

  /* 2. Tokens et coût */
  lier(['tkTexte','tkSortie','tkFen','tkPrixE','tkPrixS','tkNb','tkTaux'],function(){
    var e=Math.ceil(($('tkTexte').value||'').length/3.5),s=Math.ceil(n('tkSortie')*1.4);
    var c1=(e*n('tkPrixE')+s*n('tkPrixS'))/1e6*n('tkTaux');
    $('tkE').textContent=nf(e);$('tkS').textContent=nf(s);
    $('tkC1').textContent=c1<1&&c1>0?(EN?c1.toFixed(4):c1.toFixed(2).replace('.',',')):nf(c1);
    $('tkCm').textContent=nf(c1*n('tkNb'));
    var f=n('tkFen'),p=f>0?(e+s)/f*100:0;
    $('tkPct').textContent=p>0&&p<0.1?L('moins de 0,1 %','less than 0.1%'):pc(EN?p.toFixed(1):p.toFixed(1).replace('.',','));
    var j=$('tkJauge');j.style.width=Math.min(100,p)+'%';j.className=p>70?'rouge':(p>40?'chaud':'');
  });

  /* 3. Générateur de prompt expert */
  function genPrompt(){
    var p=[],r=v('pgRole');
    var T=EN?{obj:'goal',ctx:'context',docs:'documents',doc:'document',nom:'name',tache:'task',regles:'rules',fmt:'format',verif:'verification',cit:'quotes',cont:'content of '}
            :{obj:'objectif',ctx:'contexte',docs:'documents',doc:'document',nom:'nom',tache:'tâche',regles:'règles',fmt:'format',verif:'vérification',cit:'citations',cont:'contenu de '};
    function bal(k,x){return '<'+k+'>\n'+x+'\n</'+k+'>';}
    if(r)p.push(L('Tu es ','You are ')+role(r)+'.');
    if(v('pgObjectif'))p.push(bal(T.obj,v('pgObjectif')));
    if(v('pgContexte'))p.push(bal(T.ctx,v('pgContexte')));
    var docs=lignes($('pgDocs').value);
    if(docs.length)p.push(bal(T.docs,docs.map(function(d){return '<'+T.doc+' '+T.nom+'="'+d+'">['+T.cont+d+']</'+T.doc+'>';}).join('\n')));
    var et=lignes($('pgEtapes').value);
    if($('pgCit').checked&&docs.length)et.unshift(L('Extrais d’abord dans <citations> les passages exacts des documents utiles à la tâche, puis appuie-toi uniquement sur eux.','First extract into <quotes> the exact passages of the documents that are useful for the task, then rely only on them.'));
    if(et.length)p.push(bal(T.tache,et.map(function(x,i){return (i+1)+'. '+x;}).join('\n')));
    var rg=lignes($('pgRegles').value);
    if(rg.length)p.push(bal(T.regles,rg.map(function(x){return '- '+x;}).join('\n')));
    if(v('pgFormat'))p.push(bal(T.fmt,v('pgFormat')));
    var vf=[];
    if($('pgDoute').checked)vf.push(L('Si une information manque ou si tu n’es pas sûr, dis-le clairement au lieu de supposer : tu as le droit de répondre « je ne sais pas ».','If information is missing or you are not sure, say so clearly instead of assuming: you are allowed to answer "I don’t know".'));
    if($('pgConf').checked)vf.push(L('Termine par ton niveau de confiance (élevé, moyen, faible) et les hypothèses que tu as faites.','End with your confidence level (high, medium, low) and the assumptions you made.'));
    if(vf.length)p.push(bal(T.verif,vf.join('\n')));
    var out=p.join('\n\n');$('pgSortie').textContent=out||L('Renseignez au moins un champ.','Fill in at least one field.');return out;
  }
  lier(['pgRole','pgFormat','pgObjectif','pgContexte','pgDocs','pgEtapes','pgRegles','pgCit','pgDoute','pgConf'],genPrompt);
  bouton('pgCopier',genPrompt);

  /* 4. Auditeur de prompt (critères valables en français et en anglais) */
  var CRIT=[
    [L('Rôle ou point de vue défini','Role or point of view defined'),/\b(tu es|vous êtes|en tant que|agis comme|rôle|you are|act as|as an?|role)\b/i,L('Ajoutez un rôle : « Tu es … ».','Add a role: "You are …".')],
    [L('Objectif ou usage du résultat expliqué','Goal or use of the result explained'),/(objectif|afin de|pour que|servira|but|je dois|j’ai besoin|j'ai besoin|goal|purpose|so that|in order to|will be used|i need|i must)/i,L('Expliquez le pourquoi : à quoi servira le résultat.','Explain the why: what the result will be used for.')],
    [L('Contexte (public, situation, contraintes locales)','Context (audience, situation, local constraints)'),/(contexte|client|public|entreprise|situation|destinataire|sénégal|fcfa|context|customer|audience|company|business|reader)/i,L('Décrivez la situation et le public.','Describe the situation and the audience.')],
    [L('Données délimitées par des balises','Data delimited by tags'),/<[a-zà-ÿ_]+[^>]*>/i,L('Encadrez documents et données avec des balises : <document>…</document>.','Wrap documents and data in tags: <document>…</document>.')],
    [L('Tâche découpée en étapes','Task broken into steps'),/(^|\n)\s*(\d+[.)]|-|•)\s+\S/,L('Découpez la tâche en étapes numérotées.','Break the task into numbered steps.')],
    [L('Format de sortie précisé','Output format specified'),/(tableau|liste|json|paragraphe|format|colonnes|mots maximum|\d+\s*mots|puces|courriel|plan|table|list|paragraph|columns|bullet|email|outline|\d+\s*words)/i,L('Précisez le format : structure, longueur, ton.','Specify the format: structure, length, tone.')],
    [L('Critère mesurable (longueur, nombre, seuil)','Measurable criterion (length, number, threshold)'),/\d+\s*(mots|lignes|points|pages|caractères|%|exemples|propositions|questions|words|lines|characters|examples|ideas|bullets)/i,L('Remplacez « court » par un critère chiffré (ex. 150 mots maximum).','Replace "short" with a numeric criterion (e.g. 150 words maximum).')],
    [L('Exemples fournis','Examples provided'),/(exemple|par exemple|<exemples?>|comme ceci|example|for instance|e\.g\.|like this)/i,L('Ajoutez un ou plusieurs exemples du résultat attendu.','Add one or more examples of the expected result.')],
    [L('Conduite en cas de doute','What to do when in doubt'),/(si (une|l’|l')?\s*information manque|ne sais pas|n’invente|n'invente|pose-moi|signale|incertain|à vérifier|don’t know|don't know|do not invent|don't invent|ask me|flag|uncertain|if .{0,20}missing|not sure)/i,L('Dites quoi faire en cas de doute : poser la question, ne pas inventer.','Say what to do when in doubt: ask, do not invent.')],
    [L('Pas d’injonctions en majuscules','No commands in capital letters'),null,L('Remplacez les MAJUSCULES et les « !!! » par une raison claire.','Replace CAPITALS and "!!!" with a clear reason.')]
  ];
  function audit(){
    var t=$('auTexte').value,ul=$('auListe');ul.innerHTML='';
    if(!t.trim()){$('auScore').textContent='–';$('auJauge').style.width='0';return;}
    var ok=0;
    CRIT.forEach(function(c){
      var r=c[1]?c[1].test(t):!(/\b[A-ZÀ-Ý]{5,}\b.*\b[A-ZÀ-Ý]{5,}\b/.test(t)||/!!/.test(t));
      if(r)ok++;
      var li=document.createElement('li');li.className=r?'ok':'ko';li.textContent=c[0]+(r?'':(EN?': ':' : ')+c[2]);ul.appendChild(li);
    });
    var mots=t.trim().split(/\s+/).length;
    var li=document.createElement('li');li.className=mots>=25?'ok':'ko';
    li.textContent=mots>=25?L('Longueur suffisante pour une tâche complexe ('+mots+' mots).','Sufficient length for a complex task ('+mots+' words).')
      :L('Prompt très court ('+mots+' mots) : suffisant pour une tâche simple, insuffisant pour une tâche complexe.','Very short prompt ('+mots+' words): enough for a simple task, not enough for a complex one.');
    ul.appendChild(li);
    if(mots>=25)ok++;
    var sc=Math.round(ok/11*10);$('auScore').textContent=sc+' / 10';
    var j=$('auJauge');j.style.width=(sc*10)+'%';j.className=sc<5?'rouge':(sc<8?'chaud':'');
  }
  lier(['auTexte'],audit);

  /* 5. Choix de l'approche */

  function fermer(){lat.classList.remove('ouvert');mb.setAttribute('aria-expanded','false');}
  function fallback(txt,cb){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');cb();}catch(e){}document.body.removeChild(ta);}
  function copier(btn,txt){
    function ok(){var t=btn.textContent;btn.textContent=L('Copié','Copied');setTimeout(function(){btn.textContent=t;},1500);}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok,function(){fallback(txt,ok);});else fallback(txt,ok);
  }
  function chargerLic(){
    try{var x=JSON.parse(localStorage.getItem(LKEY)||'{}')||{};if(x.id&&idVersOctets(x.id))LIC.id=x.id;if(x.cle)LIC.cle=x.cle;}catch(e){}
    if(!LIC.id){LIC.id=idAleatoire();try{localStorage.setItem(LKEY,JSON.stringify({id:LIC.id,cle:LIC.cle}));}catch(e){}}
  }
  function sauverLic(){try{localStorage.setItem(LKEY,JSON.stringify(LIC));}catch(e){}}
  function fcfaTxt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,EN?',':' ')+' FCFA';}
  function nbApp(n){return n+(EN?(' device'+(n>1?'s':'')):(' appareil'+(n>1?'s':'')));}
  function dateLic(j){return new Date((EPOCH_JOURS+j)*86400000).toLocaleDateString(EN?'en-GB':'fr-FR',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});}
  function verifierLic(cle){
    var r=lireCle(cle,LICENCE.cle,PRODUIT);
    if(!r.ok)return r;
    if(r.idAppareil!==b32norm(LIC.id))return {ok:false,raison:'appareil'};
    if(r.expire&&joursAujourdhui()>r.expire)return {ok:false,raison:'expiree',expire:r.expire};
    return r;
  }
  var MSG={
    produit:L('Cette clé correspond à un autre cours (débutant ou intermédiaire). Utilisez une clé du cours expert.','This key belongs to another course (beginner or intermediate). Use a key for the expert course.'),
    format:L('Clé incomplète : elle compte 128 caractères. Copiez-la en entier, sans rien ajouter.','Incomplete key: it is 128 characters long. Copy all of it, without adding anything.'),
    signature:L('Clé non reconnue. Vérifiez qu’elle est copiée en entier, sans caractère en trop.','Key not recognized. Check that it is copied in full, with no extra characters.'),
    appareil:L('Cette clé est liée à un autre appareil. Envoyez au vendeur le code affiché sur cet écran pour obtenir la vôtre.','This key is linked to another device. Send the seller the code shown on this screen to get your own.'),
    expiree:L('Cette clé a expiré. Contactez le vendeur pour la renouveler.','This key has expired. Contact the seller to renew it.'),
    version:L('Cette clé ne correspond pas à ce cours.','This key does not match this course.'),
    navigateur:L('Votre navigateur est trop ancien pour vérifier la clé. Mettez-le à jour ou utilisez Chrome.','Your browser is too old to check the key. Update it or use Chrome.'),
    erreur:L('Erreur de vérification. Réessayez.','Verification error. Please try again.')
  };
  function ouvrirCours(r){
    document.body.classList.remove('apercu','vue-activation');
    $('licenceTexte').textContent=L('Licence n° ','Licence no. ')+('0000'+r.serial).slice(-4)+' · '+nbApp(r.appareils)+' · '+(r.expire?L('valable jusqu’au ','valid until ')+dateLic(r.expire):L('accès illimité','unlimited access'));
  }
  function montrerActivation(){fermer();document.body.classList.add('vue-activation');window.scrollTo(0,0);}
  function retourApercu(){document.body.classList.remove('vue-activation');window.scrollTo(0,0);}

  chargerLic();
  ['btnActiverBandeau','btnActiverTeaser','btnActiverLat'].forEach(function(id){var b=$(id);if(b)b.addEventListener('click',montrerActivation);});
  $('actRetour').addEventListener('click',retourApercu);
  document.querySelectorAll('#nav a').forEach(function(a){
    var sec=document.getElementById((a.getAttribute('href')||'').slice(1));
    if(sec&&sec.hasAttribute('data-payant')){
      a.classList.add('verrouille');
      a.addEventListener('click',function(e){if(document.body.classList.contains('apercu')){e.preventDefault();montrerActivation();}});
    }
  });

  /* Formules et paiement */
  var tb=$('actPrix'),choix=0,lignes=[],moyen='';
  LICENCE.formules.forEach(function(f,i){
    var tr=document.createElement('tr'),td0=document.createElement('td'),lb=document.createElement('label'),rd=document.createElement('input');
    rd.type='radio';rd.name='formule';rd.id='formule'+i;rd.value=i;rd.checked=(i===0);
    lb.setAttribute('for',rd.id);lb.appendChild(rd);lb.appendChild(document.createTextNode(nbApp(f.appareils)));
    td0.appendChild(lb);tr.appendChild(td0);
    [fcfaTxt(f.prix),fcfaTxt(Math.round(f.prix/f.appareils))].forEach(function(v,k){var td=document.createElement('td');td.textContent=v;if(k===0)td.style.fontWeight='700';tr.appendChild(td);});
    tr.addEventListener('click',function(e){if(e.target!==rd)rd.checked=true;choisir(i);});
    rd.addEventListener('change',function(){choisir(i);});
    tb.appendChild(tr);lignes.push(tr);
  });
  function choisir(i){choix=i;lignes.forEach(function(tr,k){tr.classList.toggle('sel',k===i);});majPaiement();}
  function majPaiement(){
    var f=LICENCE.formules[choix];
    $('payFormule').textContent=nbApp(f.appareils)+(EN?': ':' : ')+fcfaTxt(f.prix);
    $('payMulti').hidden=!(f.appareils>1);
    if(!moyen)return;
    $('payPanel').hidden=false;
    $('payTitre').textContent=L('Paiement par ','Payment by ')+moyen;
    $('payApp').textContent=moyen;
    $('payNum').textContent=LICENCE.numero;
    $('payMontant').textContent=fcfaTxt(f.prix);
    var w=$('payWA');
    w.href='https://wa.me/'+LICENCE.whatsapp+'?text='+encodeURIComponent(L(
      'Bonjour, j’ai payé '+fcfaTxt(f.prix)+' par '+moyen+' pour la formule '+nbApp(f.appareils)+' du cours Claude, niveau expert. Code de mon appareil : '+groupe(b32norm(LIC.id),4,'-'),
      'Hello, I paid '+fcfaTxt(f.prix)+' by '+moyen+' for the '+nbApp(f.appareils)+' plan of the Claude expert-level course. My device code: '+groupe(b32norm(LIC.id),4,'-')));
    w.hidden=false;
  }
  document.querySelectorAll('.pay-btn').forEach(function(b){
    b.addEventListener('click',function(){
      moyen=b.getAttribute('data-moyen');
      document.querySelectorAll('.pay-btn').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});
      majPaiement();
    });
  });
  $('payCopier').addEventListener('click',function(){copier(this,LICENCE.numero.replace(/\s+/g,''));});
  choisir(0);
  $('actContact').textContent=LICENCE.contact;
  var pm=$('actPaiement');pm.textContent=LICENCE.paiement;pm.hidden=false;

  /* Code de l'appareil */
  var code=groupe(b32norm(LIC.id),4,'-');
  $('actCode').textContent=code;
  $('actCopier').addEventListener('click',function(){copier(this,code);});
  var wa=$('actWA');
  wa.href='https://wa.me/'+LICENCE.whatsapp+'?text='+encodeURIComponent(L('Bonjour, je souhaite activer le cours Claude, niveau expert. Code de mon appareil : ','Hello, I would like to activate the Claude expert-level course. My device code: ')+code);
  wa.hidden=false;

  /* Saisie de la clé */
  var msg=$('actMsg'),ta=$('actCle');
  $('actValider').addEventListener('click',function(){
    var r=verifierLic(ta.value);
    if(!r.ok){msg.className='msg err';msg.textContent=MSG[r.raison]||MSG.erreur;return;}
    LIC.cle=ta.value.trim();sauverLic();msg.className='msg ok';msg.textContent=L('Cours activé. Bonne formation !','Course activated. Enjoy the course!');ouvrirCours(r);window.scrollTo(0,0);
  });

  /* Au chargement : clé déjà enregistrée ? */
  var revenir=false;try{revenir=sessionStorage.getItem('cours-claude-expert-vue')==='activation';sessionStorage.removeItem('cours-claude-expert-vue');}catch(e){}
  if(LIC.cle){
    var r0=verifierLic(LIC.cle);
    if(r0.ok)ouvrirCours(r0);
    else{ta.value=LIC.cle;msg.className='msg err';msg.textContent=MSG[r0.raison]||MSG.erreur;montrerActivation();}
  }else if(revenir)montrerActivation();
})();

</script>
</body>
</html>
